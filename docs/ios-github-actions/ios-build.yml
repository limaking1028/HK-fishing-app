# Backup iOS build. Manual only (workflow_dispatch) — never runs on push/PR.
# Unsigned simulator build; no secrets used.
name: iOS build (manual, unsigned)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run ios:sync
      - name: Build for simulator (unsigned)
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
