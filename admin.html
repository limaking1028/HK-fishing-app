<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>管理後台 · 釣港</title>
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#f7f9fc; --tx:#0f172a; --mu:#566478; --bd:#dbe2ec;
  --brand:#0a4a9a; --brand-tx:#ffffff; --brand-weak:#e7effb;
  --ok:#0f7b3f; --ok-weak:#e3f5ea; --warn:#8f5200; --warn-weak:#fdf1dc; --bad:#b42318; --bad-weak:#fde8e6;
  --r:12px; --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.05);
  --ring:0 0 0 3px rgba(10,74,154,.35);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b1220; --surface:#111a2b; --surface-2:#0e1626; --tx:#e8eef7; --mu:#9db0c8; --bd:#24324a;
  --brand:#5aa5ff; --brand-tx:#061326; --brand-weak:#13233d;
  --ok:#4ade80; --ok-weak:#0f2a1b; --warn:#fbbf24; --warn-weak:#2d2308; --bad:#f87171; --bad-weak:#341517;
  --shadow:0 1px 2px rgba(0,0,0,.4); --ring:0 0 0 3px rgba(90,165,255,.45);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","Noto Sans CJK HK","Noto Sans TC",sans-serif;font-variant-numeric:tabular-nums}
a{color:var(--brand)}
button{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ---- 版面 ---- */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:18px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.brand img{width:36px;height:36px;border-radius:10px}
.brand b{display:block;font-size:17px;line-height:1.2}
.brand span{font-size:12px;color:var(--mu)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:0 12px;min-height:44px;border-radius:10px;color:var(--mu);text-decoration:none;font-weight:500;cursor:pointer;transition:background .18s,color .18s}
.nav a:hover{background:var(--surface-2);color:var(--tx)}
.nav a[aria-current=page]{background:var(--brand-weak);color:var(--brand);font-weight:600}
.nav .badge{margin-left:auto}
.side .foot{margin-top:auto;border-top:1px solid var(--bd);padding:14px 8px 0;font-size:13px;color:var(--mu)}
.side .foot .who{display:block;color:var(--tx);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:8px}
.main{min-width:0;padding:24px 28px 40px;max-width:1180px;width:100%}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:22px;margin:0;line-height:1.3}
.top .sp{flex:1}
.top small{color:var(--mu);font-size:12px}
.mbar{display:none}
.tabbar{display:none}

/* ---- 元件 ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--bd);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;transition:background .18s,border-color .18s,transform .08s;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--mu)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-tx)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost-bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--bd))}
.card{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin:0 0 4px;line-height:1.4}
.card .hint{color:var(--mu);font-size:13px;margin:0 0 12px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:13px;color:var(--mu);display:flex;align-items:center;gap:8px}
.kpi .v{font-size:30px;font-weight:700;line-height:1.2;letter-spacing:-.5px}
.kpi .s{font-size:12px;color:var(--mu)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--bad);color:#fff;font-size:12px;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--mu);border:1px solid var(--bd);white-space:nowrap}
.pill.ok{background:var(--ok-weak);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--bad-weak);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-weak);color:var(--warn);border-color:transparent}
.pill.brand{background:var(--brand-weak);color:var(--brand);border-color:transparent}
.alert{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r);background:var(--warn-weak);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);margin-bottom:12px;font-weight:600}
.alert .btn{margin-left:auto}
.two{grid-template-columns:1.2fr 1fr}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{min-height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--bd);background:var(--surface);cursor:pointer;font-size:13px;font-weight:600;color:var(--mu)}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--brand-tx)}
input[type=search],input[type=text],input[type=email],input[type=password],textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--surface);color:var(--tx);font:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:var(--ring)}
label.f{display:block;font-size:13px;font-weight:600;margin:0 0 6px}

/* ---- 圖表 ---- */
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:20px;border-bottom:1px solid var(--bd)}
.bars .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.bars .c i{display:block;width:100%;max-width:34px;background:var(--brand);border-radius:6px 6px 0 0;min-height:3px;opacity:.9}
.bars .c b{font-size:11px;color:var(--mu);font-weight:600;margin-bottom:3px}
.xl{display:flex;gap:6px;margin-top:6px}
.xl span{flex:1;text-align:center;font-size:11px;color:var(--mu);min-width:0}
.hb{display:grid;grid-template-columns:minmax(120px,38%) 1fr auto;align-items:center;gap:10px;margin:9px 0;font-size:13px}
.hb .t{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden;border:1px solid var(--bd)}
.hb .t i{display:block;height:100%;background:var(--brand);border-radius:5px}
.hb b{min-width:64px;text-align:right}
details.tbl summary{cursor:pointer;color:var(--brand);font-size:13px;font-weight:600;margin-top:10px;min-height:32px;display:flex;align-items:center}

/* ---- 相片 ---- */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ph{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.ph button.im{all:unset;display:block;cursor:zoom-in;position:relative}
.ph button.im:focus-visible{box-shadow:inset var(--ring)}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--surface-2)}
.ph .m{padding:10px;font-size:13px;display:flex;flex-direction:column;gap:6px;line-height:1.35}
.ph .m .u{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--brand)}
.ph .m .d{color:var(--mu);font-size:12px}
.noimg{aspect-ratio:1;display:grid;place-items:center;color:var(--mu);background:var(--surface-2);font-size:12px}
.rv-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin:12px 0}
.rv-photos .ph .m{padding:6px 8px;font-size:12px}

/* ---- 表格（桌面）／卡片（手機）---- */
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-size:12px;color:var(--mu);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--bd);background:var(--surface-2);position:sticky;top:0}
table.t td{padding:12px;border-bottom:1px solid var(--bd);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t .sub{display:block;color:var(--mu);font-size:12px}
table.t td.num{font-variant-numeric:tabular-nums}
.act{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}

/* ---- 狀態 ---- */
.sk{background:linear-gradient(90deg,var(--surface-2),var(--bd),var(--surface-2));background-size:200% 100%;animation:sk 1.2s infinite linear;border-radius:var(--r);min-height:92px}
@keyframes sk{to{background-position:-200% 0}}
.empty{text-align:center;padding:48px 16px;color:var(--mu)}
.empty svg{width:40px;height:40px;margin-bottom:8px;opacity:.7}
.empty b{display:block;color:var(--tx);font-size:16px;margin-bottom:4px}
.err{border-color:var(--bad);background:var(--bad-weak);color:var(--bad)}

/* ---- Dialog / Toast ---- */
dialog{border:1px solid var(--bd);border-radius:16px;background:var(--surface);color:var(--tx);padding:0;width:min(440px,calc(100vw - 32px));box-shadow:0 24px 64px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(5,12,25,.6)}
dialog .in{padding:20px}
dialog h3{margin:0 0 8px;font-size:18px}
dialog p{margin:0 0 14px;color:var(--mu)}
dialog .row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
dialog.lb{width:auto;max-width:min(96vw,980px);background:transparent;border:0;box-shadow:none;overflow:visible}
dialog.lb img{display:block;max-width:96vw;max-height:84vh;border-radius:12px;margin:auto}
dialog.lb .cap{color:#fff;text-align:center;margin-top:10px;font-size:14px}
dialog.lb .x{position:absolute;top:-8px;right:-4px;background:#fff;color:#000;border-radius:50%;width:44px;height:44px;border:0;display:grid;place-items:center;cursor:pointer}
#toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 18px;border-radius:24px;font-size:14px;font-weight:500;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100vw - 32px)}
#toast.show{opacity:1}
@media (min-width:1024px){#toast{bottom:28px}}

/* ---- 登入 ---- */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .card{width:min(400px,100%);padding:24px}
.login .brand{padding:0 0 16px}
.gbtn{width:100%;min-height:46px;background:#fff;color:#3c4043;border-color:#dadce0;font-size:15px}
.gbtn:hover{background:#f8f9fa;border-color:#c4c7c5}
.or{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:12px;margin:14px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--bd)}

/* ---- 響應式 ---- */
@media (max-width:1023px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:14px 14px 96px}
  .mbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--bd);padding:10px 14px}
  .mbar img{width:30px;height:30px;border-radius:8px}
  .mbar b{font-size:16px}
  .mbar .sp{flex:1}
  .top h1{font-size:19px}
  .tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(66px,1fr);overflow-x:auto;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--bd);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;font-size:12px;font-weight:600;color:var(--mu);text-decoration:none;position:relative;cursor:pointer}
  .tabbar a[aria-current=page]{color:var(--brand)}
  .tabbar .badge{position:absolute;top:6px;left:calc(50% + 6px)}
  .two{grid-template-columns:1fr}
}
@media (max-width:720px){
  table.t,table.t tbody,table.t tr,table.t td{display:block;width:100%}
  table.t thead{display:none}
  table.t tr{padding:12px;border-bottom:1px solid var(--bd)}
  table.t td{border:0;padding:4px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}
  table.t td::before{content:attr(data-l);color:var(--mu);font-size:12px;flex-shrink:0}
  table.t td.first{display:block}
  table.t td.first::before{display:none}
  table.t td.actions{justify-content:flex-end;padding-top:8px}
  table.t td.actions::before{display:none}
  .hb{grid-template-columns:1fr auto}
  .hb .t{grid-column:1/-1;order:3}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
const SB_URL='https://lucizjohiycxdynrkjus.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1Y2l6am9oaXljeGR5bnJranVzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0NTA2MjgsImV4cCI6MjEwNjAyNjYyOH0.O_fpj_TK9d1zDHHc5SciYaQkB_-meuFfpbrIQbsJboU';
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storage:window.localStorage}});
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=(n,cls)=>'<svg class="i'+(cls?' '+cls:'')+'" aria-hidden="true"><use href="#i-'+n+'"/></svg>';
const safeImg=u=>(typeof u==='string'&&u.indexOf(SB_URL+'/storage/')===0)?u:'';
const fmt=t=>t?new Date(t).toLocaleString('sv-SE',{timeZone:'Asia/Hong_Kong'}).slice(0,16):'—';
const ago=t=>{if(!t)return'從未登入';const d=(Date.now()-new Date(t))/864e5;return d<1?'今日':d<2?'昨日':Math.floor(d)+' 日前';};
const rt=c=>(window.lbLib&&lbLib.reasonText)?lbLib.reasonText(c):(c||'');
const toast=(m)=>{const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2600);};
async function rpc(name,args){const {data,error}=await sb.rpc(name,args||{});if(error)throw new Error(error.message||'發生錯誤');return data;}
const S={tab:'overview',detail:null,pending:0,fbNew:0,fbFilter:'new',photos:[],photoUser:null,photoUserName:'',photoFilter:'all',photoDone:false,users:[],queue:[],updated:null,email:''};
const TABS=[['overview','總覽','home'],['review','審核中心','shield'],['feedback','意見箱','chat'],['photos','相片牆','image'],['usage','使用分析','pulse'],['users','用戶','users'],['audit','操作記錄','log']];

/* ---------- Dialog ---------- */
function ask(o){ // {title, body, ok, danger, note}
  return new Promise(res=>{
    const d=$('dlg');
    $('dlgBody').innerHTML='<h3>'+esc(o.title)+'</h3><p>'+esc(o.body||'')+'</p>'
      +(o.note?'<label class="f" for="dnote">備註（可選）</label><input type="text" id="dnote" maxlength="200" autocomplete="off">':'')
      +'<div class="row"><button type="button" class="btn" id="dno">取消</button><button type="button" class="btn '+(o.danger?'bad':'pri')+'" id="dyes">'+esc(o.ok||'確定')+'</button></div>';

function oauthError(){

async function rpcR(name,args,reason){
  try{return await rpc(name,Object.assign({},args,{p_reason:reason||null}));}
  catch(e){if(/Could not find|schema cache|does not exist/i.test(e.message))return await rpc(name,args);throw e;}
}
async function refreshBadges(first){
  let b=null;
  try{b=await rpc('admin_badges');}
  catch(e){try{S.pending=(await rpc('admin_overview')).pending_reviews||0;}catch(_){}renderNav();return;}
  const oldP=S.pending,oldF=S.fbNew;
  S.pending=b.pending_reviews||0;S.fbNew=b.new_feedback||0;
  renderNav();
  const n=S.pending+S.fbNew;
  document.title=(n?'('+n+') ':'')+'釣港 管理後台';
  if(!first&&(S.pending>oldP||S.fbNew>oldF)&&window.Notification&&Notification.permission==='granted'){
    try{new Notification('釣港後台',{body:(S.pending>oldP?'有新嘅待審核項目 ':'')+(S.fbNew>oldF?'有新意見':''),icon:'icon-192.png'});}catch(e){}
  }
}

     return '<tr><td class="first" data-l="開始">'+esc(fmt(x.started_at))+'</td><td data-l="釣點">'+esc(x.spot||'—')+'</td><td data-l="時長">'+(mins==null?'<span class="pill warn">進行中</span>':Math.floor(mins/60)+'小時'+mins%60+'分')+'</td><td class="num" data-l="魚獲">'+esc(x.catch_count==null?'—':x.catch_count)+'</td>'
     +'<td data-l="快速計數">'+(tl.length?tl.map(e=>'<span class="pill">'+esc(e[0])+' '+esc(e[1])+'</span>').join(' '):'—')+'</td>'
     +'<td data-l="收成相">'+((x.haul_photos||[]).map(safeImg).filter(Boolean).map(u=>'<button class="im" type="button" aria-label="放大相片" style="border:0;padding:0;background:none;cursor:zoom-in" onclick="zoom(\''+esc(u)+'\',\'收成相\')"><img src="'+esc(u)+'" alt="" loading="lazy" style="width:44px;height:44px;object-fit:cover;border-radius:8px"></button>').join(' ')||'—')+'</td></tr>';}).join('')+'</tbody></table></div>':empty('trip','未有行程'))+'</section>';
  const fbs=d.feedback||[];
  if(fbs.length)h+='<section class="card" style="margin-top:12px"><h2>意見回饋</h2>'+fbs.map(f=>'<div style="padding:8px 0;border-bottom:1px solid var(--bd)"><span class="pill '+((FB_CAT[f.category]||[])[1]||'')+'">'+esc((FB_CAT[f.category]||FB_CAT.other)[0])+'</span> <span class="pill '+(f.status==='done'?'ok':'warn')+'">'+(f.status==='done'?'已處理':'未處理')+'</span> <small>'+esc(fmt(f.created_at))+'</small><p style="white-space:pre-wrap;word-break:break-word;margin:6px 0 0">'+esc(f.message)+'</p></div>').join('')+'</section>';
  const au=d.audit||[];
  if(au.length)h+='<section class="card" style="margin-top:12px"><h2>相關管理操作</h2>'+au.map(l=>{const a=AUDIT_ACT[l.action]||[l.action,''],dd=l.detail||{};return '<div style="padding:6px 0;border-bottom:1px solid var(--bd);font-size:13px"><span class="pill '+a[1]+'">'+esc(a[0])+'</span> '+esc(fmt(l.created_at))+' · '+esc(l.admin_email||'—')+(dd.reason?' · '+esc(dd.reason):'')+'</div>';}).join('')+'</section>';
  $('main').innerHTML=h;
}
async function banDetail(){
  const pr=S.ud.profile,to=!pr.banned;
  const r=await ask({title:(to?'停用':'恢復')+'帳戶？',body:'「'+(pr.display_name||pr.email)+'」'+(to?'：停用後無法登入，亦唔會再出現喺排行榜，已有記錄會保留。':'：恢復後可以重新登入同上榜。'),ok:to?'停用':'恢復',danger:to,note:true});
  if(!r)return;
  try{await rpcR('admin_set_ban',{p_user:pr.id,p_banned:to},r.note);toast('已更新');vUserDetail();}catch(e){toast(e.message);}
}
window.addEventListener('hashchange',()=>{const h=(location.hash||'').replace('#','');if(TABS.some(t=>t[0]===h)&&h!==S.tab&&$('main'))go(h);});
boot();
</script>
