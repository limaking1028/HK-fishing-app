<input hidden type="file" id="catch-photo" accept="image/*" capture="environment"><input hidden type="file" id="catch-photo-gallery" accept="image/*">

ng>潮汐／天文</strong><p id="astro-values" class="muted"></p></div><div class="row"><div><label class="field" for="catch-method">釣法<select id="catch-method"><option value="">未選</option><option value="手絲">手絲</option><option value="手竿">手竿</option><option value="投竿">投竿</option><option value="筏竿">筏竿</option><option value="岸釣">岸釣</option><option value="磯釣">磯釣</option><option value="前打">前打</option><option value="路亞">路亞</option><option value="沉底">沉底</option><option value="放流">放流</option><option value="船釣筏釣">船釣筏釣</option><option value="其他">其他</option></select></label><div id="other-method" hidden><label class="field" for="custom-method">自訂釣法<input id="custom-method" ></label></div></div><div><label class="field" for="catch-bait">釣餌<select id="catch-bait"><option value="">未選</option><option value="南極蝦">南極蝦</option><option value="青蟲">青蟲</option><option value="紅蟲">紅蟲</option><option value="蝦仁">蝦仁</option><option value="生蝦">生蝦</option><option value="生蠔">生蠔</option><option value="麵包">麵包</option><option value="練餌">練餌</option><option value="其他">其他</option></select></label><div id="other-bait" hidden><label class="field" for="custom-bait">自訂釣餌<input id="custom-bait" ></label></div></div></div><label class="field" for="catch-notes">備註<textarea id="catch-notes" rows="2" placeholder="例如流水、風向"></textarea></label></div></details></section><details class="elig" id="elig-box"><summary><span id="elig-title">上榜條件</span></summary><div class="details-body">
<ul><li id="elig-photo"></li><li id="elig-gps"></li><li id="elig-date"></li><li id="elig-species"></li><li id="elig-weight"></li><li id="elig-proof"></li><li>品種王者每個新魚種須審核一次。</li></ul>
<small>未符合都可以儲存魚獲記錄。</small></div></details><details id="test-mode-box" hidden><summary>管理員工具</summary><label class="muted"><input id="test-mode" type="checkbox"> 測試模式（略過 GPS／香港範圍，榜上只限管理員可見）</label></details><div id="form-error" class="error" role="alert"></div><div class="bar"><button id="previous" type="button" hidden>上一步</button><button id="next" class="primary" type="button" hidden>下一步</button><button id="submit-catch" class="primary" type="submit">送出魚獲記錄</button></div></form>
<section id="success" class="success" hidden><span class="check" aria-hidden="true">✓</span><h2>魚獲已記錄！</h2><p id="success-status" class="muted"></p><figure id="score-card-wrap" class="score"></figure><div class="actions"><button class="primary" id="reset" type="button">記錄下一條</button><button type="button" data-go="my">查看我的魚獲</button><button type="button" data-go="ranking">查看排行榜</button><button type="button" id="success-trip" data-go="trip">開始行程</button></div></section>

/* ============================================================
 * lib/weight.js — 重量單位換算（克 / 公斤 / 斤 / 兩）
 *
 * 標準重量 = 公斤（kg，精確到克）。所有排序、比較、排行榜都用標準重量。
 * 1 斤 = 16 兩 = 604.79 克（香港市制）；1 兩 = 37.7994 克
 *
 * 暴露 window.weightLib
 * ============================================================ */
(function () {
  'use strict';
  const GRAMS = { g: 1, kg: 1000, jin: 604.79, tael: 37.7994 };
  const NAMES = { g: '克', kg: '公斤', jin: '斤', tael: '兩' };
  const DECIMALS = { g: 0, kg: 2, jin: 1, tael: 1 };
  const UNITS = ['kg', 'g', 'jin', 'tael'];
  const MAX_KG = 60;               // 上限（約 100 斤），須同資料庫 weight 約束一致
  const DEFAULT_UNIT = 'kg';
  const PREF_KEY = 'hk_fishing_weight_unit';

  function isUnit(u) { return Object.prototype.hasOwnProperty.call(GRAMS, u); }
  function round3(x) { return Math.round(x * 1000) / 1000; }

  /** 任何單位 → 標準公斤（精確到克） */
  function toKg(value, unit) {
    const v = Number(value);
    if (!isFinite(v) || !isUnit(unit)) return NaN;
    return round3(v * GRAMS[unit] / 1000);
  }
  /** 標準公斤 → 指定單位（未捨入） */
  function fromKg(kg, unit) {
    return Number(kg) * 1000 / GRAMS[isUnit(unit) ? unit : DEFAULT_UNIT];
  }
  /** 舊版「斤」欄位 → 公斤（讀取舊資料用） */
  function jinToKg(jin) { return round3(Number(jin) * GRAMS.jin / 1000); }
  /** 公斤 → 舊版 weight 欄位（斤，2 位小數，最少 0.01 以符合 weight > 0 約束） */
  function legacyJin(kg) { return Math.max(0.01, Math.round(fromKg(kg, 'jin') * 100) / 100); }

  /** 格式化：返回 { value:'1.20', unit:'公斤', text:'1.20 公斤' } */
  function format(kg, unit) {
    const u = isUnit(unit) ? unit : DEFAULT_UNIT;
    const n = Number(kg);
    const v = isFinite(n) ? fromKg(n, u) : 0;
    const p = Math.pow(10, DECIMALS[u]);
    const value = (Math.round((v + Number.EPSILON) * p) / p).toFixed(DECIMALS[u]);   // v183：toFixed 對 0.605 會捨成 0.60，先 round 再出
    return { value, unit: NAMES[u], text: value + ' ' + NAMES[u] };
  }
  /** 其他單位對照，例如「= 1.20 公斤 · 2.0 斤 · 32.0 兩」 */
  function describeOthers(kg, exceptUnit) {
    return UNITS.filter(u => u !== exceptUnit).map(u => format(kg, u).text).join(' · ');
  }

  function getPref() {
    try { const u = localStorage.getItem(PREF_KEY); if (isUnit(u)) return u; } catch (e) {}
    return DEFAULT_UNIT;
  }
  function setPref(u) {
    if (!isUnit(u)) return;
    try { localStorage.setItem(PREF_KEY, u); } catch (e) {}
  }

  window.weightLib = {
    GRAMS, NAMES, UNITS, MAX_KG, DEFAULT_UNIT,
    isUnit, toKg, fromKg, jinToKg, legacyJin, format, describeOthers, getPref, setPref
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = window.weightLib;
})();

function show(screenName) {
  screen = screenName;
  form.hidden = screen !== 'form';
  get('success').hidden = screen !== 'success';
  get('destination').hidden = screen !== 'destination';
  get('trip-prompt').hidden = screen !== 'form' || activeTrip || dismissed;
  get('trip-status').hidden = screen !== 'form' || !activeTrip;
  get('success-trip').hidden = activeTrip;
  window.scrollTo(0, 0);
}

function setStep(index, scroll = true) {
  if (config.option !== 'b') return;
  step = index;
  document.querySelectorAll('[data-step]').forEach(button => {
    const current = +button.dataset.step === index;
    button.toggleAttribute('aria-current', current);
    if (current) button.setAttribute('aria-current', 'step');
    get('step-' + button.dataset.step).hidden = !current;
  });
  get('previous').hidden = index === 0;
  get('next').hidden = index === 3;
  get('submit-catch').hidden = index !== 3;
  if (index === 3) {
    get('review').textContent = [
      fishName() || '未選魚種',
      kg() > 0 ? get('catch-weight').value + ' ' + weightLib.NAMES[previousUnit] : '未填重量',
      spotName(), get('catch-date').value + ' ' + get('catch-time').value,
      ...(activeTrip ? ['釣法及釣餌已由行程帶入'] : [])
    ].join(' · ');
  }
  if (scroll) window.scrollTo(0, 0);
}

function fishName() {
  return (selectedFish === 'custom' ? get('custom-species').value : selectedFish).trim();
}

function spotName() {
  const spot = get('catch-spot').value;
  return (spot === '其他' ? get('custom-spot').value.trim() : spot) || '未選釣點';
}

function chooseFish(name) {
  selectedFish = name;
  get('species-all').value = name;
  get('custom-fish').hidden = name !== 'custom';
  document.querySelectorAll('[data-species]').forEach(button =>
    button.setAttribute('aria-pressed', String(button.dataset.species === name)));
}

function kg() {
  return weightLib.toKg(get('catch-weight').value, get('catch-weight-unit').value);
}

function setDemoLocation(fromTrip) {
  get('catch-lat').value = '22.382';
  get('catch-lng').value = '114.273';
  get('catch-accuracy').value = '12';
  get('gps-status').textContent = (fromTrip ? '行程定位' : '香港範圍已定位') + ' · ±12 m';
  get('gps-btn').textContent = '更新定位';
  if (!get('catch-spot').value) get('catch-spot').value = '西貢公眾碼頭';
}

function setPhoto(url, status) {
  if (photoUrl.startsWith('blob:')) URL.revokeObjectURL(photoUrl);
  photoUrl = url;
  photoStatus = status;
  const image = get('fish-preview');
  image.hidden = !url;
  if (url) image.src = url;
  else image.removeAttribute('src');
  get('catch-media').classList.toggle('has-photo', !!url);
}

function checks() {
  const days = (Date.parse(dateValue) - Date.parse(get('catch-date').value)) / 86400000;
  return {
    photo: photoStatus === 'fresh',
    gps: !!get('catch-lat').value || get('test-mode').checked,
    date: days >= 0 && days <= 7,
    species: !!fishName() && selectedFish !== 'custom',
    weight: kg() > 0 && kg() <= weightLib.MAX_KG
  };
}

function update() {
  for (const id of ['spot', 'method', 'bait']) get('other-' + id).hidden = get('catch-' + id).value !== '其他';
  const weight = kg();
  get('catch-weight-conv').textContent = weight > 0 ? '約 ' + weightLib.describeOthers(weight, previousUnit) : '';
  get('astro-values').textContent = get('catch-time').value
    ? (get('catch-time').value < '15:00' ? '漲潮 · 高潮 15:18' : '退潮 · 低潮 21:36') + ' · 日落 17:39（示範）'
    : '揀日期同時間後顯示';
  const status = checks();
  const labels = {
    photo: photoStatus === 'gallery' ? '相簿相須喺 30 分鐘內拍攝（預覽未驗證拍攝時間）' : '魚獲相必備',
    gps: get('test-mode').checked ? '香港範圍定位（測試模式略過）' : '香港範圍定位',
    date: '日期須喺 7 日內', species: '列表內魚種', weight: '已填有效重量',
    proof: '磅／尺相係重量王者必備，審核後上榜'
  };
  for (const [key, label] of Object.entries(labels)) {
    get('elig-' + key).textContent = ((key === 'proof' ? proof : status[key]) ? '✓ ' : '○ ') + label;
  }
  get('elig-title').textContent = Object.values(status).every(Boolean)
    ? (proof ? '上榜條件已齊 · 磅相待審核' : '上榜條件已齊 · 重量榜欠磅相')
    : '上榜條件 · 未齊都可以儲存';
  if (step === 3) setStep(3, false);
}

function reset(seed, startStep = 0) {
  form.reset();
  previousUnit = 'kg';
  chooseFish('');
  setPhoto('', '');
  proof = false;
  get('proof-name').textContent = '重量王者須有磅／尺相，審核後上榜。';
  get('gps-status').textContent = '未定位';
  get('gps-btn').textContent = '自動定位';
  for (const id of ['lat', 'lng', 'accuracy']) get('catch-' + id).value = '';
  get('catch-date').value = dateValue;
  get('catch-date').max = dateValue;
  get('catch-time').value = timeValue;
  get('form-error').textContent = '';
  form.querySelectorAll('details').forEach(details => { details.open = false; });
  if (activeTrip) {
    setDemoLocation(true);
    get('catch-method').value = '磯釣';
    get('catch-bait').value = '生蝦';
    if (get('more-data')) get('more-data').open = true;
  }
  if (seed) {
    chooseFish('黑鱲');
    get('catch-weight').value = '1.24';
    get('catch-length').value = '38';
    if (!activeTrip) {
      setDemoLocation(false);
      get('catch-method').value = '磯釣';
      get('catch-bait').value = '生蝦';
    }
    setPhoto(config.photo, 'fresh');
    get('elig-box').open = !activeTrip;
  }
  setStep(startStep, false);
  update();
  show('form');
}

function submit(event) {
  event?.preventDefault();
  const weight = get('catch-weight');
  const error = get('form-error');
  if (!fishName() || !weight.validity.valid || !(kg() > 0) || kg() > weightLib.MAX_KG) {
    setStep(1);
    error.textContent = '請揀魚種，並填寫有效重量（最多 60 公斤）。';
    (!fishName() ? get('species-selector').querySelector('button') : weight).focus();
    return;
  }
  if (!get('catch-date').validity.valid || !get('catch-time').validity.valid) {
    setStep(2);
    if (get('more-data')) get('more-data').open = true;
    error.textContent = '請輸入有效日期同時間。';
    get('catch-date').focus();
    return;
  }
  const score = get('score-card-wrap');
  score.replaceChildren();
  if (photoUrl) {
    const image = document.createElement('img');
    image.src = photoUrl;
    image.alt = '已記錄魚獲';
    score.append(image);
  }
  const title = document.createElement('h3');
  title.textContent = fishName();
  const size = document.createElement('b');
  size.textContent = get('catch-weight').value + ' ' + weightLib.NAMES[previousUnit] +
    (get('catch-length').value ? ' · ' + get('catch-length').value + ' cm' : '');
  const where = document.createElement('small');
  where.textContent = spotName() + ' · ' + get('catch-date').value + ' ' + get('catch-time').value;
  score.append(title, size, where);
  get('success-status').textContent = Object.values(checks()).every(Boolean)
    ? (proof ? '符合上榜條件 · 磅相待審核' : '符合上榜條件 · 重量王者須補磅相')
    : '已儲存記錄 · 上榜條件未齊';
  show('success');
}

document.querySelectorAll('[data-species]').forEach(button =>
  button.addEventListener('click', () => { chooseFish(button.dataset.species); update(); }));
get('species-all').addEventListener('change', event => { chooseFish(event.target.value); update(); });
get('catch-weight-unit').addEventListener('change', event => {
  const weight = get('catch-weight');
  const next = event.target.value;
  if (weight.value) {
    const standard = weightLib.toKg(weight.value, previousUnit);
    weight.value = +weightLib.fromKg(standard, next).toFixed(5);
  }
  previousUnit = next;
  update();
});
form.addEventListener('input', update);
form.addEventListener('submit', submit);
get('gps-btn').addEventListener('click', () => { setDemoLocation(false); update(); });
document.querySelectorAll('[data-file]').forEach(button => {
  const input = get(button.dataset.file);
  button.addEventListener('click', () => input.click());
  input.addEventListener('change', () => {
    const file = input.files[0];
    if (!file) return;
    if (input.id === 'catch-proof') {
      proof = true;
      get('proof-name').textContent = '已揀 · ' + file.name + ' · 重量王者須審核';
    } else {
      setPhoto(URL.createObjectURL(file), input.id === 'catch-photo' ? 'fresh' : 'gallery');
    }
    update();
  });
});
document.querySelectorAll('[data-step]').forEach(button =>
  button.addEventListener('click', () => setStep(+button.dataset.step)));
get('previous').addEventListener('click', () => setStep(step - 1));
get('next').addEventListener('click', () => setStep(step + 1));
get('dismiss').addEventListener('click', () => {
  dismissed = true;
  get('trip-prompt').hidden = true;
  try { localStorage.setItem(dismissKey, today); } catch {}
});
const destinations = {
  trip: ['行程', '喺呢度開始示範行程，返回記錄時會自動帶入釣點、釣法同釣餌。'],
  my: ['我的魚獲', '正式版會喺呢度顯示你嘅魚獲記錄。'],
  ranking: ['排行榜', '正式版會喺呢度顯示合資格魚獲嘅排名。']
};
document.querySelectorAll('[data-go]').forEach(button => button.addEventListener('click', () => {
  previousScreen = screen;
  const [title, copy] = destinations[button.dataset.go];
  get('destination-title').textContent = title;
  get('destination-copy').textContent = copy;
  get('demo-start').hidden = button.dataset.go !== 'trip';
  show('destination');
}));
get('back').addEventListener('click', () => show(previousScreen));
get('demo-start').addEventListener('click', () => {
  activeTrip = true;
  setDemoLocation(true);
  get('catch-method').value = '磯釣';
  get('catch-bait').value = '生蝦';
  if (get('more-data')) get('more-data').open = true;
  update();
  show('form');
});
get('reset').addEventListener('click', () => reset(false));

document.body.classList.toggle('shot', params.has('shot'));
get('test-mode-box').hidden = !params.has('admin');
activeTrip = scenario === 'trip';
reset(scenario !== 'empty', scenario === 'filled' || scenario === 'success' ? 3 : activeTrip ? 2 : 0);
if (activeTrip && config.option === 'b') get('catch-method').closest('details').open = true;
if (scenario === 'success') submit();

</script></body></html>
