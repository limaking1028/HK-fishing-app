<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a6e7a">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="釣魚HK">
  <title>香港釣魚數據平台</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Route A1: 月相 + 日出日落（純前端、無 API） -->
  <script src="./lib/astronomy.js"></script>
  <!-- Route D: 簡筆風魚類 SVG icon（取代 AI 生成 PNG） -->

  <style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --teal-dark: #0a6e7a; --teal: #0d8a99; --teal-light: #e0f5f8; --teal-pale: #f0fafb;
    --orange: #ff6b35; --orange-light: #fff0eb; --gold: #f5a623; --green: #34a853;
    --red: #ea4335; --gray-1: #f5f5f5; --gray-2: #e8e8e8; --gray-3: #ccc;
    --gray-4: #999; --gray-5: #666; --gray-6: #333; --dark: #1a1a2e; --white: #fff;
--shadow: 0 2px 8px rgba(0,0,0,0.08); --shadow-lg: 0 4px 16px rgba(0,0,0,0.12);
  --radius: 14px; --radius-sm: 10px; --safe-bottom: env(safe-area-inset-bottom, 0px);
}
/* ===== 登入畫面 ===== */
.login-screen { position: fixed; inset: 0; background: linear-gradient(135deg, var(--teal-dark), var(--teal)); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 9999; }
.login-card { background: white; border-radius: 16px; padding: 32px 24px; width: 100%; max-width: 360px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
.login-logo { font-size: 48px; text-align: center; margin-bottom: 8px; }
.login-title { font-size: 22px; font-weight: 700; color: var(--teal-dark); text-align: center; margin-bottom: 4px; }
.login-subtitle { font-size: 13px; color: var(--gray-5); text-align: center; margin-bottom: 24px; }
.login-tabs { display: flex; gap: 4px; background: var(--gray-1); border-radius: 10px; padding: 4px; margin-bottom: 20px; }
.login-tab { flex: 1; padding: 8px; text-align: center; font-size: 13px; font-weight: 600; color: var(--gray-5); border-radius: 8px; cursor: pointer; border: none; background: transparent; }
.login-tab.active { background: white; color: var(--teal-dark); box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
.login-field { margin-bottom: 14px; }
.login-field label { display: block; font-size: 12px; color: var(--gray-5); margin-bottom: 6px; font-weight: 600; }
.login-input { width: 100%; padding: 12px 14px; border: 1px solid var(--gray-2); border-radius: 10px; font-size: 15px; background: var(--gray-1); transition: all 0.2s; }
.login-input:focus { outline: none; border-color: var(--teal); background: white; }
.pin-input { letter-spacing: 8px; text-align: center; font-size: 20px; font-weight: 600; }
.login-btn { width: 100%; padding: 13px; background: var(--teal); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: all 0.2s; }
.login-btn:hover { background: var(--teal-dark); }
.login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.login-msg { font-size: 12px; color: var(--red); margin-top: 8px; text-align: center; min-height: 16px; }
.login-footer { text-align: center; font-size: 11px; color: var(--gray-4); margin-top: 20px; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    background: var(--gray-1); color: var(--gray-6); line-height: 1.6;
    -webkit-font-smoothing: antialiased; overscroll-behavior: none;
  }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--gray-1); position: relative; display: flex; flex-direction: column; }
  #header { background: linear-gradient(135deg, var(--teal-dark), var(--teal)); color: white; padding: 14px 18px; text-align: center; font-size: 17px; font-weight: 700; position: sticky; top: 0; z-index: 100; letter-spacing: 0.5px; box-shadow: 0 2px 8px rgba(10,110,122,0.3); display: flex; align-items: center; justify-content: space-between; }
  .header-title { flex: 1; text-align: center; }
  .header-settings { font-size: 13px; font-weight: 600; opacity: 0.9; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 4px; }
  .header-edit { font-size: 12px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: none; align-items: flex-end; justify-content: center; }
  .modal-overlay.show { display: flex; }
  .modal-sheet { background: white; border-radius: 16px 16px 0 0; width: 100%; max-width: 500px; padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); animation: slideUp 0.25s ease; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 16px; text-align: center; color: var(--gray-6); }
  .modal-input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--gray-2); border-radius: 10px; font-size: 16px; font-family: inherit; margin-bottom: 16px; box-sizing: border-box; }
  .modal-input:focus { outline: none; border-color: var(--teal); }
  .modal-btns { display: flex; gap: 10px; }
  .modal-btns .btn { flex: 1; }
  .modal-close { position: absolute; top: 12px; right: 16px; font-size: 22px; color: var(--gray-4); cursor: pointer; }
  #main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 70px; }
  .view { display: none; padding: 16px 14px 20px; }
  .view.active { display: block; }
  .view.fade-in { animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  #bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: var(--white); display: flex; border-top: 1px solid var(--gray-2); padding-bottom: var(--safe-bottom); z-index: 100; box-shadow: 0 -2px 12px rgba(0,0,0,0.06); }
  .nav-item { flex: 1; background: none; border: none; padding: 8px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; color: var(--gray-4); transition: color 0.2s; font-family: inherit; }
  .nav-item.active { color: var(--teal-dark); }
  .nav-icon { font-size: 22px; }
  .nav-label { font-size: 11px; font-weight: 600; }
  .card { background: var(--white); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: 12px; }
  .section-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; color: var(--dark); display: flex; align-items: center; gap: 6px; }
  .form-group { margin-bottom: 14px; }
  .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--gray-5); margin-bottom: 6px; }
  .form-label .req { color: var(--red); }
  .form-input, .form-select, .form-textarea { width: 100%; padding: 11px 14px; border: 1.5px solid var(--gray-2); border-radius: var(--radius-sm); font-size: 15px; font-family: inherit; background: var(--white); color: var(--gray-6); transition: border-color 0.2s; -webkit-appearance: none; }
  .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--teal); }
  .form-textarea { resize: vertical; min-height: 70px; }
  .form-row { display: flex; gap: 10px; }
  .form-row > .form-group { flex: 1; }
  .input-suffix { display: flex; align-items: center; border: 1.5px solid var(--gray-2); border-radius: var(--radius-sm); overflow: hidden; }
  .input-suffix .form-input { border: none; border-radius: 0; }
  .input-suffix .suffix { padding: 0 12px; font-size: 14px; color: var(--gray-4); font-weight: 600; background: var(--gray-1); height: 100%; display: flex; align-items: center; }
  .species-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .species-chip { text-align: center; padding: 8px 4px; border: 1.5px solid var(--gray-2); border-radius: var(--radius-sm); cursor: pointer; transition: all 0.2s; font-size: 12px; background: var(--white); position: relative; }
  .species-chip > svg { display: block; margin: 0 auto 3px; }
  .species-chip .chip-name { display: block; }
  .species-chip .chip-thumb { width: 100%; aspect-ratio: 16/9; border-radius: 5px; object-fit: cover; display: block; margin: 0 auto 3px; background: var(--gray-1); }
  .species-chip .chip-thumb-fallback { width: 100%; aspect-ratio: 16/9; font-size: 22px; display: flex; align-items: center; justify-content: center; margin: 0 auto 3px; background: var(--gray-1); border-radius: 5px; }
  .species-chip .chip-icon { font-size: 20px; display: block; margin-bottom: 3px; }
  .species-chip.selected { border-color: var(--teal); background: var(--teal-light); color: var(--teal-dark); font-weight: 600; }
  .species-chip:active { transform: scale(0.95); }
  .photo-upload { border: 2px dashed var(--gray-3); border-radius: var(--radius); padding: 24px 16px; text-align: center; cursor: pointer; transition: border-color 0.2s; position: relative; }
  .photo-upload:active { border-color: var(--teal); }
  .photo-upload .upload-icon { font-size: 36px; }
  .photo-upload .upload-text { font-size: 13px; color: var(--gray-4); margin-top: 6px; }
  .photo-preview { width: 100%; max-height: 240px; border-radius: var(--radius-sm); margin-top: 10px; }
  /* Route A1: 月相/日出日落 資訊卡 */
  .astro-card { background: linear-gradient(135deg, #1a1a2e, #16213e); color: #e0f5f8; border-radius: var(--radius-sm); padding: 10px 14px; margin: 8px 0 14px; font-size: 13px; line-height: 1.7; box-shadow: 0 2px 8px rgba(10, 30, 50, 0.15); }
  .astro-card:empty { display: none; }
  .astro-row { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  .astro-item { display: inline-flex; align-items: center; gap: 4px; }
  .astro-tip { margin-top: 6px; font-size: 12px; color: #ffd699; padding-top: 6px; border-top: 1px solid rgba(224, 245, 248, 0.15); }
  .btn { width: 100%; padding: 14px; border: none; border-radius: var(--radius-sm); font-size: 16px; font-weight: 700; cursor: pointer; transition: opacity 0.2s; font-family: inherit; }
  .btn:active { opacity: 0.85; }
  .btn-primary { background: linear-gradient(135deg, var(--teal-dark), var(--teal)); color: white; }
  .btn-outline { background: var(--white); border: 1.5px solid var(--teal); color: var(--teal-dark); }
  .btn-share { background: linear-gradient(135deg, #ff6b35, #ff8c5a); color: white; font-size: 16px; font-weight: 700; box-shadow: 0 4px 12px rgba(255,107,53,0.3); }
  .btn-share:active { transform: scale(0.98); }
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat-card { background: var(--white); border-radius: var(--radius); padding: 14px 8px; text-align: center; box-shadow: var(--shadow); }
  .stat-value { font-size: 24px; font-weight: 800; color: var(--teal-dark); }
  .stat-label { font-size: 11px; color: var(--gray-4); margin-top: 2px; }
  .catch-card { background: var(--white); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); margin-bottom: 10px; }
  .catch-card-top { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .catch-fish-icon { width: 100px; aspect-ratio: 16/9; border-radius: 8px; background: var(--teal-light); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; overflow: hidden; }
  .catch-fish-icon .catch-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
  .catch-fish-icon > svg { display: block; }
  .catch-info { flex: 1; min-width: 0; }
  .catch-species { font-size: 16px; font-weight: 700; color: var(--dark); }
  .catch-meta { font-size: 12px; color: var(--gray-4); margin-top: 2px; }
  .catch-weight-badge { text-align: right; flex-shrink: 0; }
  .catch-weight { font-size: 18px; font-weight: 800; color: var(--orange); }
  .biggest-card { background: linear-gradient(135deg, #f9d976 0%, #f39f86 100%); border-radius: var(--radius); padding: 14px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .biggest-card-header { margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .biggest-badge { background: rgba(255,255,255,0.35); padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 700; color: #fff; }
  .biggest-card-body { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.4); border-radius: 10px; padding: 10px; }
  .biggest-info { flex: 1; min-width: 0; color: #fff; }
  .biggest-species { font-size: 16px; font-weight: 700; }
  .biggest-weight { font-size: 24px; font-weight: 800; margin: 2px 0; }
  .biggest-weight span { font-size: 13px; font-weight: 500; }
  .biggest-meta { font-size: 11px; opacity: 0.85; }
  .species-breakdown { background: var(--white); border-radius: var(--radius); padding: 12px; box-shadow: var(--shadow); margin-bottom: 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .breakdown-item { text-align: center; padding: 8px 4px; border-radius: 8px; background: var(--gray-1); }
  .breakdown-thumb-wrap { width: 100%; aspect-ratio: 16/9; border-radius: 6px; overflow: hidden; margin-bottom: 4px; background: var(--teal-light); display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .breakdown-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
  .breakdown-name { font-size: 11px; color: var(--gray-5); font-weight: 600; margin-bottom: 2px; }
  .breakdown-count { font-size: 16px; font-weight: 800; color: var(--teal-dark); line-height: 1; }
  .breakdown-count span { font-size: 10px; font-weight: 500; color: var(--gray-4); margin-left: 1px; }
  .collapsible-header { display: flex; align-items: center; justify-content: space-between; background: var(--white); padding: 12px 14px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 8px; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
  .collapsible-header:active { background: var(--gray-1); }
  .collapsible-title { font-size: 15px; font-weight: 700; color: var(--dark); display: flex; align-items: center; gap: 6px; }
  .collapsible-arrow { font-size: 12px; color: var(--gray-4); transition: transform 0.2s; }
  .collapsible.expanded .collapsible-arrow { transform: rotate(90deg); }
  .collapsible-content { display: none; margin-bottom: 16px; }
  .collapsible.expanded .collapsible-content { display: block; }
  .species-row { display: flex; align-items: center; gap: 10px; background: var(--white); padding: 10px 12px; border-radius: var(--radius-sm); box-shadow: var(--shadow-sm, 0 1px 3px rgba(0,0,0,0.05)); margin-bottom: 6px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .species-row:active { background: var(--gray-1); }
  .species-row-thumb { width: 50px; aspect-ratio: 16/9; border-radius: 6px; overflow: hidden; background: var(--teal-light); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
  .species-row-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .species-row-thumb > svg { display: block; }
  .species-row-name { flex: 1; font-size: 14px; font-weight: 600; color: var(--dark); }
  .species-row-count { font-size: 13px; color: var(--teal-dark); font-weight: 700; background: var(--teal-light); padding: 3px 10px; border-radius: 10px; flex-shrink: 0; }
  .species-row-arrow { font-size: 11px; color: var(--gray-4); margin-left: 4px; }
  .species-catches-list { background: var(--gray-1); border-radius: var(--radius-sm); padding: 8px; margin-bottom: 10px; }
  .catch-weight-unit { font-size: 11px; color: var(--gray-4); }
  .catch-card-bottom { padding: 8px 14px 10px; display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--gray-5); border-top: 1px solid var(--gray-1); }
  .catch-tag { background: var(--gray-1); padding: 2px 8px; border-radius: 6px; font-size: 11px; }
  .verified-badge { background: var(--teal-light); color: var(--teal-dark); padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }
  .share-btn { background: var(--orange-light); color: var(--orange); padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; }
  .lb-tabs { display: flex; background: var(--white); border-radius: var(--radius-sm); padding: 3px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .lb-tab { flex: 1; padding: 8px 4px; text-align: center; border: none; background: none; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--gray-4); cursor: pointer; transition: all 0.2s; font-family: inherit; }
  .lb-tab.active { background: var(--teal-dark); color: white; }
  .lb-period-row { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 2px; }
  .lb-period { white-space: nowrap; padding: 6px 16px; border-radius: 20px; border: 1.5px solid var(--gray-2); background: var(--white); font-size: 13px; font-weight: 600; color: var(--gray-5); cursor: pointer; transition: all 0.2s; font-family: inherit; }
  .lb-period.active { border-color: var(--orange); color: var(--orange); background: var(--orange-light); }
  .lb-list { list-style: none; }
  .lb-item { display: flex; align-items: center; gap: 12px; background: var(--white); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; box-shadow: var(--shadow); }
  .lb-rank { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; flex-shrink: 0; }
  .lb-rank.gold { background: linear-gradient(135deg, #f5a623, #e8941a); color: white; }
  .lb-rank.silver { background: linear-gradient(135deg, #c0c0c0, #a8a8a8); color: white; }
  .lb-rank.bronze { background: linear-gradient(135deg, #cd7f32, #b06820); color: white; }
  .lb-rank.normal { background: var(--gray-1); color: var(--gray-5); }
  .lb-user { flex: 1; min-width: 0; }
  .lb-username { font-size: 14px; font-weight: 600; color: var(--dark); }
  .lb-detail { font-size: 12px; color: var(--gray-4); margin-top: 2px; }
  .lb-value { font-size: 18px; font-weight: 800; color: var(--teal-dark); text-align: right; flex-shrink: 0; }
  .lb-value .unit { font-size: 11px; color: var(--gray-4); }
  .lb-item.mine { background: linear-gradient(135deg, #fff4e8, #ffe8d8); border-left: 4px solid var(--orange); box-shadow: 0 2px 8px rgba(255,107,53,0.15); }
  .lb-item.mine .lb-username { color: var(--orange); }
  .rank-badge { background: linear-gradient(135deg, var(--gold), #e8941a); color: white; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; white-space: nowrap; box-shadow: 0 1px 3px rgba(229,148,26,0.3); }
  .spot-card { background: var(--white); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .spot-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .spot-name { font-size: 16px; font-weight: 700; color: var(--dark); }
  .spot-type { font-size: 11px; padding: 2px 8px; border-radius: 6px; background: var(--teal-light); color: var(--teal-dark); font-weight: 600; }
  .spot-stats { display: flex; gap: 16px; font-size: 13px; color: var(--gray-5); }
  .spot-stat-value { font-weight: 700; color: var(--orange); }
  .spot-fish { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .spot-fish-tag { font-size: 11px; background: var(--gray-1); padding: 3px 8px; border-radius: 6px; color: var(--gray-5); }
  .map-placeholder { background: linear-gradient(180deg, #d4ecda, #c8e6c9); border-radius: var(--radius); height: 200px; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; position: relative; overflow: hidden; }
  .map-pin { position: absolute; font-size: 24px; animation: bounce 2s infinite; }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--gray-4); }
  .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state .empty-text { font-size: 14px; }
  /* ===== 魚種圖鑑 ===== */
  .pokedex-progress-box { background: linear-gradient(135deg, var(--teal-dark), var(--teal)); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px; color: white; box-shadow: 0 3px 12px rgba(10,110,122,0.3); }
  .pokedex-progress-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .pokedex-progress-bar { height: 10px; background: rgba(255,255,255,0.25); border-radius: 5px; overflow: hidden; margin-bottom: 6px; }
  .pokedex-progress-fill { height: 100%; background: linear-gradient(90deg, #fbbf24, #f97316); border-radius: 5px; transition: width 0.5s ease; }
  .pokedex-progress-text { font-size: 12px; opacity: 0.9; }
  .pokedex-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pokedex-card { background: var(--white); border-radius: var(--radius); padding: 14px 12px; text-align: center; box-shadow: var(--shadow); position: relative; overflow: hidden; }

/* ===== Supabase Auth & DB（只有 SB_ENABLED=true 時才執行）===== */
async function hashPin(username, salt, pin) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pin), { name: 'PBKDF2' }, false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode('hk-fishing-' + username + '-' + salt), iterations: 10000, hash: 'SHA-256' }, keyMaterial, 256);
  return btoa(String.fromCharCode(...new Uint8Array(bits)));
}
function generateSalt() { const arr = new Uint8Array(16); crypto.getRandomValues(arr); return btoa(String.fromCharCode(...arr)); }

async function sbRegister(username, pin, avatar, displayName) {
  if (!sb) throw new Error('雲端未啟用');
  const clean = username.trim();
  if (!clean || clean.length < 2) throw new Error('用戶名至少 2 個字');
  if (!/^\d{4}$/.test(pin)) throw new Error('PIN 必須是 4 位數字');
  const { data: existing } = await sb.from('users').select('id').eq('username', clean).maybeSingle();
  if (existing) throw new Error('用戶名已被使用');
  const salt = generateSalt();
  const pinHash = await hashPin(clean, salt, pin);
  const { data, error } = await sb.from('users').insert({ username: clean, pin_hash: pinHash, pin_salt: salt, avatar: avatar || '🎣', display_name: (displayName || clean).slice(0, 12) }).select().single();
  if (error) throw error;
  state.user = data;
  localStorage.setItem('hk_fishing_user_id', data.id);
  return data;
}

async function sbLogin(username, pin) {
  if (!sb) throw new Error('雲端未啟用');
  const clean = username.trim();
  const { data: user, error } = await sb.from('users').select('*').eq('username', clean).maybeSingle();
  if (error || !user) throw new Error('用戶名或 PIN 錯誤');
  const hash = await hashPin(clean, user.pin_salt, pin);
  if (hash !== user.pin_hash) throw new Error('用戶名或 PIN 錯誤');
  state.user = user;
  localStorage.setItem('hk_fishing_user_id', user.id);
  return user;
}

function sbLogout() {
  state.user = null;
  state.catches = [];
  localStorage.removeItem('hk_fishing_user_id');

async function dbLoadCatches() {
  if (!sb || !state.user) return null;
  const { data, error } = await sb.from('catches').select('*').or(`user_id.eq.${state.user.id},user_id.is.null`).order('date', { ascending: false });
  if (error) throw error;
  const userIds = [...new Set((data || []).filter(c => c.user_id).map(c => c.user_id))];
  let userMap = {};
  if (userIds.length > 0) {
    const { data: users } = await sb.from('users').select('id, username, display_name').in('id', userIds);
    (users || []).forEach(u => userMap[u.id] = u);
  }
  return (data || []).map(c => {
    const isMine = c.user_id === state.user.id;
    const isDemo = c.user_id === null;
    const owner = isDemo ? null : userMap[c.user_id];
    return {
      id: c.id, user: owner?.display_name || owner?.username || (isDemo ? '示範' : '釣友'),
      userId: c.user_id, species: c.species, speciesIcon: c.species_icon || '🐟',
      weight: parseFloat(c.weight), length: c.length ? parseFloat(c.length) : 0,
      spot: c.spot, spotArea: c.spot_area || '', date: c.date, time: c.time ? c.time.slice(0, 5) : '',
      method: c.method, bait: c.bait, verified: c.verified, notes: c.notes || '', isMine, isDemo,
      latitude: c.latitude || null, longitude: c.longitude || null,
      locationAccuracy: c.location_accuracy || null, locationSource: c.location_source || null,
      photoUrl: c.photo_url || null,  // Route E: 用戶上傳的照片
    };
  });
}

async function uploadCatchPhoto(file) {
  if (!file || !sb || !state.user) return null;
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '');
  const safeExt = ['jpg','jpeg','png','webp'].includes(ext) ? (ext === 'jpeg' ? 'jpg' : ext) : 'jpg';
  const path = `${state.user.id}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${safeExt}`;
  const { error } = await sb.storage.from('catch-photos').upload(path, file, {
    cacheControl: '31536000', upsert: false, contentType: file.type || 'image/jpeg'
  });
  if (error) throw error;
  const { data: pub } = sb.storage.from('catch-photos').getPublicUrl(path);
  return pub.publicUrl;
}

async function migrateLocalCatches() {
  const local = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  if (local.length === 0) return 0;
  const username = state.user.username;
  const mine = local.filter(c => c.user === username || c.user === getUserName());
  if (mine.length === 0) return 0;
  const rows = mine.map(c => ({
    user_id: state.user.id, species: c.species, species_icon: c.speciesIcon || '🐟',
    weight: c.weight, length: c.length || null, spot: c.spot, spot_area: c.spotArea || null,
    date: c.date, time: c.time || null, method: c.method, bait: c.bait,
    verified: c.verified || false, notes: c.notes || null,
  }));
  const { error } = await sb.from('catches').insert(rows);
  if (error) throw error;
  localStorage.setItem(STORAGE_KEY + '_backup', JSON.stringify(local));
  const remaining = local.filter(c => c.user !== username && c.user !== getUserName());
  if (remaining.length > 0) localStorage.setItem(STORAGE_KEY, JSON.stringify(remaining));
  else localStorage.removeItem(STORAGE_KEY);
  return rows.length;
}

function getFishInfo(name) { return FISH_SPECIES.find(f => f.name === name) || { name: name, icon: '🐟' }; }
function getSpotInfo(name) { return FISHING_SPOTS.find(s => s.name === name) || { name: name, area: '' }; }
function formatDate(d) { const date = new Date(d); const mm=(date.getMonth()+1).toString().padStart(2,'0'); const dd=date.getDate().toString().padStart(2,'0'); return date.getFullYear()+'/'+mm+'/'+dd; }
function daysAgo(d) { const date = new Date(d); const now = new Date(); const diff = Math.floor((now-date)/86400000); if(diff===0) return '今天'; if(diff===1) return '昨天'; return diff+'日前'; }
function toast(msg) { let el = document.getElementById('toast'); if(!el){el=document.createElement('div');el.id='toast';el.className='toast';document.body.appendChild(el);} el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2000); }
function periodFilter(c, period) {
  if (period==='all') return true;
  const d=new Date(c.date), now=new Date();
  if (period==='month') return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
  if (period==='quarter') return Math.floor(now.getMonth()/3)===Math.floor(d.getMonth()/3) && d.getFullYear()===now.getFullYear();
  if (period==='year') return d.getFullYear()===now.getFullYear();
  return true;
}

/* ===== Route A1: 月相 / 日出日落資訊 ===== */
function onDateChange() {
  const dateEl = document.getElementById('catch-date');
  const timeEl = document.getElementById('catch-time');
  const target = document.getElementById('astro-info');
  if (!dateEl || !target) return;
  const dateStr = dateEl.value;
  if (!dateStr) { target.innerHTML = ''; return; }
  const timeStr = (timeEl && timeEl.value) || '12:00';

  // 用釣魚時間 + 釣魚座標（state.catchLat/Lng）算，
  // 冇 GPS 時 fallback 香港中心
  const d = new Date(dateStr + 'T' + timeStr + ':00+08:00');
  if (isNaN(d.getTime())) { target.innerHTML = ''; return; }

  const lat = (state.catchLat && state.catchLng) ? state.catchLat : window.Astro.HK_LAT;
  const lng = (state.catchLat && state.catchLng) ? state.catchLng : window.Astro.HK_LNG;

  const moon = window.Astro.getMoonPhase(d);
  const sun = window.Astro.getSunTimes(d, lat, lng);
  const tip = window.Astro.getFishingTip(moon, sun);

  let html = '<div class="astro-row">';
  html += '<span class="astro-item">' + moon.emoji + ' <strong>' + moon.name + '</strong> (' + moon.illumination + '%)</span>';
  if (sun) {
    html += '<span class="astro-item">☀️ ' + sun.sunrise + ' → ' + sun.sunset + '</span>';
  } else {
    html += '<span class="astro-item">☀️ 日出/日落 N/A</span>';
  }
  html += '</div>';
  html += '<div class="astro-tip">💡 ' + tip + '</div>';
  target.innerHTML = html;
}

// ===== GPS Location =====
function getCurrentLocation() {
  const btn = document.getElementById('gps-btn');
  const status = document.getElementById('gps-status');
  if (!navigator.geolocation) {
    status.textContent = '瀏覽器不支援定位';
    status.className = 'gps-status error';
    return;
  }
  btn.disabled = true;
  btn.classList.add('loading');
  btn.textContent = '⏳ 定位中...';
  status.textContent = '正在取得位置...';
  status.className = 'gps-status';

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      // 預設模糊化到 3 位小數 ≈ 110 公尺（保護隱私）
      const rawLat = pos.coords.latitude;
      const rawLng = pos.coords.longitude;
      const accuracy = Math.round(pos.coords.accuracy);
      const fuzzedLat = Math.round(rawLat * 1000) / 1000;
      const fuzzedLng = Math.round(rawLng * 1000) / 1000;
      state.catchLat = fuzzedLat;
      state.catchLng = fuzzedLng;
      state.catchAccuracy = accuracy;
      document.getElementById('catch-lat').value = fuzzedLat;
      document.getElementById('catch-lng').value = fuzzedLng;
      document.getElementById('catch-accuracy').value = accuracy;
      btn.disabled = false;
      btn.classList.remove('loading');
      btn.textContent = '✓ 已取得位置';
      status.className = 'gps-status success';
      status.innerHTML = '✓ 已記錄 <span class="gps-accuracy">（精度 ±' + accuracy + ' 公尺，已模糊化至約 110m）</span>';
    },
    (err) => {
      btn.disabled = false;
      btn.classList.remove('loading');
      btn.textContent = '📍 使用當前位置';
      let msg = '無法取得位置';
      if (err.code === 1) msg = '已拒絕位置權限';
      else if (err.code === 2) msg = '位置不可用';
      else if (err.code === 3) msg = '取得位置逾時';
      status.textContent = msg;
      status.className = 'gps-status error';
      toast(msg);
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
}

  const catchItem = {
    id: SB_ENABLED && state.user ? 'temp-' + Date.now() : Date.now(),
    user: getUserName(), species: speciesName, speciesIcon: speciesIcon,

  };
  state.catches.unshift(catchItem);

        catchItem.id = saved.id;

        state.lastCatchId = saved.id;

  }
  state.formSuccess = true; state.selectedSpecies = null; state.customSpecies = ''; state.selectedMethod = ''; state.customMethod = ''; state.selectedBait = ''; state.customBait = ''; state.selectedSpot = ''; state.customSpot = ''; state.lastCatchId = catchItem.id;
  // Route E: 清空照片 input 與預覽，避免下次開表單殘留舊圖
  const photoEl = document.getElementById('catch-photo');
  if (photoEl) photoEl.value = '';
  const previewEl = document.getElementById('photo-preview-container');
  if (previewEl) previewEl.innerHTML = '';
  // 解鎖偵測：如果這是用戶第一次釣到這個魚種，慶祝
  const prevCatches = state.catches.filter(c => c.isMine && c.species === speciesName && c.id !== catchItem.id);
  if (prevCatches.length === 0) {
    setTimeout(() => showToast('🎉 解鎖新魚種：'+speciesName+'！'), 400);
  }
  renderRecordView();
}

/* ===== My Catches View ===== */
function getMyCatchRankings() {
  const rankings = {};
  const filtered = state.catches;
  const qualify = c => c.verified || c.isMine || c.imported;
  // 最大魚：按用戶最大魚獲排名
  const userBiggest = {};
  filtered.forEach(c => { if (qualify(c)) { if (!userBiggest[c.user] || c.weight > userBiggest[c.user].weight) userBiggest[c.user] = c; } });
  Object.values(userBiggest).sort((a,b) => b.weight - a.weight).forEach((item, idx) => {
    if (item.isMine) { (rankings[item.id] = rankings[item.id] || []).push({lb:'最大魚', rank: idx+1}); }
  });
  // 魚種王：按用戶不同魚種數量排名（徽章標記在最大魚獲上）
  const userSpecies = {};
  filtered.forEach(c => { if (qualify(c)) { userSpecies[c.user] = userSpecies[c.user] || {user:c.user, species:new Set(), catches:[]}; userSpecies[c.user].species.add(c.species); userSpecies[c.user].catches.push(c); } });
  Object.values(userSpecies).sort((a,b) => b.species.size - a.species.size).forEach((item, idx) => {
    const mine = item.catches.filter(c => c.isMine);
    if (mine.length) {
      const biggest = mine.slice().sort((a,b) => b.weight - a.weight)[0];
      (rankings[biggest.id] = rankings[biggest.id] || []).push({lb:'魚種王', rank: idx+1});
    }
  });
  // 最多魚獲：按用戶總數排名（標記在最新一條）
  const userCounts = {};
  filtered.forEach(c => { if (qualify(c)) { if (!userCounts[c.user]) userCounts[c.user] = {user:c.user, count:0, catches:[]}; userCounts[c.user].count++; userCounts[c.user].catches.push(c); } });
  Object.values(userCounts).sort((a,b) => b.count - a.count).forEach((item, idx) => {
    const mine = item.catches.filter(c => c.isMine);
    if (mine.length) {
      const latest = mine.sort((a,b) => (b.date+b.time).localeCompare(a.date+a.time))[0];
      (rankings[latest.id] = rankings[latest.id] || []).push({lb:'最多魚獲', rank: idx+1});
    }
  });
  return rankings;
}

function nativeShare(data) {
  const base = location.origin + location.pathname;
  const url = base + '?share=' + data;
  const d = JSON.parse(decodeURIComponent(escape(atob(data))));
  let text = '🎣 嚟【香港釣魚數據平台】睇下'+d.u+'嘅魚獲！\n'+(d.i||'🐟')+' '+d.s+' '+d.w+'斤\n📍 '+d.p+' · '+formatDate(d.d);
  if (d.r && d.r.length) text += '\n🏆 排行榜名次：'+d.r.map(r => r.lb+' #'+r.rank).join('、');
  if (navigator.share) {
    navigator.share({ title: '香港釣魚數據平台', text: text, url: url }).catch(()=>{});
  } else {
    navigator.clipboard.writeText(text + '\n' + url).then(() => showToast('已複製，可貼到 WhatsApp / 微信')).catch(()=>{});
  }
}
function copyShareLink(data) {

    try { document.execCommand('copy'); showToast('連結已複製'); } catch(e) { showToast('複製失敗，請手動複製'); }
    document.body.removeChild(ta);
  });

        + '<button class="btn btn-primary" onclick="importCatch(\''+shareData.replace(/'/g,"\\'")+'\')">📥 收藏到我手機</button>'
        + '<button class="btn btn-outline" onclick="closeImportModal();clearShareParam();">稍後再講</button>'
        + '</div>'
      );
    document.getElementById('import-modal').classList.add('show');
  } catch(e) { console.warn('share parse error', e); }
}
function importCatch(shareData) {
  try {
    const d = JSON.parse(decodeURIComponent(escape(atob(shareData))));
    const fishInfo = FISH_SPECIES.find(f => f.name === d.s);
    const catchItem = {
      id: SB_ENABLED && state.user ? 'temp-' + Date.now() : Date.now(),
      user: d.u || '朋友', species: d.s, speciesIcon: d.i || fishInfo?.icon || '🐟',
      weight: d.w, length: d.l || 0, spot: d.p, spotArea: getSpotInfo(d.p)?.area || '',
      date: d.d, time: d.t, method: d.m || '', bait: d.b || '',
      verified: false, notes: d.n || '', isMine: false, imported: true, shareKey: shareData
    };
    state.catches.unshift(catchItem);
    state.catches.sort((a,b) => b.date.localeCompare(a.date));
    if (SB_ENABLED && state.user) {
      // 雲端模式：插到自己的 user_id 下
      dbAddCatch({ ...catchItem, isMine: true, imported: false }).then(saved => {
        if (saved) catchItem.id = saved.id;
      }).catch(e => showToast('雲端寫入失敗：' + e.message));
    } else {
      saveCatches(state.catches);
    }
    closeImportModal();
    clearShareParam();
    switchView('leaderboard');
    showToast('已收藏！呢條魚獲已加入排行榜');
  } catch(e) { showToast('收藏失敗，數據有誤'); }
}
function clearShareParam() {
  const url = location.origin + location.pathname;
  history.replaceState({}, document.title, url);
}
function closeImportModal() { document.getElementById('import-modal').classList.remove('show'); }

/* ===== Leaderboard View ===== */
function renderLeaderboardView() {
  const view = document.getElementById('view-leaderboard');
  const filtered = state.catches.filter(c => periodFilter(c, state.lbPeriod));
  let lbData = [];
  if (state.lbType === 'biggest') {
    const m = {};
    filtered.forEach(c => { if (c.verified || c.isMine || c.imported) { if (!m[c.user] || c.weight > m[c.user].weight) m[c.user] = {...c}; } });
    lbData = Object.values(m).sort((a,b) => b.weight - a.weight);
  } else if (state.lbType === 'quantity') {
    const m = {};
    filtered.forEach(c => { if (c.verified || c.isMine || c.imported) { m[c.user] = m[c.user] || {user:c.user, count:0, spots:new Set(), species:new Set(), isMine:false}; m[c.user].count++; m[c.user].spots.add(c.spot); m[c.user].species.add(c.species); if (c.isMine) m[c.user].isMine = true; } });
    lbData = Object.values(m).map(u => ({user:u.user, count:u.count, spotCount:u.spots.size, speciesCount:u.species.size, isMine:u.isMine})).sort((a,b) => b.count - a.count);
  } else {
    // 魚種王：統計每個用戶釣到多少種不同魚種，按數量排名
    const m = {};
    filtered.forEach(c => { if (c.verified || c.isMine || c.imported) { m[c.user] = m[c.user] || {user:c.user, species:new Set(), catches:[]}; m[c.user].species.add(c.species); m[c.user].catches.push(c); } });
    lbData = Object.values(m).map(u => {
      const biggest = u.catches.reduce((mx,c) => c.weight > mx.weight ? c : mx, u.catches[0]);
      return { user:u.user, speciesCount:u.species.size, speciesList:[...u.species].join('·'), biggestWeight:biggest.weight, isMine:u.catches.some(c=>c.isMine) };
    }).sort((a,b) => b.speciesCount - a.speciesCount || b.biggestWeight - a.biggestWeight);
  }
  let listHtml = '';
  if (lbData.length === 0) {
    listHtml = '<div class="empty-state"><div class="empty-icon">🏆</div><div class="empty-text">暫無排行榜數據</div></div>';
  } else {
    lbData.forEach((item, idx) => {
      const rank = idx + 1; let rankClass = 'normal';
      if (rank===1) rankClass='gold'; else if (rank===2) rankClass='silver'; else if (rank===3) rankClass='bronze';
      let value='', detail='';
      if (state.lbType==='biggest') { value=item.weight+'<span class="unit">斤</span>'; detail=item.species+' · '+item.spot+' · '+daysAgo(item.date); }
      else if (state.lbType==='quantity') { value=item.count+'<span class="unit">條</span>'; detail=item.speciesCount+' 種魚 · '+item.spotCount+' 個釣點'; }
      else { value=item.speciesCount+'<span class="unit">種</span>'; detail=item.speciesList+' · 最大'+item.biggestWeight+'斤'; }
      listHtml += '<div class="lb-item'+(item.isMine?' mine':'')+'"><div class="lb-rank '+rankClass+'">'+rank+'</div><div class="lb-user"><div class="lb-username">'+item.user+(item.isMine?' <span style="font-size:11px;color:var(--orange)">（我）</span>':'')+'</div><div class="lb-detail">'+detail+'</div></div><div class="lb-value">'+value+'</div></div>';
    });
  }
  view.innerHTML = '<div class="lb-tabs"><button class="lb-tab '+(state.lbType==='biggest'?'active':'')+'" onclick="setLbType(\'biggest\')">最大魚</button><button class="lb-tab '+(state.lbType==='quantity'?'active':'')+'" onclick="setLbType(\'quantity\')">最多魚獲</button><button class="lb-tab '+(state.lbType==='species'?'active':'')+'" onclick="setLbType(\'species\')">魚種王</button></div>'
    + '<div class="lb-period-row"><button class="lb-period '+(state.lbPeriod==='all'?'active':'')+'" onclick="setLbPeriod(\'all\')">全部</button><button class="lb-period '+(state.lbPeriod==='year'?'active':'')+'" onclick="setLbPeriod(\'year\')">年度</button><button class="lb-period '+(state.lbPeriod==='quarter'?'active':'')+'" onclick="setLbPeriod(\'quarter\')">季度</button><button class="lb-period '+(state.lbPeriod==='month'?'active':'')+'" onclick="setLbPeriod(\'month\')">月度</button></div>'
    + '<div class="lb-list">'+listHtml+'</div>'
    + '<div style="font-size:12px;color:var(--gray-4);text-align:center;padding:12px;">排行榜只計有效紀錄（附照片/GPS）<br>規則公開透明，可追溯至原始紀錄</div>';
}
function setLbType(t) { state.lbType = t; renderLeaderboardView(); }
function setLbPeriod(p) { state.lbPeriod = p; renderLeaderboardView(); }

function setMapTilerKey() {
  const key = prompt('輸入 MapTiler 免費 API key（到 https://maptiler.com 註冊拿 key）：\n\n免費 100,000 tiles/月，繁體中文地圖', localStorage.getItem('maptiler_key') || '');

function initMap(items) {
  // 銷毀舊實例（切換分頁時）
  if (mapInstance) { try { mapInstance.remove(); } catch(e) {} mapInstance = null; }
  mapMarkers = [];
  // 計算中心點（取所有 GPS 點的平均，或香港中心）
  const center = items.length === 1
    ? [items[0].latitude, items[0].longitude]
    : [items.reduce((s,c)=>s+c.latitude,0)/items.length, items.reduce((s,c)=>s+c.longitude,0)/items.length];

  // ===== Tile Layers =====
  // 1. CartoDB Positron（預設，無需 key，簡潔風格）
  //    Leaflet 直接吃 raster PNG，是最可靠的免費選擇
  const openFreeMap = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap contributors © CARTO',
    subdomains: 'abcd',
    maxZoom: 19,
    name: 'CartoDB'
  });

  // 2. MapTiler 繁體中文（需到 https://maptiler.com 註冊拿免費 key）
  //    免費額度 100K tile/月，個人使用綽綽有餘
  //    預設 key 在模組頂層宣告 DEFAULT_MAPTILER_KEY
  const MAPTILER_KEY = (typeof localStorage !== 'undefined' && localStorage.getItem('maptiler_key')) || DEFAULT_MAPTILER_KEY;
  const baseLayers = {
    '🗺️ CartoDB Positron': openFreeMap,
    '🇭🇰 MapTiler 繁體中文': L.tileLayer(`https://api.maptiler.com/maps/streets-v2/{z}/{x}/{y}.png?key=${MAPTILER_KEY}&language=zh-Hant`, {
      attribution: '© MapTiler © OpenStreetMap contributors',
      maxZoom: 19
    })
  };
  // 預設使用 MapTiler 繁中，fallback CartoDB
  let defaultLayer = baseLayers['🇭🇰 MapTiler 繁體中文'];

  mapInstance = L.map('map-canvas', { zoomControl: true }).setView(center, 11);
  defaultLayer.addTo(mapInstance);
  L.control.layers(baseLayers, null, { position: 'topright', collapsed: false }).addTo(mapInstance);

  items.forEach(c => {
    const color = c.isMine ? '#f97316' : (c.isDemo ? '#9ca3af' : '#0d9488');
    const radius = c.isMine ? 9 : 7;
    const marker = L.circleMarker([c.latitude, c.longitude], {
      radius, fillColor: color, color: '#fff', weight: 2, opacity: 1, fillOpacity: 0.85
    }).addTo(mapInstance);
    const popupHtml = '<div class="map-popup-title">'+(c.speciesIcon||'🐟')+' '+c.species+'</div>'
      + '<div class="map-popup-weight">'+c.weight+' 斤</div>'
      + '<div class="map-popup-meta">📍 '+c.spot+'<br>👤 '+c.user+'<br>📅 '+formatDate(c.date)+(c.time?' '+c.time:'')+(c.locationAccuracy?'<br>🎯 GPS ±'+c.locationAccuracy+'m':'')+'</div>';
    marker.bindPopup(popupHtml);
    mapMarkers.push(marker);
  });
  // 多個點自動調整視野
  if (items.length > 1) {
    const bounds = L.latLngBounds(items.map(c => [c.latitude, c.longitude]));
    mapInstance.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
  }
}

/* ===== Spots View ===== */
function getPokedexHTML() {
  // 我釣過的魚獲（含收藏的）
  const myCatches = state.catches.filter(c => c.isMine || c.imported);
  // 計算每個魚種的統計（含完整魚獲清單供展開用）
  const speciesStats = {};
  myCatches.forEach(c => {
    const s = speciesStats[c.species] = speciesStats[c.species] || { count: 0, biggest: 0, lastDate: '', catches: [] };
    s.count++;
    if (c.weight > s.biggest) s.biggest = c.weight;
    if (c.date > s.lastDate) s.lastDate = c.date;
    s.catches.push(c);
  });
  // 所有魚種（不含「其他」選項）
  const allSpecies = FISH_SPECIES.filter(f => !f.custom);
  // 加上用戶自訂的魚種（不在預設清單裡的）
  Object.keys(speciesStats).forEach(name => {
    if (!allSpecies.find(f => f.name === name)) {
      allSpecies.push({ name, icon: '🐟', sci: '自訂', habitat: '', desc: '用戶自訂魚種', rarity: 'common', custom: true });
    }
  });
  const caughtCount = allSpecies.filter(f => speciesStats[f.name]).length;
  const total = allSpecies.length;
  const pct = total > 0 ? Math.round(caughtCount / total * 100) : 0;
  const rarityLabels = { common: '常見', uncommon: '少見', rare: '稀有' };
  let html = '<div class="pokedex-progress-box">'
    + '<div class="pokedex-progress-title">📖 魚種圖鑑</div>'
    + '<div class="pokedex-progress-bar"><div class="pokedex-progress-fill" style="width:'+pct+'%"></div></div>'
    + '<div class="pokedex-progress-text">已收集 <b>'+caughtCount+'</b> / '+total+' 種 · '+pct+'%</div>'
    + '</div>'
    + '<div class="pokedex-grid">';
  html += allSpecies.map(f => {
    const stats = speciesStats[f.name];
    const caught = !!stats;
    const rarityClass = 'rarity-' + (f.rarity || 'common');
    // Route G: 已解鎖卡片支援展開魚獲列表
    const expKey = 'pokedex_' + f.name;
    const isExpanded = caught && state.ui.expandedPokedex[expKey];
    if (caught) {
      let catchesHtml = '';
      if (isExpanded) {
        // 按日期新到舊排序
        const sortedCatches = [...stats.catches].sort((a, b) =>
          (b.date + ' ' + (b.time || '')).localeCompare(a.date + ' ' + (a.time || ''))
        );
        catchesHtml = '<div class="pokedex-catches-list">'
          + sortedCatches.map(c => renderPokedexCatchCard(c)).join('')
          + '</div>';
      }
      return '<div class="pokedex-card unlocked' + (isExpanded ? ' expanded' : '') + '">'
        + (f.custom ? '<span class="pokedex-custom-tag">自訂</span>' : '')
        + '<span class="pokedex-rarity ' + rarityClass + '">' + rarityLabels[f.rarity||'common'] + '</span>'
        + '<div class="pokedex-photo">' + (window.fishIconSvg ? window.fishIconSvg(f.name, 96) : '🐟') + '</div>'
        + '<div class="pokedex-name">' + f.name + '</div>'
        + '<div class="pokedex-sci">' + (f.sci||'') + '</div>'
        + '<div class="pokedex-habitat">' + (f.habitat||'') + '</div>'
        + '<div class="pokedex-desc">' + (f.desc||'') + '</div>'
        + '<div class="pokedex-pb"><span class="pb-label">最大</span> ' + stats.biggest + '斤 <span class="pb-label">· ' + stats.count + '條</span></div>'
        + '<div class="pokedex-meta-row">'
        +   '<span class="pokedex-recent">最近：' + formatDate(stats.lastDate) + '</span>'
        +   '<button class="pokedex-expand-btn" onclick="togglePokedexSpecies(\'' + f.name.replace(/'/g, "\\'") + '\')">'
        +     (isExpanded ? '收起 ▲' : '展開 ' + stats.count + ' 筆 ▼')
        +   '</button>'
        + '</div>'
        + catchesHtml
        + '</div>';
    } else {
      return '<div class="pokedex-card locked">'
        + '<span class="pokedex-rarity '+rarityClass+'">'+rarityLabels[f.rarity||'common']+'</span>'
        + '<div class="pokedex-lock-icon">❓</div>'
        + '<div class="pokedex-name">'+f.name+'</div>'
        + '<div class="pokedex-locked-text">未解鎖</div>'
        + '<div class="pokedex-desc" style="margin-top:4px;">'+(f.habitat||'')+'</div>'
        + '</div>';
    }
  }).join('');
  html += '</div>';
  return html;
}

// Route G: 圖鑑展開用的簡化版 catch card
function renderPokedexCatchCard(c) {
  const thumb = c.photoUrl
    ? '<img src="' + c.photoUrl + '" alt="" loading="lazy" onerror="this.outerHTML=\'' + (window.fishIconSvg ? window.fishIconSvg(c.species, 40) : '🐟') + '\'">'
    : (window.fishIconSvg ? window.fishIconSvg(c.species, 40) : '🐟');
  return '<div class="pokedex-catch-row">'
    + '<div class="pokedex-catch-thumb">' + thumb + '</div>'
    + '<div class="pokedex-catch-info">'
    +   '<div class="pokedex-catch-weight">' + c.weight + '<span>斤</span>'
    +     (c.length ? '<span class="pokedex-catch-length">' + c.length + 'cm</span>' : '')
    +   '</div>'
    +   '<div class="pokedex-catch-meta">' + c.spot + (c.method ? ' · 🎣 ' + c.method : '') + '</div>'
    +   '<div class="pokedex-catch-date">📅 ' + formatDate(c.date) + ' ' + (c.time || '') + (c.verified ? ' <span class="pokedex-verified">✓ 有效</span>' : '') + '</div>'
    + '</div>'
    + '</div>';
}

  clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), 2000);
}

  document.getElementById('auth-submit').textContent = mode === 'login' ? '登入' : '註冊';
  document.getElementById('auth-msg').textContent = '';
};

window.handleAuthSubmit = async function() {
  const username = document.getElementById('auth-username').value.trim();
  const pin = document.getElementById('auth-pin').value;
  const msgEl = document.getElementById('auth-msg');
  const btn = document.getElementById('auth-submit');
  if (!username || !pin) { msgEl.textContent = '請填寫用戶名同 PIN'; return; }
  if (!/^\d{4}$/.test(pin)) { msgEl.textContent = 'PIN 必須是 4 位數字'; return; }
  btn.disabled = true; msgEl.textContent = authMode === 'login' ? '登入中...' : '註冊中...';
  try {
    if (authMode === 'register') await sbRegister(username, pin);
    else await sbLogin(username, pin);
    // 成功：執行 migration + 載入數據
    const migrated = await migrateLocalCatches();
    if (migrated > 0) console.log('Migrated ' + migrated + ' local records');
    await seedDemoDataIfNeeded();
    state.catches = await dbLoadCatches();
    document.getElementById('login-screen').innerHTML = '';
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('header').style.display = '';
    document.getElementById('bottom-nav').style.display = '';
    document.getElementById('main').style.display = '';
    document.getElementById('header-username').textContent = getUserName();
    setupGlobalHandlers();
    checkSharedCatch();
    switchView('my');
  } catch (e) {
    msgEl.textContent = e.message || '發生錯誤';
  } finally {
    btn.disabled = false;
  }
};
async function init() {
  if (SB_ENABLED) {
    const savedId = localStorage.getItem('hk_fishing_user_id');
    if (savedId) {
      const { data: user } = await sb.from('users').select('*').eq('id', savedId).maybeSingle();
      if (user) state.user = user;
    }
    if (!state.user) {
      // 雲端模式但未登入：顯示登入畫面
      renderLoginScreen();
      setupGlobalHandlers();
      return;
    }
    // 已登入：執行 migration + 載入雲端數據
    try {
      const migrated = await migrateLocalCatches();
      if (migrated > 0) toast('已從本地匯入 ' + migrated + ' 條舊記錄');
      const seeded = await seedDemoDataIfNeeded();
      if (seeded > 0) console.log('Seeded ' + seeded + ' demo records');
      state.catches = await dbLoadCatches();
    } catch (e) {
      console.error('Init failed', e);
      toast('雲端載入失敗：' + e.message);
      renderLoginScreen();
      return;
    }
  } else {
    state.catches = await loadCatches();  // FIX: await 因為 loadCatches 係 async function
  }
  setupGlobalHandlers();
  document.getElementById('header-username').textContent = getUserName();
  checkSharedCatch();
  switchView('my');
}
function setupGlobalHandlers() {
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => switchView(btn.dataset.view));
  });
  window.selectSpecies = selectSpecies;
  window.previewPhoto = previewPhoto;
  window.submitCatch = submitCatch;
  window.resetForm = resetForm;
  window.goToView = goToView;
  window.setMyFilter = setMyFilter;
  window.setLbType = setLbType;
  window.setLbPeriod = setLbPeriod;
  window.shareCatch = shareCatch;
  window.openNameDialog = openNameDialog;
  window.closeNameDialog = closeNameDialog;
  window.saveName = saveName;
  window.confirmClearAll = confirmClearAll;
  window.nativeShare = nativeShare;
  window.copyShareLink = copyShareLink;
  window.closeShareModal = closeShareModal;
  window.importCatch = importCatch;
  window.closeImportModal = closeImportModal;
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js?v=v8').catch(()=>{});
  }
  checkSharedCatch();
  renderRecordView();
}

/* ===== Event Delegation（避免 inline onclick 嘅 escape 陷阱）===== */
// 分享掣統一處理（catch-card + modal 入面兩個掣 + 成功畫面）
document.addEventListener('click', function(e) {
  // 0. 成功畫面嘅「即時分享這條魚獲」
  const shareLastBtn = e.target.closest('[data-action="share-last"]');
  if (shareLastBtn) {
    e.preventDefault();
    e.stopPropagation();
    try {
      // 1. 首先試用 state.lastCatchId 對應嘅 catch
      let id = state.lastCatchId;
      let found = id ? state.catches.find(x => x.id === id) : null;

      // 2. Fallback: 因為 race condition (dbAddCatch callback 仲未跑完)，
      //    lastCatchId 仲係 temp-id 而 state.catches[0].id 已經被改做 saved.id
      //    用最新加入嘅 catch (state.catches[0]，因為 submitCatch 用 unshift)
      if (!found && state.catches.length > 0) {
        const latest = state.catches[0];
        if (latest && (latest.isMine || latest.user === getUserName())) {
          found = latest;
          state.lastCatchId = latest.id;  // 同步返 state
        }
      }

      if (!found) {
        showToast('⚠️ 暫時無法分享，請先記錄一條魚獲');
        return;
      }
      shareCatch(found.id);
    } catch (err) {
      console.error('[share-last] error:', err);
      showToast('分享出錯：' + err.message);
    }
    return;
  }

  // 1. 撳 catch card 嘅 📤 分享
  const shareBtn = e.target.closest('[data-share-id]');
  if (shareBtn) {
    e.preventDefault();
    e.stopPropagation();
    try {
      shareCatch(shareBtn.dataset.shareId);
    } catch (err) {
      console.error('[share] error:', err);
      showToast('分享出錯：' + err.message);
    }
    return;
  }

  // 2. 撳 modal 入面嘅「系統分享」
  const nsBtn = e.target.closest('[data-action="native-share"]');
  if (nsBtn) {
    e.preventDefault();
    e.stopPropagation();
    try {
      nativeShare(nsBtn.dataset.data);
    } catch (err) {
      console.error('[nativeShare] error:', err);
      showToast('分享出錯：' + err.message);
    }
    return;
  }

  // 3. 撳 modal 入面嘅「複製連結」
  const cpBtn = e.target.closest('[data-action="copy-share"]');
  if (cpBtn) {
    e.preventDefault();
    e.stopPropagation();
    try {
      copyShareLink(cpBtn.dataset.data);
    } catch (err) {
      console.error('[copyShareLink] error:', err);
      showToast('複製出錯：' + err.message);
    }
    return;
  }
});

// 強制 unregister 舊 service worker（解決緩存問題）
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    regs.forEach(reg => {
      reg.unregister().then(() => console.log('SW unregistered'));
    });
  });
}
document.addEventListener('DOMContentLoaded', init);
</script>
