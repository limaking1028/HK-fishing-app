  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --teal-dark: #0a6e7a; --teal: #0d8a99; --teal-light: #e0f5f8; --teal-pale: #f0fafb;
    --orange: #ff6b35; --orange-light: #fff0eb; --gold: #f5a623; --green: #34a853;
    --red: #ea4335; --gray-1: #f5f5f5; --gray-2: #e8e8e8; --gray-3: #ccc;
    --gray-4: #999; --gray-5: #666; --gray-6: #333; --dark: #1a1a2e; --white: #fff;
--shadow: 0 2px 8px rgba(0,0,0,0.08); --shadow-lg: 0 4px 16px rgba(0,0,0,0.12);
  --radius: 14px; --radius-sm: 10px; --safe-bottom: env(safe-area-inset-bottom, 0px);
}
/* ===== 登入畫面 ===== */
.login-screen { position: fixed; inset: 0; background: linear-gradient(135deg, var(--teal-dark), var(--teal)); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 9999; }
.login-card { background: white; border-radius: 16px; padding: 32px 24px; width: 100%; max-width: 360px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
.login-logo { font-size: 48px; text-align: center; margin-bottom: 8px; }
.login-title { font-size: 22px; font-weight: 700; color: var(--teal-dark); text-align: center; margin-bottom: 4px; }
.login-subtitle { font-size: 13px; color: var(--gray-5); text-align: center; margin-bottom: 24px; }
.login-tabs { display: flex; gap: 4px; background: var(--gray-1); border-radius: 10px; padding: 4px; margin-bottom: 20px; }
.login-tab { flex: 1; padding: 8px; text-align: center; font-size: 13px; font-weight: 600; color: var(--gray-5); border-radius: 8px; cursor: pointer; border: none; background: transparent; }
.login-tab.active { background: white; color: var(--teal-dark); box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
.login-field { margin-bottom: 14px; }
.login-field label { display: block; font-size: 12px; color: var(--gray-5); margin-bottom: 6px; font-weight: 600; }
.login-input { width: 100%; padding: 12px 14px; border: 1px solid var(--gray-2); border-radius: 10px; font-size: 15px; background: var(--gray-1); transition: all 0.2s; }
.login-input:focus { outline: none; border-color: var(--teal); background: white; }
.pin-input { letter-spacing: 8px; text-align: center; font-size: 20px; font-weight: 600; }
.login-btn { width: 100%; padding: 13px; background: var(--teal); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: all 0.2s; }
.login-btn:hover { background: var(--teal-dark); }
.login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.login-msg { font-size: 12px; color: var(--red); margin-top: 8px; text-align: center; min-height: 16px; }
.login-footer { text-align: center; font-size: 11px; color: var(--gray-4); margin-top: 20px; }

  .rank-badge { background: linear-gradient(135deg, var(--gold), #e8941a); color: white; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; white-space: nowrap; box-shadow: 0 1px 3px rgba(229,148,26,0.3); }

  /* ===== 魚種圖鑑 ===== */
  .pokedex-progress-box { background: linear-gradient(135deg, var(--teal-dark), var(--teal)); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px; color: white; box-shadow: 0 3px 12px rgba(10,110,122,0.3); }
  .pokedex-progress-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .pokedex-progress-bar { height: 10px; background: rgba(255,255,255,0.25); border-radius: 5px; overflow: hidden; margin-bottom: 6px; }
  .pokedex-progress-fill { height: 100%; background: linear-gradient(90deg, #fbbf24, #f97316); border-radius: 5px; transition: width 0.5s ease; }

  .pokedex-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pokedex-card { background: var(--white); border-radius: var(--radius); padding: 14px 12px; text-align: center; box-shadow: var(--shadow); position: relative; overflow: hidden; }

  .pokedex-card.locked .pokedex-photo { filter: brightness(0.4) grayscale(1); }

  .pokedex-name { font-size: 14px; font-weight: 700; color: var(--dark); }

  .pokedex-sci { font-size: 10px; color: var(--gray-4); font-style: italic; margin-bottom: 4px; }
  .pokedex-desc { font-size: 11px; color: var(--gray-5); line-height: 1.4; margin-bottom: 6px; }
  .pokedex-habitat { font-size: 10px; color: var(--teal-dark); background: var(--teal-light); padding: 2px 8px; border-radius: 6px; display: inline-block; margin-bottom: 6px; }
  .pokedex-pb { font-size: 12px; font-weight: 700; color: var(--orange); }
  .pokedex-pb .pb-label { font-size: 10px; color: var(--gray-4); font-weight: 400; }
  .pokedex-meta-row { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; gap: 6px; }

  .pokedex-expand-btn { background: var(--teal-light); color: var(--teal-dark); border: 1px solid var(--teal); border-radius: 12px; padding: 3px 10px; font-size: 11px; cursor: pointer; font-family: inherit; font-weight: 600; transition: all 0.15s; }

  .pokedex-card.expanded { border: 1.5px solid var(--teal); box-shadow: 0 2px 12px rgba(13,138,153,0.18); }
  .pokedex-catches-list { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--gray-2); display: flex; flex-direction: column; gap: 6px; text-align: left; }
  .pokedex-catch-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: var(--gray-1); border-radius: 8px; }
  .pokedex-catch-thumb { width: 48px; height: 30px; border-radius: 4px; overflow: hidden; background: var(--teal-light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .pokedex-catch-thumb img, .pokedex-catch-thumb svg { width: 100%; height: 100%; object-fit: cover; display: block; }

  .pokedex-verified { color: var(--green); font-weight: 600; }
  .pokedex-lock-icon { font-size: 28px; margin-bottom: 6px; opacity: 0.4; }
  .pokedex-locked-text { font-size: 11px; color: var(--gray-4); }
  .pokedex-rarity { position: absolute; top: 6px; right: 6px; font-size: 9px; padding: 1px 6px; border-radius: 4px; font-weight: 600; }

  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(0,0,0,0.8); color: white; padding: 10px 24px; border-radius: 24px; font-size: 14px; z-index: 999; opacity: 0; transition: all 0.3s; pointer-events: none; white-space: nowrap; }

  /* ===== GPS Location Button ===== */

  .gps-btn:hover { background: var(--teal); color: white; }

  /* Route L+: 自動定位 UI */
  .auto-gps-badge { background: linear-gradient(135deg, var(--teal), var(--teal-dark)); color: white; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; margin-left: 6px; letter-spacing: 0.3px; vertical-align: middle; }
  .trip-inherit-badge { background: linear-gradient(135deg, var(--orange), #ff8c5a); color: white; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; margin-left: 6px; letter-spacing: 0.3px; vertical-align: middle; }
  .gps-auto-box { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: linear-gradient(135deg, #f0fafa, #e0f5f3); border: 1.5px solid var(--teal); border-radius: var(--radius); font-size: 13px; transition: all 0.3s; }

  /* ===== Map View ===== */
  .map-container { position: relative; height: calc(100vh - 200px); min-height: 360px; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  #map-canvas { width: 100%; height: 100%; background: #e8f0e8; }
  .map-overlay { position: absolute; top: 10px; left: 10px; right: 10px; background: rgba(255,255,255,0.95); border-radius: 10px; padding: 10px 12px; z-index: 500; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

  .map-popup-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .map-popup-meta { font-size: 12px; color: var(--gray-5); line-height: 1.5; }
  .map-popup-weight { font-size: 16px; color: var(--orange); font-weight: 700; margin: 4px 0; }
  .map-empty { text-align: center; padding: 60px 20px; color: var(--gray-4); }
  .map-empty-icon { font-size: 48px; margin-bottom: 12px; }

  /* ===== Route I+: 地圖潮汐站 marker ===== */

  /* Route J+: Station highlight marker（地圖上嘅 pin + pulse 動畫） */

  .station-highlight-pin {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 34px; height: 34px; border-radius: 50%;
    background: #ef4444; color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    border: 3px solid white;
    box-shadow: 0 3px 10px rgba(239,68,68,0.5);

    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);

    opacity: 0.4;

    0% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
    100% { transform: translate(-50%, -50%) scale(2.8); opacity: 0; }
  }

  /* 地圖 sub-tabs（地圖 / 潮汐） */

    border-bottom: 1px solid #eee; background: white; position: sticky; top: 0; z-index: 10;

/* ===== Supabase Auth & DB（只有 SB_ENABLED=true 時才執行）===== */
async function hashPin(username, salt, pin) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(pin), { name: 'PBKDF2' }, false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode('hk-fishing-' + username + '-' + salt), iterations: 10000, hash: 'SHA-256' }, keyMaterial, 256);
  return btoa(String.fromCharCode(...new Uint8Array(bits)));
}
function generateSalt() { const arr = new Uint8Array(16); crypto.getRandomValues(arr); return btoa(String.fromCharCode(...arr)); }

async function sbRegister(username, pin, avatar, displayName) {
  if (!sb) throw new Error('雲端未啟用');
  const clean = username.trim();
  if (!clean || clean.length < 2) throw new Error('用戶名至少 2 個字');
  if (!/^\d{4}$/.test(pin)) throw new Error('PIN 必須是 4 位數字');
  const { data: existing } = await sb.from('users').select('id').eq('username', clean).maybeSingle();
  if (existing) throw new Error('用戶名已被使用');
  const salt = generateSalt();
  const pinHash = await hashPin(clean, salt, pin);
  const { data, error } = await sb.from('users').insert({ username: clean, pin_hash: pinHash, pin_salt: salt, avatar: avatar || '🎣', display_name: (displayName || clean).slice(0, 12) }).select().single();
  if (error) throw error;
  state.user = data;
  localStorage.setItem('hk_fishing_user_id', data.id);
  return data;
}

async function sbLogin(username, pin) {
  if (!sb) throw new Error('雲端未啟用');
  const clean = username.trim();
  const { data: user, error } = await sb.from('users').select('*').eq('username', clean).maybeSingle();
  if (error || !user) throw new Error('用戶名或 PIN 錯誤');
  const hash = await hashPin(clean, user.pin_salt, pin);
  if (hash !== user.pin_hash) throw new Error('用戶名或 PIN 錯誤');
  state.user = user;
  localStorage.setItem('hk_fishing_user_id', user.id);
  return user;
}

function sbLogout() {
  state.user = null;
  state.catches = [];
  localStorage.removeItem('hk_fishing_user_id');
  renderLoginScreen();
}

async function dbLoadCatches() {
  if (!sb || !state.user) return null;
  const { data, error } = await sb.from('catches').select('*').or(`user_id.eq.${state.user.id},user_id.is.null`).order('date', { ascending: false });
  if (error) throw error;
  const userIds = [...new Set((data || []).filter(c => c.user_id).map(c => c.user_id))];
  let userMap = {};
  if (userIds.length > 0) {
    const { data: users } = await sb.from('users').select('id, username, display_name').in('id', userIds);
    (users || []).forEach(u => userMap[u.id] = u);
  }
  return (data || []).map(c => {
    const isMine = c.user_id === state.user.id;
    const isDemo = c.user_id === null;
    const owner = isDemo ? null : userMap[c.user_id];
    return {
      id: c.id, user: owner?.display_name || owner?.username || (isDemo ? '示範' : '釣友'),
      userId: c.user_id, species: c.species, speciesIcon: c.species_icon || '🐟',
      weight: parseFloat(c.weight), length: c.length ? parseFloat(c.length) : 0,
      spot: c.spot, spotArea: c.spot_area || '', date: c.date, time: c.time ? c.time.slice(0, 5) : '',
      method: c.method, bait: c.bait, verified: c.verified, notes: c.notes || '', isMine, isDemo,
      latitude: c.latitude || null, longitude: c.longitude || null,
      locationAccuracy: c.location_accuracy || null, locationSource: c.location_source || null,
      photoUrl: c.photo_url || null,  // Route E: 用戶上傳的照片
      tripId: c.trip_id || null,      // Route H: 行程關聯
    };
  });
}

async function uploadCatchPhoto(file) {
  if (!file || !sb || !state.user) return null;
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '');
  const safeExt = ['jpg','jpeg','png','webp'].includes(ext) ? (ext === 'jpeg' ? 'jpg' : ext) : 'jpg';
  const path = `${state.user.id}/${Date.now()}_${Math.random().toString(36).slice(2,8)}.${safeExt}`;
  const { error } = await sb.storage.from('catch-photos').upload(path, file, {
    cacheControl: '31536000', upsert: false, contentType: file.type || 'image/jpeg'
  });
  if (error) throw error;
  const { data: pub } = sb.storage.from('catch-photos').getPublicUrl(path);
  return pub.publicUrl;
}

// 啟動時自動補傳上次未同步的魚獲
async function retryUnsyncedCatches() {
  if (!sb || !state.user) return;
  const unsynced = state.catches.filter(c => c.isMine && c.unsynced && c.id && String(c.id).startsWith('temp-'));
  if (unsynced.length === 0) return;
  console.log('[補傳] 檢測到 ' + unsynced.length + ' 條未同步魚獲,正在重傳...');
  let success = 0, failed = 0;
  for (const c of unsynced) {
    try {
      const saved = await dbAddCatch(c);
      if (saved) {
        c.id = saved.id;
        c.photoUrl = saved.photo_url;
        delete c.unsynced;
        delete c.unsyncedReason;
        delete c.unsyncedAt;
        success++;
      } else {
        failed++;
      }
    } catch (e) {
      console.warn('[補傳失敗]', c.species, e.message || e);
      failed++;
    }
  }
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.catches));
  } catch(_) {}
  if (success > 0) toast('✓ 已補傳 ' + success + ' 條魚獲到雲端' + (failed > 0 ? ' (' + failed + ' 條仍失敗)' : ''), 3000);
  else if (failed > 0) toast('✗ 仍有 ' + failed + ' 條魚獲未同步', 3000);
}

async function dbAddCatch(c) {
  if (!sb || !state.user) return null;
  // Route E: 上傳照片到 Supabase Storage（先 upload 再 insert row）
  let photoUrl = null;
  const fileEl = document.getElementById('catch-photo');
  if (fileEl && fileEl.files && fileEl.files[0]) {
    try { photoUrl = await uploadCatchPhoto(fileEl.files[0]); }
    catch (e) {
      console.error('[照片上傳失敗]', e);
      toast('照片上傳失敗：' + (e.message || '網絡錯誤') + '（魚獲已存本地，稍後會自動補傳）');
      throw e;
    }
  }
  const payload = {
    user_id: state.user.id, species: c.species, species_icon: c.speciesIcon,
    weight: c.weight, length: c.length || null, spot: c.spot, spot_area: c.spotArea || null,
    date: c.date, time: c.time || null, method: c.method, bait: c.bait,
    verified: c.verified || false, notes: c.notes || null,
    latitude: c.latitude || null, longitude: c.longitude || null,
    location_accuracy: c.locationAccuracy || null, location_source: c.locationSource || null,
    trip_id: c.tripId || c.trip_id || null,  // Route H: 行程關聯（nullable，向後相容）
    photo_url: photoUrl,
  };
  console.log('[dbAddCatch] payload:', payload);
  const { data, error } = await sb.from('catches').insert(payload).select().single();
  if (error) {
    console.error('[catches insert 錯誤]', error, 'payload:', payload);
    throw error;
  }
  return data;
}

// 重試包裝器:網絡瞬時錯誤(TypeError: Load failed)自動重試
async function dbAddCatchWithRetry(c, maxAttempts) {
  maxAttempts = maxAttempts || 2;
  let lastErr;
  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    try {
      const r = await dbAddCatch(c);
      if (attempt > 1) console.log('[雲端寫入] 第 ' + attempt + ' 次重試成功');
      return r;
    } catch (e) {
      lastErr = e;
      console.warn('[雲端寫入] 第 ' + attempt + '/' + maxAttempts + ' 次失敗:', e.message || e);
      if (attempt < maxAttempts) {
        // 等待 800ms 後重試 (網絡抖動通常 1-2s 內恢復)
        await new Promise(r => setTimeout(r, 800));
      }
    }
  }
  throw lastErr;
}

async function migrateLocalCatches() {
  const local = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  if (local.length === 0) return 0;
  const username = state.user.username;
  const mine = local.filter(c => c.user === username || c.user === getUserName());
  if (mine.length === 0) return 0;
  const rows = mine.map(c => ({
    user_id: state.user.id, species: c.species, species_icon: c.speciesIcon || '🐟',
    weight: c.weight, length: c.length || null, spot: c.spot, spot_area: c.spotArea || null,
    date: c.date, time: c.time || null, method: c.method, bait: c.bait,
    verified: c.verified || false, notes: c.notes || null,
  }));
  const { error } = await sb.from('catches').insert(rows);
  if (error) throw error;
  localStorage.setItem(STORAGE_KEY + '_backup', JSON.stringify(local));
  const remaining = local.filter(c => c.user !== username && c.user !== getUserName());
  if (remaining.length > 0) localStorage.setItem(STORAGE_KEY, JSON.stringify(remaining));
  else localStorage.removeItem(STORAGE_KEY);
  return rows.length;
}

// 魚照 resolver: 自動 try .jpg/.png/.webp，再 fallback emoji
// photo field 用 base path (無 ext): 'photos/泥鯭'
// 將來 push 真實 jpg 就直接覆蓋 photos/泥鯭.jpg，唔使改 code
// 44 種魚全部已有真實 jpg/png (.svg 全部刪走)，鏈由 5 級減到 4 級
const FISH_PHOTO_EXTS = ['jpg', 'jpeg', 'png', 'webp'];
function fishPhotoImg(base, icon, klass) {
  if (!base) return '<div class="' + (klass || 'sp-icon-emoji') + '">' + icon + '</div>';
  // 用 data-attr 儲 base，onerror chain 試下一個 ext
  klass = klass || 'sp-icon-img';
  const firstExt = FISH_PHOTO_EXTS[0];
  return '<img class="' + klass + '" src="' + escapeHtml(base + '.' + firstExt) + '" data-base="' + escapeHtml(base) + '" data-idx="0" alt="" loading="lazy" '
    + 'onerror="window._fishPhotoNext(this)">';
}
window._fishPhotoNext = function(img) {
  const base = img.dataset.base;
  const idx = parseInt(img.dataset.idx || '0', 10) + 1;
  if (idx >= FISH_PHOTO_EXTS.length) {
    // 全部 miss → 拎魚種 emoji fallback
    const fish = FISH_SPECIES.find(f => f.photo === base);
    img.outerHTML = '<div class="' + img.className.replace('-img', '-emoji') + '">' + (fish ? fish.icon : '🐟') + '</div>';
    return;
  }
  img.dataset.idx = idx;
  img.src = base + '.' + FISH_PHOTO_EXTS[idx];
};
// ===== 真實魚照統一渲染（取代 SVG 簡筆風）=====
// 優先順序：用戶上傳照片 → 魚種真實照片 (photos/{name}.jpg/png) → SVG 簡筆風 fallback
// 用法：
//   catchThumbHtml(c)                       → 魚獲卡片/列表/王者卡（catch-thumb class）
//   catchThumbHtml(c, { klass: '其他' })     → 自訂 class
//   speciesPhotoHtml('泥鯭')                → 圖鑑等純展示
//   speciesPhotoHtml('泥鯭', { klass: 'X', size: 96 })
function catchThumbHtml(c, opts) {
  opts = opts || {};
  const klass = opts.klass || 'catch-thumb';
  const fishInfo = getFishInfo(c.species);
  const fallbackSvg = window.fishIconSvg ? window.fishIconSvg(c.species, 80) : (fishInfo.icon || '🐟');
  const safeAlt = escapeHtml(c.species);
  // 1) 用戶上傳照片（最高優先）
  if (c.photoUrl) {
    const fallback = fishInfo.photo
      ? fishPhotoImg(fishInfo.photo, fishInfo.icon, klass).replace('alt=""', 'alt="' + safeAlt + '"')
      : fallbackSvg;
    // 將 fallback HTML 內的單引號 escape（因為外層 onerror 用單引號包裹）
    const safeFallback = fallback.replace(/'/g, "\\'");
    return '<img class="' + klass + '" src="' + escapeHtml(c.photoUrl) + '" alt="' + safeAlt + '" loading="lazy" '
      + 'onerror="this.outerHTML=\'' + safeFallback + '\'">';
  }
  // 2) 魚種真實照片
  if (fishInfo.photo) {
    return fishPhotoImg(fishInfo.photo, fishInfo.icon, klass).replace('alt=""', 'alt="' + safeAlt + '"');
  }
  // 3) SVG fallback
  return fallbackSvg;
}
function speciesPhotoHtml(name, opts) {
  opts = opts || {};
  const klass = opts.klass || '';
  const f = getFishInfo(name);
  const safeAlt = escapeHtml(name);
  if (f.photo) {
    if (klass) {
      return fishPhotoImg(f.photo, f.icon, klass).replace('alt=""', 'alt="' + safeAlt + '"');
    }
    return fishPhotoImg(f.photo, f.icon, 'pokedex-photo-img').replace('alt=""', 'alt="' + safeAlt + '"');
  }
  return window.fishIconSvg ? window.fishIconSvg(name, opts.size || 96) : '🐟';
}
function formatDate(d) { const date = new Date(d); const mm=(date.getMonth()+1).toString().padStart(2,'0'); const dd=date.getDate().toString().padStart(2,'0'); return date.getFullYear()+'/'+mm+'/'+dd; }
function daysAgo(d) { const date = new Date(d); const now = new Date(); const diff = Math.floor((now-date)/86400000); if(diff===0) return '今天'; if(diff===1) return '昨天'; return diff+'日前'; }
function toast(msg, duration) { let el = document.getElementById('toast'); if(!el){el=document.createElement('div');el.id='toast';el.className='toast';document.body.appendChild(el);} el.textContent=msg; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'), duration || 2000); }
// HTML escape helper（避免 XSS）
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}
function periodFilter(c, period) {
  if (period==='all') return true;
  const d=new Date(c.date), now=new Date();
  if (period==='month') return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
  if (period==='quarter') return Math.floor(now.getMonth()/3)===Math.floor(d.getMonth()/3) && d.getFullYear()===now.getFullYear();
  if (period==='year') return d.getFullYear()===now.getFullYear();
  return true;
}

/* ============================================================
 * Route K: 智能揀魚種 UI（Top 8 by 使用次數 + 摺疊展開）
 * ============================================================ */
// 用戶記錄嘅魚種次數（排除 demo data）
function getSpeciesCounts() {
  const counts = {};
  (state.catches || []).forEach(c => {
    if (c.isDemo) return;
    counts[c.species] = (counts[c.species] || 0) + 1;
  });
  return counts;
}

// 取得 Top N 魚種（pinned 永遠在前 + 其他 by 次數 desc）
function getTopSpecies(n) {
  const counts = getSpeciesCounts();
  const pinned = (state.pinnedSpecies || []).map(name => {
    const idx = FISH_SPECIES.findIndex(f => f.name === name);
    return idx >= 0 ? { idx, f: FISH_SPECIES[idx], count: counts[name] || 0, pinned: true } : null;
  }).filter(Boolean);
  const pinnedNames = new Set(pinned.map(p => p.f.name));
  const others = FISH_SPECIES
    .map((f, idx) => ({ idx, f, count: counts[f.name] || 0, pinned: false }))
    .filter(x => !x.f.custom && !pinnedNames.has(x.f.name))
    .sort((a, b) => b.count - a.count);
  // 去重（防止因為相同魚名出現兩次）
  const seen = new Set();
  const result = [...pinned];
  pinned.forEach(p => seen.add(p.f.name));
  for (const x of others) {
    if (seen.has(x.f.name)) continue;
    seen.add(x.f.name);
    result.push(x);
    if (result.length >= n) break;
  }
  return result;
}

// 取得「已收過」魚種（用戶曾釣過）
function getCollectedSpecies() {
  const counts = getSpeciesCounts();
  return FISH_SPECIES
    .map((f, idx) => ({ idx, f, count: counts[f.name] || 0 }))
    .filter(x => !x.f.custom && x.count > 0)
    .sort((a, b) => b.count - a.count);
}

// 取得全部魚種（pinned 置頂 + 其他按 count desc，count=0 排最後，「其他」永遠排最後）
function getAllSpecies() {
  const counts = getSpeciesCounts();
  const pinnedNames = new Set(state.pinnedSpecies || []);
  const items = FISH_SPECIES
    .map((f, idx) => ({ idx, f, count: counts[f.name] || 0, pinned: pinnedNames.has(f.name) }));
  // 排序:pinned first → 自訂(custom)永遠最後 → count desc → 維持原順序
  return items.sort((a, b) => {
    if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
    const aCustom = a.f.custom ? 1 : 0;
    const bCustom = b.f.custom ? 1 : 0;
    if (aCustom !== bCustom) return aCustom - bCustom;  // 自訂永遠排最後
    if (a.count !== b.count) return b.count - a.count;
    return 0;
  });
}

function togglePinSpecies(name) {
  if (!state.pinnedSpecies) state.pinnedSpecies = [];
  const idx = state.pinnedSpecies.indexOf(name);
  if (idx >= 0) {
    state.pinnedSpecies.splice(idx, 1);
    toast('已取消收藏 ' + name);
  } else {
    state.pinnedSpecies.push(name);
    toast('⭐ 已收藏 ' + name);
  }
  // 持久化
  try {
    localStorage.setItem('hk-fishing-pinned-species', JSON.stringify(state.pinnedSpecies));
  } catch(e) { console.warn('localStorage save failed', e); }
  renderSpeciesSelector();
}

function selectSpeciesByName(name) {
  const idx = FISH_SPECIES.findIndex(f => f.name === name);
  if (idx >= 0) {
    state.selectedSpecies = idx;
    state.customSpecies = '';
    renderRecordView();
  }
}

function expandSpecies() {
  state.speciesExpanded = true;

}

function collapseSpecies() {
  state.speciesExpanded = false;

function renderSpeciesSelector() {
  const container = document.getElementById('species-selector');
  if (!container) return;
  const top = getTopSpecies(8);
  const pinnedNames = new Set(state.pinnedSpecies || []);

  // 渲染單個 species card
  const renderCard = (item, opts) => {
    const { f, count, pinned } = item;
    const isSelected = state.selectedSpecies === item.idx;
    const isCustom = f.custom;
    const isPinned = pinned || pinnedNames.has(f.name);
    const countBadge = count > 0 ? '<span class="sp-count">×' + count + '</span>' : '';
    const pinBadge = isPinned ? '<span class="sp-pin" title="已收藏">⭐</span>' : '';
    const clickAction = isCustom ? `selectSpeciesByName('${f.name}')` : `selectSpeciesByName('${f.name}')`;
    // Image vs emoji：如有 photo 就用真實魚圖 (auto try .jpg/.png/.webp)，否則 fallback 為 emoji
    const iconHtml = f.photo
      ? fishPhotoImg(f.photo, f.icon, 'sp-icon-img').replace('alt=""', 'alt="' + escapeHtml(f.name) + '"')
      : `<div class="sp-icon-emoji">${f.icon}</div>`;
    return `<div class="sp-card ${isSelected ? 'selected' : ''} ${isPinned ? 'pinned' : ''} ${isCustom ? 'custom-species' : ''}" onclick="${clickAction}" data-species="${escapeHtml(f.name)}">
      <div class="sp-pin-toggle ${isPinned ? 'active' : ''}" onclick="event.stopPropagation();togglePinSpecies('${escapeHtml(f.name)}')" title="${isPinned ? '取消收藏' : '加入收藏'}">${isPinned ? '⭐' : '☆'}</div>
      <div class="sp-icon">${iconHtml}</div>
      <div class="sp-name">${escapeHtml(f.name)}</div>
      ${countBadge}${pinBadge}
    </div>`;
  };

  // Top 8 區域
  let html = '<div class="sp-section-title">🔥 常用 (自動 by 使用次數)</div>';
  html += '<div class="sp-grid">';
  if (top.length === 0 || top.every(t => t.count === 0 && !t.pinned)) {
    html += '<div class="sp-empty">尚未記錄魚獲 — 全部 ' + FISH_SPECIES.filter(f => !f.custom).length + ' 種魚都會顯示喺呢度 🎣</div>';
  } else {
    top.forEach(item => { html += renderCard(item); });
  }
  html += '</div>';

  // 展開 / 摺疊按鈕
  const totalSpecies = FISH_SPECIES.filter(f => !f.custom).length;  // 排除「其他」
  if (!state.speciesExpanded) {
    // 摺疊狀態：顯示「📂 全部 N 種魚」按鈕
    html += '<button class="sp-expand-btn" onclick="expandSpecies()">';
    html += '📂 全部 <span>' + totalSpecies + '</span> 種魚';
    html += '<span class="sp-expand-arrow">▼</span>';
    html += '</button>';
  } else {
    // 展開狀態
    html += '<button class="sp-expand-btn open" onclick="collapseSpecies()">';
    html += '📂 全部 <span>' + totalSpecies + '</span> 種魚';
    html += '<span class="sp-expand-arrow">▲</span>';
    html += '</button>';

    // 全部魚種（pinned 置頂 + 其他按 count desc，count=0 排最後）
    const allItems = getAllSpecies();
    html += '<div class="sp-grid">';
    allItems.forEach(item => { html += renderCard(item); });
    html += '</div>';
  }

  // 自訂魚種輸入（始終保留「其他」選項 — 不加入圖鑑）
  if (state.selectedSpecies === FISH_SPECIES.length - 1) {
    html += '<div style="background:#fff8e1;border:1.5px dashed #f5a623;border-radius:8px;padding:10px 12px;margin-top:10px;font-size:12px;color:#8a5a1c;line-height:1.5;">'
      + '📝 <b>自訂魚種</b> — 你輸入的名稱會跟這次魚獲一起保存，<br>'
      + '但 <b>不會加入「魚種圖鑑」</b>，也不會觸發解鎖慶祝。'
      + '</div>';
    html += '<input type="text" class="form-input" id="custom-species" placeholder="輸入魚種名稱（例如：象拔蚌）..." value="' + escapeHtml(state.customSpecies || '') + '" oninput="state.customSpecies=this.value" style="margin-top:8px;">';
  }

  container.innerHTML = html;
}

/* ===== Route A1: 月相 / 日出日落資訊 ===== */
function onDateChange() {
  const dateEl = document.getElementById('catch-date');
  const timeEl = document.getElementById('catch-time');
  const target = document.getElementById('astro-info');
  if (!dateEl || !target) return;
  const dateStr = dateEl.value;
  if (!dateStr) { target.innerHTML = ''; return; }
  const timeStr = (timeEl && timeEl.value) || '12:00';

  // 用釣魚時間 + 釣魚座標（state.catchLat/Lng）算，
  // 冇 GPS 時 fallback 香港中心
  const d = new Date(dateStr + 'T' + timeStr + ':00+08:00');
  if (isNaN(d.getTime())) { target.innerHTML = ''; return; }

  const lat = (state.catchLat && state.catchLng) ? state.catchLat : window.Astro.HK_LAT;
  const lng = (state.catchLat && state.catchLng) ? state.catchLng : window.Astro.HK_LNG;

  const moon = window.Astro.getMoonPhase(d);
  const sun = window.Astro.getSunTimes(d, lat, lng);
  const tip = window.Astro.getFishingTip(moon, sun);

  let html = '<div class="astro-row">';
  html += '<span class="astro-item">' + moon.emoji + ' <strong>' + moon.name + '</strong> (' + moon.illumination + '%)</span>';
  if (sun) {
    html += '<span class="astro-item">☀️ ' + sun.sunrise + ' → ' + sun.sunset + '</span>';
  } else {
    html += '<span class="astro-item">☀️ 日出/日落 N/A</span>';
  }
  html += '</div>';
  html += '<div class="astro-tip">💡 ' + tip + '</div>';
  target.innerHTML = html;
  // Route I: 日期/時間改 → 同步更新潮汐預覽
  try {
    state.catchDate = dateStr;
    state.catchTime = timeStr;
    if (state.selectedSpot) updateCatchTidePreview(state.selectedSpot, dateStr, timeStr);
  } catch(e) {}
}

function onMethodChange(m) {
  state.selectedMethod = m;
  const el = document.getElementById('custom-method');
  if (el) {
    if (m === '其他') { el.style.display = 'block'; el.value = state.customMethod || ''; }
    else { el.style.display = 'none'; el.value = ''; state.customMethod = ''; }
  }
  // Route H+: 行程中改 method → 同步到 activeTrip（讓下次加魚沿用最新值）
  if (state.activeTrip && m) {
    state.activeTrip.method = m === '其他' ? (state.customMethod || '') : m;
    window.tripsLib.saveActiveTrip(state.activeTrip);
  }
}
function onBaitChange(b) {
  state.selectedBait = b;
  const el = document.getElementById('custom-bait');
  if (el) {
    if (b === '其他') { el.style.display = 'block'; el.value = state.customBait || ''; }
    else { el.style.display = 'none'; el.value = ''; state.customBait = ''; }
  }
  // Route H+: 行程中改 bait → 同步到 activeTrip
  if (state.activeTrip && b) {
    state.activeTrip.bait = b === '其他' ? (state.customBait || '') : b;
    window.tripsLib.saveActiveTrip(state.activeTrip);
  }
}
function onSpotChange(s) {
  state.selectedSpot = s;
  // Route H+: 行程中改 spot → 同步到 activeTrip，後續沿用新 spot
  if (state.activeTrip && s) {
    const custom = (document.getElementById('custom-spot')?.value || '').trim();
    state.activeTrip.spot = custom ? s + '（' + custom + '）' : s;
    state.activeTrip.spotArea = getSpotInfo(s).area || '';
    window.tripsLib.saveActiveTrip(state.activeTrip);
  }
  // Route I: 更新潮汐預覽（用戶填表時間）
  updateCatchTidePreview(s, state.catchDate || new Date().toISOString().split('T')[0], state.catchTime || new Date().toTimeString().slice(0,5));
}

// Route I: 加魚表單潮汐預覽（依用戶揀嘅日期/時間）
function updateCatchTidePreview(spot, dateStr, timeStr) {
  const el = document.getElementById('catch-tide-preview');
  if (!el) return;
  if (!spot || !window.tidesLib) { el.innerHTML = ''; return; }
  // 將日期時間轉成 ms
  let targetMs;
  try {
    targetMs = new Date(dateStr + 'T' + (timeStr || '12:00') + ':00').getTime();
    if (isNaN(targetMs)) targetMs = Date.now();
  } catch(e) { targetMs = Date.now(); }
  const station = window.tidesLib.getStationForSpot(spot);
  const tide = window.tidesLib.describeCurrent(station, targetMs);
  if (!tide) { el.innerHTML = ''; return; }
  const next = window.tidesLib.getNextTides(station, targetMs, 2);
  let html = '🌊 <b>' + tide.height + 'm</b> ' + tide.trendText;
  if (next.length > 0) {
    const n = next[0];
    html += ' · 下一個 <b>' + window.tidesLib.formatTime(n.ms) + '</b> ' +
      (n.type === 'high' ? '🔺' : '🔻') + ' ' + n.height + 'm';
  }
  html += '<div style="font-size:10px;color:var(--gray-4);margin-top:2px;">（HKO ' + station + ' · ' + dateStr + ' ' + timeStr + '）</div>';
  el.innerHTML = html;
}

// ===== GPS Location =====
function getCurrentLocation() {
  const btn = document.getElementById('gps-btn');
  const status = document.getElementById('gps-status');
  const titleEl = document.querySelector('.gps-auto-title');
  const box = document.getElementById('gps-auto-box');
  if (!navigator.geolocation) {
    status.textContent = '瀏覽器不支援定位';
    status.className = 'gps-status error';
    if (titleEl) titleEl.textContent = '❌ 瀏覽器不支援定位';
    if (box) box.classList.add('error');
    return;
  }
  btn.disabled = true;
  btn.classList.add('loading');
  btn.textContent = '⏳ 定位中...';
  status.textContent = '正在取得位置...';
  status.className = 'gps-status';
  if (titleEl) titleEl.textContent = '📡 GPS 自動識別中...';
  if (box) box.classList.add('loading');

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const rawLat = pos.coords.latitude;
      const rawLng = pos.coords.longitude;
      const accuracy = Math.round(pos.coords.accuracy);
      const fuzzedLat = Math.round(rawLat * 1000) / 1000;
      const fuzzedLng = Math.round(rawLng * 1000) / 1000;
      state.catchLat = fuzzedLat;
      state.catchLng = fuzzedLng;
      state.catchAccuracy = accuracy;
      document.getElementById('catch-lat').value = fuzzedLat;
      document.getElementById('catch-lng').value = fuzzedLng;
      document.getElementById('catch-accuracy').value = accuracy;
      btn.disabled = false;
      btn.classList.remove('loading');
      btn.textContent = '🔄 重新定位';
      status.className = 'gps-status success';
      status.innerHTML = '✓ 已記錄 GPS（精度 ±' + accuracy + 'm，已模糊化至約 110m）<br><span class="gps-detect-status">🔍 正在自動識別釣點...</span>';
      if (titleEl) titleEl.textContent = '🔍 正在識別釣點...';
      if (box) box.classList.remove('loading');
      // Route L: 三層回退自動識別釣點
      autoDetectSpot(fuzzedLat, fuzzedLng).then(result => {
        const detectEl = status.querySelector('.gps-detect-status');
        if (!detectEl) return;
        if (result.type === 'local') {
          detectEl.innerHTML = '🎯 自動匹配：<b>' + result.spot + '</b>（距離 ' + result.distance + 'm）';
          detectEl.className = 'gps-detect-status success';
          selectSpot(result.spot);
          if (titleEl) titleEl.innerHTML = '🎯 <b>' + result.spot + '</b>';
          if (box) { box.classList.remove('error','loading'); box.classList.add('success'); }
        } else if (result.type === 'local-warn') {
          detectEl.innerHTML = '⚠️ 最近：<b>' + result.spot + '</b>（' + result.distance + 'm，請確認）';
          detectEl.className = 'gps-detect-status warn';
          selectSpot(result.spot);
          if (titleEl) titleEl.innerHTML = '⚠️ ' + result.spot + '（遠）';
          if (box) { box.classList.remove('error','loading'); box.classList.add('warn'); }
        } else if (result.type === 'nominatim') {
          detectEl.innerHTML = '📍 已識別：<b>' + result.spot + '</b>';
          detectEl.className = 'gps-detect-status success';
          state.customSpot = result.spot;
          const customInput = document.getElementById('custom-spot');
          if (customInput) customInput.value = result.spot;
          state.selectedSpot = '其他';
          const spotSel = document.getElementById('catch-spot');
          if (spotSel) spotSel.value = '其他';
          if (titleEl) titleEl.innerHTML = '📍 ' + result.spot;
          if (box) { box.classList.remove('error','loading'); box.classList.add('success'); }
        } else {
          detectEl.innerHTML = '📍 無法識別（離最近 ' + (result.distance >= 1000 ? (result.distance/1000).toFixed(1) + 'km' : result.distance + 'm') + '）';
          detectEl.className = 'gps-detect-status muted';
          state.selectedSpot = '其他';
          const spotSel = document.getElementById('catch-spot');
          if (spotSel) spotSel.value = '其他';
          if (titleEl) titleEl.innerHTML = '📍 其他釣點';
          if (box) { box.classList.remove('error','loading'); box.classList.add('muted'); }
        }
      }).catch(e => {
        console.warn('autoDetect failed', e);
        const detectEl = status.querySelector('.gps-detect-status');
        if (detectEl) { detectEl.textContent = '⚠️ 自動識別失敗，已預設為「其他」'; detectEl.className = 'gps-detect-status warn'; }
        state.selectedSpot = '其他';
        const spotSel = document.getElementById('catch-spot');
        if (spotSel) spotSel.value = '其他';
        if (titleEl) titleEl.innerHTML = '⚠️ 識別失敗';
      });
    },
    (err) => {
      btn.disabled = false;
      btn.classList.remove('loading');
      btn.textContent = '📍 取得當前位置';
      let msg = '無法取得位置';
      if (err.code === 1) msg = '已拒絕位置權限';
      else if (err.code === 2) msg = '位置不可用';
      else if (err.code === 3) msg = '取得位置逾時';
      status.textContent = msg;
      status.className = 'gps-status error';
      if (titleEl) titleEl.textContent = '❌ ' + msg;
      if (box) { box.classList.remove('loading'); box.classList.add('error'); }
      state.selectedSpot = '其他';
      toast(msg);
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
}
/* Route L: GPS → 釣點三層自動識別 */
function haversineDistance(lat1, lng1, lat2, lng2) {
  const R = 6371e3; // 地球半徑（米）
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function selectSpot(spotName) {
  state.selectedSpot = spotName;
  const sel = document.getElementById('catch-spot');
  if (sel) {
    sel.value = spotName;
    onSpotChange(spotName);
  }
}
async function autoDetectSpot(lat, lng) {
  // 第一層：本地 Haversine 找最近
  let closest = null, closestDist = Infinity;
  FISHING_SPOTS.forEach(s => {
    if (s.lat != null && s.lng != null && !s.custom) {
      const d = haversineDistance(lat, lng, s.lat, s.lng);
      if (d < closestDist) { closestDist = d; closest = s; }
    }
  });
  if (closest && closestDist < 500) {
    return { type: 'local', spot: closest.name, distance: Math.round(closestDist) };
  }
  if (closest && closestDist < 1000) {
    return { type: 'local-warn', spot: closest.name, distance: Math.round(closestDist) };
  }
  // 第二層：Nominatim 反向地理編碼（帶緩存）
  try {
    const cacheKey = 'nominatim_' + lat + '_' + lng;
    const cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
    if (cached && Date.now() - cached.ts < 86400000) {  // 24h 緩存
      return { type: 'nominatim', spot: cached.name, distance: closestDist };
    }
    const r = await fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lng + '&zoom=18&accept-language=zh-Hant', {
      headers: { 'User-Agent': 'HK-Fishing-PWA/1.0 (educational; +https://limaking1028.github.io/HK-fishing-app)' }
    });
    if (r.ok) {
      const data = await r.json();
      const parts = (data.display_name || '').split(',').slice(0, 2);
      const name = parts.join(',').trim();
      if (name) {
        localStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), name }));
        return { type: 'nominatim', spot: name, distance: closestDist };
      }
    }
  } catch(e) { console.warn('nominatim reverse failed', e); }
  // 第三層：保留其他 + GPS
  return { type: 'none', distance: Math.round(closestDist) };
}
function previewPhoto(input) {
  const c = document.getElementById('photo-preview-container');
  if (input.files && input.files[0]) { const r = new FileReader(); r.onload = e => { c.innerHTML = '<img class="photo-preview" src="'+e.target.result+'" alt="preview">'; }; r.readAsDataURL(input.files[0]); }
}
function submitCatch() {
  if (state.selectedSpecies === null) { toast('請選擇魚種'); return; }
  const weight = parseFloat(document.getElementById('catch-weight').value);
  if (!weight || weight <= 0) { toast('請輸入重量'); return; }
  // Route H+: 行程中自動帶入 activeTrip.spot/method/bait（用戶未填時）
  if (state.activeTrip) {
    if (state.activeTrip.spot && !state.selectedSpot) {
      state.selectedSpot = state.activeTrip.spot;
      const sel = document.getElementById('catch-spot');
      if (sel) sel.value = state.activeTrip.spot;
    }
    if (state.activeTrip.method && !state.selectedMethod) {
      state.selectedMethod = state.activeTrip.method;
      const sel = document.getElementById('catch-method');
      if (sel) sel.value = state.activeTrip.method;
    }
    if (state.activeTrip.bait && !state.selectedBait) {
      state.selectedBait = state.activeTrip.bait;
      const sel = document.getElementById('catch-bait');
      if (sel) sel.value = state.activeTrip.bait;
    }
  }
  const spotRaw = document.getElementById('catch-spot').value;
  if (!spotRaw) { toast('請選擇釣點'); return; }
  const spotDetail = (state.customSpot || '').trim();
  let spot;
  if (spotRaw === '其他') {
    if (!spotDetail) { toast('請輸入釣點名稱'); return; }
    spot = spotDetail;
  } else {
    spot = spotDetail ? (spotRaw + '（' + spotDetail + '）') : spotRaw;
  }
  const fish = FISH_SPECIES[state.selectedSpecies];
  let speciesName = fish.name, speciesIcon = fish.icon;
  if (fish.custom) {
    speciesName = (state.customSpecies || '').trim();
    if (!speciesName) { toast('請輸入魚種名稱'); return; }
    speciesIcon = '🐠';
  }
  const methodRaw = document.getElementById('catch-method').value;
  const method = methodRaw === '其他' ? (state.customMethod || '').trim() : methodRaw;
  if (!method) { toast('請輸入釣法'); return; }
  const baitRaw = document.getElementById('catch-bait').value;
  const bait = baitRaw === '其他' ? (state.customBait || '').trim() : baitRaw;
  if (!bait) { toast('請輸入釣餌'); return; }
  const catchItem = {
    id: SB_ENABLED && state.user ? 'temp-' + Date.now() : Date.now(),
    user: getUserName(), species: speciesName, speciesIcon: speciesIcon,
    weight: weight, length: parseFloat(document.getElementById('catch-length').value) || 0,
    spot: spot, spotArea: getSpotInfo(spotRaw).area,
    date: document.getElementById('catch-date').value, time: document.getElementById('catch-time').value,
    method: method, bait: bait,
    verified: false, notes: document.getElementById('catch-notes').value || '', isMine: true,
    latitude: state.catchLat || null, longitude: state.catchLng || null,
    locationAccuracy: state.catchAccuracy || null, locationSource: state.catchLat ? 'gps' : null,
    tripId: state.activeTrip ? state.activeTrip.id : null,  // Route H: 帶入當前行程
  };
  state.catches.unshift(catchItem);
  state.catches.sort((a,b) => b.date.localeCompare(a.date));
  if (SB_ENABLED && state.user) {
    // 重試機制:網絡抖動(TypeError: Load failed)時自動重試 1 次
    dbAddCatchWithRetry(catchItem, 2).then(saved => {
      if (saved) {
        // Fix: 因為 catchItem 同 state.catches[i] by reference，
        // 改 catchItem.id = saved.id 之後，state.catches 嗰個 element 都會自動更新
        // (唔需要再 findIndex 改 — 之前嘅 code 因為 callback 入面先 findIndex，永遠搵唔到)
        catchItem.id = saved.id;
        catchItem.photoUrl = saved.photo_url;  // Route E: 同步 photo_url 到本地快取
        // 更新 lastCatchId 配合 success 畫面（避免 race condition）
        state.lastCatchId = saved.id;
        renderRecordView();
      }
    }).catch(e => {
      // 雲端寫入失敗 — 但魚獲已保存到 state.catches (本地緩存)
      console.error('[雲端寫入失敗]', e, 'catchItem:', catchItem);
      const speciesInfo = '[魚種:' + catchItem.species + ']';
      toast('雲端寫入失敗：' + (e.message || '網絡錯誤') + ' — 魚獲已存本地' + speciesInfo, 5000);
      // 標記為未同步,等下次啟動時自動補傳
      catchItem.unsynced = true;
      catchItem.unsyncedReason = e.message || String(e);
      catchItem.unsyncedAt = Date.now();
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.catches));
      } catch(_) {}
    });
  } else {
    saveCatches(state.catches);
  }
  state.formSuccess = true; state.selectedSpecies = null; state.customSpecies = ''; state.selectedMethod = ''; state.customMethod = ''; state.selectedBait = ''; state.customBait = ''; state.selectedSpot = ''; state.customSpot = ''; state.lastCatchId = catchItem.id;
  // Route E: 清空照片 input 與預覽，避免下次開表單殘留舊圖
  const photoEl = document.getElementById('catch-photo');
  if (photoEl) photoEl.value = '';
  const previewEl = document.getElementById('photo-preview-container');
  if (previewEl) previewEl.innerHTML = '';
  // 解鎖偵測:只對圖鑑內的魚種慶祝（自訂魚種不會加入圖鑑）
  const isInEncyclopedia = FISH_SPECIES.some(f => !f.custom && f.name === speciesName);
  const prevCatches = state.catches.filter(c => c.isMine && c.species === speciesName && c.id !== catchItem.id);
  if (isInEncyclopedia && prevCatches.length === 0) {
    setTimeout(() => showToast('🎉 解鎖新魚種：'+speciesName+'！'), 400);
  }
  // Route H: 若有進行中行程，更新 banner 統計
  if (state.activeTrip) {
    renderActiveTripBanner();
    if (state.view === 'trips') renderTripsView();
  }
  renderRecordView();
}
function resetForm() {
  state.formSuccess = false;
  state.selectedSpecies = null; state.customSpecies = '';
  // Route H+: 不清空 spot/method/bait/catchLat — 下次 addCatchInTrip() 會從 activeTrip 重新預填
  // 但如果用戶手動改過,保留用戶的選擇(state.selectedSpot 等已是用戶最終值)
  // 為咗簡化:每次 resetForm 都清空 spot/method/bait/catchLat,addCatchInTrip 會重新帶入
  state.selectedMethod = ''; state.customMethod = '';
  state.selectedBait = ''; state.customBait = '';
  state.selectedSpot = ''; state.customSpot = '';
  state.catchLat = null; state.catchLng = null; state.catchAccuracy = null;
  renderRecordView();
}

/* ============================================================
 *  Route H: 釣魚行程 (Fishing Trip)
 *  - 行程 tab UI、進行中 banner、開始/結束行程、行程詳情
 *  - activeTrip 跨 reload 持久化（localStorage）
 * ============================================================ */

// ===== DB 層 =====
async function dbLoadTrips() {
  if (!sb || !state.user) return [];
  const { data, error } = await sb.from('fishing_trips')
    .select('*')
    .or(`user_id.eq.${state.user.id},user_id.is.null`)
    .order('started_at', { ascending: false });
  if (error) { console.warn('dbLoadTrips failed', error); return []; }
  return (data || []).map(t => ({
    id: t.id, userId: t.user_id,
    startedAt: t.started_at, endedAt: t.ended_at,
    spot: t.spot || '', spotArea: t.spot_area || '',
    method: t.method || '', bait: t.bait || '',
    latitude: t.latitude ? parseFloat(t.latitude) : null,
    longitude: t.longitude ? parseFloat(t.longitude) : null,
    notes: t.notes || '',
    catchCount: t.catch_count || 0,
    totalWeight: t.total_weight ? parseFloat(t.total_weight) : 0,
    isDemo: t.user_id === null
  }));
}

async function dbAddTrip(tripData) {
  if (!sb || !state.user) return null;
  const { data, error } = await sb.from('fishing_trips').insert({
    user_id: state.user.id,
    started_at: tripData.started_at || new Date().toISOString(),
    spot: tripData.spot || null,
    spot_area: tripData.spot_area || null,
    method: tripData.method || null,
    bait: tripData.bait || null,
    latitude: tripData.latitude || null,
    longitude: tripData.longitude || null
  }).select().single();
  if (error) { console.error('dbAddTrip failed', error); toast('建立行程失敗：' + error.message); return null; }
  return data;
}

async function dbUpdateTrip(tripId, patch) {
  if (!sb || !state.user) return false;
  const { data, error } = await sb.from('fishing_trips').update(patch)
    .eq('id', tripId).eq('user_id', state.user.id).select();
  if (error) { console.error('dbUpdateTrip failed', error); toast('更新行程失敗：' + error.message); return false; }
  if (!data || data.length === 0) {
    console.warn('[trips] dbUpdateTrip matched 0 rows - tripId:', tripId, 'userId:', state.user.id);
  }
  return true;
}

async function dbEndTrip(tripId, endedAt, stats) {
  if (!sb || !state.user) return false;
  const { data, error } = await sb.from('fishing_trips').update({
    ended_at: endedAt,
    catch_count: stats.count || 0,
    total_weight: stats.totalWeight || 0
  }).eq('id', tripId).eq('user_id', state.user.id).select();
  if (error) { console.error('dbEndTrip failed', error); toast('結束行程失敗：' + error.message); return false; }
  if (!data || data.length === 0) {
    console.warn('[trips] dbEndTrip matched 0 rows - tripId:', tripId, 'userId:', state.user.id);
  }
  return true;
}

// ===== Banner =====
function renderActiveTripBanner() {
  const el = document.getElementById('active-trip-banner');
  if (!state.activeTrip) { el.style.display = 'none'; el.innerHTML = ''; return; }
  const t = state.activeTrip;
  const sec = window.tripsLib.tripDurationSec(t);
  const summary = window.tripsLib.summarizeTripCatches(t, state.catches);
  // Route I: 潮汐資訊
  let tideChip = '';
  if (window.tidesLib && t.spot) {
    const tide = window.tidesLib.describeCurrent(window.tidesLib.getStationForSpot(t.spot), Date.now());
    if (tide) {
      const tideIcon = tide.trend === 'rising' ? '↗️' : tide.trend === 'falling' ? '↘️' : '→';
      const nextTxt = tide.nextHigh ? `${window.tidesLib.formatTime(tide.nextHigh.ms)} 高${tide.nextHigh.height}m` :
                      tide.nextLow ? `${window.tidesLib.formatTime(tide.nextLow.ms)} 低${tide.nextLow.height}m` : '';
      tideChip = '<div class="atb-tide">🌊 ' + tide.height + 'm ' + tideIcon + ' ' + tide.trendText +
        (nextTxt ? ' · ' + nextTxt : '') + '</div>';
    }
  }
  el.style.display = 'block';
  el.innerHTML =
    '<div class="active-trip-banner" onclick="goToView(\'trips\');">'
      + '<span class="atb-dot"></span>'
      + '<div class="atb-info">'
        + '<div class="atb-title">⏱️ 行程進行中' + (t.spot ? ' · ' + escapeHtml(t.spot) : '') + '</div>'
        + '<div class="atb-timer" id="atb-timer">' + window.tripsLib.formatTimerDisplay(sec) + '</div>'
        + '<div class="atb-meta">' + summary.count + ' 條魚 · ' + summary.totalWeight.toFixed(2) + ' 斤</div>'
        + tideChip
      + '</div>'
      + '<button class="atb-btn" onclick="event.stopPropagation();addCatchInTrip();">➕ 加魚</button>'
      + '<button class="atb-end" onclick="event.stopPropagation();endTrip(false);">結束</button>'
    + '</div>';
}

function tickActiveTripBanner() {
  if (!state.activeTrip) return;
  const sec = window.tripsLib.tripDurationSec(state.activeTrip);
  const timerEl = document.getElementById('atb-timer');
  if (timerEl) timerEl.textContent = window.tripsLib.formatTimerDisplay(sec);
  // Route I: 每分鐘更新潮汐 chip（避免每秒重繪整個 banner）
  const t = state.activeTrip;
  if (window.tidesLib && t.spot && (!state._tideTick || Date.now() - state._tideTick > 60000)) {
    state._tideTick = Date.now();
    const chip = document.querySelector('.atb-tide');
    if (chip) {
      const tide = window.tidesLib.describeCurrent(window.tidesLib.getStationForSpot(t.spot), Date.now());
      if (tide) {
        const tideIcon = tide.trend === 'rising' ? '↗️' : tide.trend === 'falling' ? '↘️' : '→';
        const nextTxt = tide.nextHigh ? `${window.tidesLib.formatTime(tide.nextHigh.ms)} 高${tide.nextHigh.height}m` :
                        tide.nextLow ? `${window.tidesLib.formatTime(tide.nextLow.ms)} 低${tide.nextLow.height}m` : '';
        chip.innerHTML = '🌊 ' + tide.height + 'm ' + tideIcon + ' ' + tide.trendText +
          (nextTxt ? ' · ' + nextTxt : '');
      }
    }
  }
}

// ===== 開始 / 結束行程 =====
function startTrip() {
  if (!sb || !state.user) { toast('請先登入'); return; }
  // Route H+: 進入 picker 模式（GPS 自動檢測釣點）
  state.tripPicking = true;
  state.tripPickingSpot = '';
  state.tripPickingDetectedSpot = '';
  state.tripPickingCustom = '';
  state.tripPickingMethod = '';
  state.tripPickingBait = '';
  state.tripPickingLat = null;
  state.tripPickingLng = null;
  state.tripPickingAccuracy = null;
  renderTripsView();
}

function editActiveTrip() {
  if (!state.activeTrip) return;
  // 預填當前行程的值，進入 picker 模式（用 tripPicking 但 flag 不同）
  state.tripPicking = true;
  // 從現有行程 spot 拆出主名稱（去除括號備註）
  const activeSpotFull = state.activeTrip.spot || '';
  const mainSpot = activeSpotFull.split('（')[0].trim();
  state.tripPickingSpot = mainSpot;
  state.tripPickingDetectedSpot = mainSpot;

function cancelTripPick() {

  state.editingActiveTrip = false;
  state.tripPickingSpot = '';
  state.tripPickingDetectedSpot = '';
  state.tripPickingCustom = '';
  state.tripPickingMethod = '';
  state.tripPickingBait = '';
  renderTripsView();
}

// 進行中行程：快速重新 GPS 定位（不需進 picker）
async function retripActiveGPS() {
  if (!state.activeTrip) return;
  if (!navigator.geolocation) { toast('瀏覽器不支援定位'); return; }
  toast('🔍 重新定位中...');
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const lat = Math.round(pos.coords.latitude * 1000) / 1000;
      const lng = Math.round(pos.coords.longitude * 1000) / 1000;
      const acc = Math.round(pos.coords.accuracy);
      let detectedSpot = state.activeTrip.spot;
      try {
        const result = await autoDetectSpot(lat, lng);
        if (result.type === 'local' || result.type === 'local-warn' || result.type === 'nominatim') {
          detectedSpot = result.spot;
        } else {
          detectedSpot = '其他';
        }
      } catch(e) { console.warn(e); }
      const custom = state.activeTrip.spot && state.activeTrip.spot.includes('（') ? state.activeTrip.spot.split('（')[1].replace(/）/g,'').trim() : '';
      const fullSpot = custom && !detectedSpot.includes('（') ? detectedSpot + '（' + custom + '）' : detectedSpot;
      const ok = await dbUpdateTrip(state.activeTrip.id, {
        spot: fullSpot,
        spot_area: getSpotInfo(detectedSpot).area || null,
        latitude: lat,
        longitude: lng,
        accuracy: acc
      });
      if (ok) {
        state.activeTrip.spot = fullSpot;
        state.activeTrip.spotArea = getSpotInfo(detectedSpot).area || '';
        state.activeTrip.latitude = lat;
        state.activeTrip.longitude = lng;
        state.activeTrip.accuracy = acc;
        window.tripsLib.saveActiveTrip(state.activeTrip);
        state.trips = await dbLoadTrips();
        renderTripDetailView(state.activeTrip.id);
        renderActiveTripBanner();
        toast('🎯 已更新：' + fullSpot);
      } else {
        toast('更新失敗');
      }
    },
    (err) => {
      let msg = '無法取得位置';
      if (err.code === 1) msg = '已拒絕位置權限';
      else if (err.code === 2) msg = '位置不可用';
      else if (err.code === 3) msg = '取得位置逾時';
      toast(msg);
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
  );
}

function onTripSpotChange(s) {
  state.tripPickingSpot = s;
  // Route I: 更新潮汐預覽
  const el = document.getElementById('trip-tide-preview');
  if (!el) return;
  if (!s || !window.tidesLib) { el.innerHTML = ''; return; }
  const station = window.tidesLib.getStationForSpot(s);
  const tide = window.tidesLib.describeCurrent(station, Date.now());
  if (!tide) { el.innerHTML = ''; return; }
  const next = window.tidesLib.getNextTides(station, Date.now(), 2);
  let html = '🌊 <b>當前</b> ' + tide.height + 'm ' + tide.trendText;
  if (next.length > 0) {
    const n = next[0];
    html += ' · 接下來 <b>' + window.tidesLib.formatTime(n.ms) + '</b> ' +
      (n.type === 'high' ? '🔺高潮' : '🔻低潮') + ' ' + n.height + 'm';
  }
  el.innerHTML = html + '<div style="font-size:10px;color:var(--gray-4);margin-top:2px;">（資料來源：HKO ' + station + '）</div>';
}
function onTripMethodChange(m) { state.tripPickingMethod = m; }
function onTripBaitChange(b) { state.tripPickingBait = b; }

function tripGetGPS() {
  const btn = document.getElementById('trip-gps-btn');
  const status = document.getElementById('trip-gps-status');
  if (!navigator.geolocation) { status.textContent = '瀏覽器不支援定位'; status.className = 'gps-status error'; return; }
  btn.disabled = true; btn.classList.add('loading'); btn.textContent = '⏳ 定位中...';
  status.textContent = '正在取得位置...'; status.className = 'gps-status';
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const lat = Math.round(pos.coords.latitude * 1000) / 1000;
      const lng = Math.round(pos.coords.longitude * 1000) / 1000;
      const acc = Math.round(pos.coords.accuracy);
      state.tripPickingLat = lat; state.tripPickingLng = lng; state.tripPickingAccuracy = acc;
      document.getElementById('trip-lat').value = lat;
      document.getElementById('trip-lng').value = lng;
      document.getElementById('trip-accuracy').value = acc;
      btn.disabled = false; btn.classList.remove('loading');
      status.className = 'gps-status success';
      status.innerHTML = '✓ 已記錄 GPS（精度 ±' + acc + 'm，已模糊化）<br><span class="gps-detect-status">🔍 正在自動識別釣點...</span>';
      // 整合 autoDetectSpot 三層識別（與魚獲表單共用邏輯）
      try {
        const result = await autoDetectSpot(lat, lng);
        const detectEl = status.querySelector('.gps-detect-status');
        if (!detectEl) return;
        let detectedSpot = '';
        if (result.type === 'local') {
          detectedSpot = result.spot;
          detectEl.innerHTML = '🎯 自動匹配：<b>' + detectedSpot + '</b>（距離 ' + result.distance + 'm）';
          detectEl.className = 'gps-detect-status success';
        } else if (result.type === 'local-warn') {
          detectedSpot = result.spot;
          detectEl.innerHTML = '⚠️ 最近：<b>' + detectedSpot + '</b>（' + result.distance + 'm，請確認）';
          detectEl.className = 'gps-detect-status warn';
        } else if (result.type === 'nominatim') {
          detectedSpot = result.spot;
          detectEl.innerHTML = '📍 已識別：<b>' + detectedSpot + '</b>';
          detectEl.className = 'gps-detect-status success';
        } else {
          detectedSpot = '其他';
          detectEl.innerHTML = '📍 無法識別（離最近 ' + (result.distance >= 1000 ? ((result.distance/1000).toFixed(1) + 'km') : (result.distance + 'm')) + '），請於下方輸入釣點';
          detectEl.className = 'gps-detect-status muted';
        }
        state.tripPickingDetectedSpot = detectedSpot;
        state.tripPickingSpot = detectedSpot;  // 同步到 picker state
        btn.textContent = '🔄 重新定位';
        // 將識別結果寫到 hidden field + 重新渲染潮汐預覽與按鈕狀態
        const hiddenField = document.getElementById('trip-detected-spot');
        if (hiddenField) hiddenField.value = detectedSpot;
        try { onTripSpotChange(detectedSpot); } catch(e) {}
        // 啟用「開始行程」按鈕
        const confirmBtn = document.querySelector('button[onclick="confirmStartTrip();"]');
        if (confirmBtn) { confirmBtn.disabled = false; confirmBtn.style.opacity = '1'; }
      } catch(e) {
        console.warn('trip autoDetect failed', e);
        const detectEl = status.querySelector('.gps-detect-status');
        if (detectEl) { detectEl.textContent = '⚠️ 自動識別失敗，請手動輸入'; detectEl.className = 'gps-detect-status warn'; }
        state.tripPickingDetectedSpot = '其他';
        state.tripPickingSpot = '其他';
        btn.textContent = '🔄 重新定位';
        const confirmBtn = document.querySelector('button[onclick="confirmStartTrip();"]');
        if (confirmBtn) { confirmBtn.disabled = false; confirmBtn.style.opacity = '1'; }
      }
    },
    (err) => {
      btn.disabled = false; btn.classList.remove('loading');
      btn.textContent = '📍 啟用 GPS 自動識別';
      let msg = '無法取得位置';
      if (err.code === 1) msg = '已拒絕位置權限';
      else if (err.code === 2) msg = '位置不可用';
      else if (err.code === 3) msg = '取得位置逾時';
      status.className = 'gps-status error';
      status.innerHTML = '✗ ' + msg + '<br><span style="font-size:11px;color:var(--gray-5);">請到瀏覽器設置允許位置權限</span>';
      toast(msg);
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }
  );
}

// 從使用者歷史魚獲抓最常用 spot（用於 picker 選單）
function getRecentSpots(limit) {
  const counts = {};
  (state.catches || []).filter(c => c.isMine && c.spot).forEach(c => {
    counts[c.spot] = (counts[c.spot] || 0) + 1;
  });
  return Object.keys(counts)
    .filter(name => !FISHING_SPOTS.find(s => s.name === name))  // 排除已在預設清單的
    .sort((a, b) => counts[b] - counts[a])
    .slice(0, limit);
}

async function confirmStartTrip() {
  const spot = state.tripPickingDetectedSpot || state.tripPickingSpot;
  if (!spot) { toast('請先啟用 GPS 自動識別'); return; }
  const custom = (state.tripPickingCustom || '').trim();
  const fullSpot = custom && !spot.includes('（') ? spot + '（' + custom + '）' : spot;
  const method = (state.tripPickingMethod || '').trim();
  const bait = (state.tripPickingBait || '').trim();

  // 編輯模式：只更新現有 trip
  if (state.editingActiveTrip && state.activeTrip) {
    const ok = await dbUpdateTrip(state.activeTrip.id, {
      spot: fullSpot,
      spot_area: getSpotInfo(spot).area || null,
      method: method || null,
      bait: bait || null,
      latitude: state.tripPickingLat,
      longitude: state.tripPickingLng,
      accuracy: state.tripPickingAccuracy
    });
    if (ok) {
      // 更新 state.activeTrip
      state.activeTrip.spot = fullSpot;
      state.activeTrip.spotArea = getSpotInfo(spot).area || '';
      state.activeTrip.method = method;
      state.activeTrip.bait = bait;
      state.activeTrip.latitude = state.tripPickingLat;
      state.activeTrip.longitude = state.tripPickingLng;
      state.activeTrip.accuracy = state.tripPickingAccuracy;
      window.tripsLib.saveActiveTrip(state.activeTrip);
      state.tripPicking = false;
      state.editingActiveTrip = false;
      state.tripPickingSpot = ''; state.tripPickingDetectedSpot = ''; state.tripPickingCustom = '';
      state.tripPickingMethod = ''; state.tripPickingBait = '';
      state.tripPickingLat = null; state.tripPickingLng = null;
      state.trips = await dbLoadTrips();
      renderActiveTripBanner();
      renderTripsView();
      if (state.view === 'record') renderRecordView();
      toast('✅ 行程已更新');
    }
    return;
  }

  const trip = await dbAddTrip({
    started_at: new Date().toISOString(),
    spot: fullSpot,
    spot_area: getSpotInfo(spot).area || null,
    method: method || null,
    bait: bait || null,
    latitude: state.tripPickingLat,
    longitude: state.tripPickingLng,
    accuracy: state.tripPickingAccuracy
  });
  if (!trip) return;
  state.activeTrip = {
    id: trip.id, startedAt: trip.started_at, endedAt: null,
    spot: fullSpot, spotArea: getSpotInfo(spot).area || '',
    method: method, bait: bait,
    latitude: state.tripPickingLat, longitude: state.tripPickingLng,
    accuracy: state.tripPickingAccuracy, notes: ''
  };
  // 清掉 picker 狀態
  state.tripPicking = false;
  state.editingActiveTrip = false;
  state.tripPickingSpot = ''; state.tripPickingDetectedSpot = ''; state.tripPickingCustom = '';
  state.tripPickingMethod = ''; state.tripPickingBait = '';
  state.tripPickingLat = null; state.tripPickingLng = null;
  window.tripsLib.saveActiveTrip(state.activeTrip);
  window.tripsLib.startTimer(tickActiveTripBanner, 1000);
  renderActiveTripBanner();
  toast('🎣 行程已開始：' + fullSpot);
  // 重新載入 trips 並跳到記錄 tab 讓用戶加第一條魚
  state.trips = await dbLoadTrips();
  renderTripsView();
  switchView('record');
  renderRecordView();
}

async function endTrip(skipConfirm) {
  if (!state.activeTrip) return;
  if (!skipConfirm) {
    const summary = window.tripsLib.summarizeTripCatches(state.activeTrip, state.catches);
    if (!confirm('結束當前行程？\n\n已記錄 ' + summary.count + ' 條魚，共 ' + summary.totalWeight.toFixed(2) + ' 斤')) return;
  }
  const endedAt = new Date().toISOString();
  const stats = window.tripsLib.summarizeTripCatches(state.activeTrip, state.catches);
  const ok = await dbEndTrip(state.activeTrip.id, endedAt, {
    count: stats.count, totalWeight: stats.totalWeight
  });
  if (!ok) return;
  window.tripsLib.stopTimer();
  window.tripsLib.clearActiveTrip();
  state.activeTrip = null;
  state.trips = await dbLoadTrips();
  renderActiveTripBanner();
  renderTripsView();
  if (state.view === 'record') renderRecordView();
  toast('✅ 行程已結束');
}

async function addCatchInTrip() {
  // 從 banner 快捷加魚：切到 record tab，自動預填行程的釣點/釣法/釣餌/GPS
  if (!state.activeTrip) return;
  const trip = state.activeTrip;
  // 預填釣點:拆 activeTrip.spot 「主名稱（備註）」 → 主名稱進 selectedSpot,備註進 customSpot
  const spotFull = trip.spot || '';
  const mainSpot = spotFull.split('（')[0].trim();
  const customSpot = spotFull.includes('（') ? spotFull.split('（')[1].replace(/）/g,'').trim() : '';
  if (mainSpot) {
    state.selectedSpot = mainSpot;
    state.customSpot = customSpot || '';
  }
  // 預填釣法
  if (trip.method) {
    state.selectedMethod = trip.method;
    // 「其他」自訂釣法要還原
    const isCustomMethod = !FISHING_METHODS.includes(trip.method);
    state.customMethod = isCustomMethod ? trip.method : '';
    if (isCustomMethod) state.selectedMethod = '其他';
  }
  // 預填釣餌
  if (trip.bait) {
    state.selectedBait = trip.bait;
    const isCustomBait = !BAIT_TYPES.includes(trip.bait);
    state.customBait = isCustomBait ? trip.bait : '';
    if (isCustomBait) state.selectedBait = '其他';
  }
  // 預填 GPS 座標(讓表單打開就有位置)
  if (trip.latitude != null && trip.longitude != null) {
    state.catchLat = trip.latitude;
    state.catchLng = trip.longitude;
    state.catchAccuracy = trip.accuracy || null;
  }
  switchView('record');
  renderRecordView();
  // 智能 toast:帶入內容時提示用戶
  const inheritMsg = [trip.spot && '📍 '+trip.spot, trip.method && '🎣 '+trip.method, trip.bait && '🦐 '+trip.bait].filter(Boolean).join(' · ');
  toast(inheritMsg ? ('✅ 已帶入行程資訊：'+inheritMsg) : '填寫這次釣到的魚，會自動加入當前行程');
}

        + '<div style="font-size:15px;color:var(--gray-6);margin-bottom:6px;font-weight:600;">準備好去釣魚？</div>'
        + '<div style="font-size:13px;color:var(--gray-5);margin-bottom:18px;">開始行程後會自動計時，<br>釣到的魚會歸入這個行程</div>'
        + '<button class="start-trip-btn" onclick="startTrip();">▶ 開始行程</button>'

    }
  }
  // 歷史行程
  if (trips.length > 0) {
    html += '<div class="section-title" style="margin-top:18px;">📜 歷史行程（' + trips.length + '）</div>';
    trips.forEach(t => {
      const sec = window.tripsLib.tripDurationSec(t);
      html += renderTripCard(t, sec);
    });
  } else if (!active) {
    html += '<div style="text-align:center;color:var(--gray-4);font-size:13px;padding:20px 0;">還沒有歷史行程</div>';
  }
  view.innerHTML = html;
  view.classList.add('active');
  // Route I: 如果 picker 開住且有 spot，主動觸發潮汐預覽
  if (state.tripPicking && state.tripPickingSpot) {
    try { onTripSpotChange(state.tripPickingSpot); } catch(e) {}
  }
  } catch(e) {
    console.error('renderTripsView error:', e);
    const view = document.getElementById('view-trips');
    if (view) view.innerHTML = '<div style="background:#fee;color:#c00;padding:16px;border-radius:8px;font-size:12px;margin:12px;">⚠️ 行程頁面錯誤<br><br>' + (e.message || e) + '<br><br>請截圖傳給我</div>';
  }
}

function renderTripCard(trip, durationSec) {
  const d = new Date(trip.startedAt);
  const dateStr = d.toLocaleDateString('zh-HK', { month:'numeric', day:'numeric' });
  const timeStr = d.toTimeString().slice(0,5);
  const statusText = window.tripsLib.tripStatusText(trip);
  const isActive = !trip.endedAt;
  const tags = [];
  if (trip.method) tags.push('🎣 ' + escapeHtml(trip.method));
  if (trip.bait) tags.push('🦐 ' + escapeHtml(trip.bait));
  return '<div class="trip-card ' + (isActive ? '' : 'ended') + '" onclick="openTripDetail(\'' + trip.id + '\')">'
    + '<div class="trip-card-header">'
      + '<div class="trip-card-title">' + (trip.spot ? escapeHtml(trip.spot) : '未命名行程') + '</div>'
      + '<div class="trip-card-time">' + statusText + '</div>'
    + '</div>'
    + '<div style="font-size:11px;color:var(--gray-4);margin-bottom:6px;">' + dateStr + ' ' + timeStr + ' · 時長 ' + window.tripsLib.formatDuration(durationSec) + '</div>'
    + (tags.length ? '<div style="font-size:11px;color:var(--gray-5);margin-bottom:6px;">' + tags.join(' · ') + '</div>' : '')
    + '<div class="trip-card-stats">'
      + '<span>🐟 ' + (trip.catchCount || 0) + ' 條</span>'
      + '<span>⚖️ ' + (trip.totalWeight || 0).toFixed(2) + ' 斤</span>'
    + '</div>'
  + '</div>';
}

  } else {
    html += '<div style="text-align:center;color:var(--gray-4);font-size:13px;padding:24px 0;">這次行程還沒有魚獲</div>';
  }
  view.innerHTML = html;

async function resumeActiveTrip() {
  const saved = window.tripsLib.loadActiveTrip();
  if (!saved) return;
  // 從 trips 找對應的還在進行的 trip
  state.trips = await dbLoadTrips();
  const t = state.trips.find(x => x.id === saved.id && !x.endedAt);
  if (t) {
    state.activeTrip = t;
    window.tripsLib.startTimer(tickActiveTripBanner, 1000);
    renderActiveTripBanner();
    // trips view 如果當前頁也要更新
    if (state.view === 'trips') renderTripsView();
  } else {
    // 行程已被結束（可能被其他裝置結束）→ 清除 localStorage
    window.tripsLib.clearActiveTrip();
  }
}

/* ===== My Catches View ===== */
function getMyCatchRankings() {
  const rankings = {};
  const filtered = state.catches;
  const qualify = c => c.verified || c.isMine || c.imported;
  // 重量王者：按用戶最大魚獲排名
  const userBiggest = {};
  filtered.forEach(c => { if (qualify(c)) { if (!userBiggest[c.user] || c.weight > userBiggest[c.user].weight) userBiggest[c.user] = c; } });
  Object.values(userBiggest).sort((a,b) => b.weight - a.weight).forEach((item, idx) => {
    if (item.isMine) { (rankings[item.id] = rankings[item.id] || []).push({lb:'重量王者', rank: idx+1}); }
  });
  // 品種王者：按用戶不同魚種數量排名（徽章標記在重量王者上）
  const userSpecies = {};
  filtered.forEach(c => { if (qualify(c)) { userSpecies[c.user] = userSpecies[c.user] || {user:c.user, species:new Set(), catches:[]}; userSpecies[c.user].species.add(c.species); userSpecies[c.user].catches.push(c); } });
  Object.values(userSpecies).sort((a,b) => b.species.size - a.species.size).forEach((item, idx) => {
    const mine = item.catches.filter(c => c.isMine);
    if (mine.length) {
      const biggest = mine.slice().sort((a,b) => b.weight - a.weight)[0];
      (rankings[biggest.id] = rankings[biggest.id] || []).push({lb:'品種王者', rank: idx+1});
    }
  });
  // 數量王者：按用戶總數排名（標記在最新一條）
  const userCounts = {};
  filtered.forEach(c => { if (qualify(c)) { if (!userCounts[c.user]) userCounts[c.user] = {user:c.user, count:0, catches:[]}; userCounts[c.user].count++; userCounts[c.user].catches.push(c); } });
  Object.values(userCounts).sort((a,b) => b.count - a.count).forEach((item, idx) => {
    const mine = item.catches.filter(c => c.isMine);
    if (mine.length) {
      const latest = mine.sort((a,b) => (b.date+b.time).localeCompare(a.date+a.time))[0];
      (rankings[latest.id] = rankings[latest.id] || []).push({lb:'數量王者', rank: idx+1});
    }
  });
  return rankings;
}
function renderMyView() {

  }

  const speciesCount = new Set(myCatches.map(c => c.species)).size;
  // Route H+: 總釣魚時間（已完成行程 + 進行中行程的當前時長）

    sum + (window.tripsLib ? window.tripsLib.tripDurationSec(t) : 0), 0);

    totalTripValue = '0'; totalTripSub = '分鐘';

    totalTripValue = String(Math.floor(totalTripSec / 60)); totalTripSub = '分鐘';
  } else {
    totalTripValue = (Math.round(totalTripSec / 360) / 10).toFixed(1); totalTripSub = '小時';
  }
  const myRankings = getMyCatchRankings();
  // 各魚種數量（基於未過濾的全部記錄）
  const allMap = {};
  state.catches.filter(c => c.isMine).forEach(c => { allMap[c.species] = (allMap[c.species]||0)+1; });
  const allBreakdown = Object.entries(allMap).sort((a,b)=>b[1]-a[1]);
  // 各魚種的 catch-card（基於未過濾的全部記錄）

  // 過濾後的列表（用於「全部記錄」section）
  let filtered = myCatches;
  if (state.myFilter === 'month') filtered = myCatches.filter(c => periodFilter(c, 'month'));
  else if (state.myFilter === 'quarter') filtered = myCatches.filter(c => periodFilter(c, 'quarter'));
  // 重量王者詳細卡
  let biggestHtml = '';
  if (biggest) {

    // Route Real-photo: 用戶上傳照片 → 魚種真實照片 → SVG fallback

  }
  // 各魚種數量（摺疊）
  let speciesGroupHtml = '';
  if (allBreakdown.length > 0) {
    const secKey = 'speciesGroup';
    const isExpanded = !!state.ui.expandedSections[secKey];
    let rows = '';
    allBreakdown.forEach(([sp, n]) => {
      const f = getFishInfo(sp);
      // Route Real-photo: 用魚種真實照片
      const thumb = speciesPhotoHtml(sp, { klass: 'species-row-thumb-img' });

      const spExpanded = !!state.ui.expandedSpecies[spKey];

    });

    + '<div class="stat-card"><div class="stat-value">'+(biggest?biggest.weight:0)+'<span style="font-size:13px">斤</span></div><div class="stat-label">重量王者'+(biggest?' ('+biggest.species+')':'')+'</div></div>'
    + '<div class="stat-card"><div class="stat-value">'+speciesCount+'</div><div class="stat-label">魚種數</div></div>'
    + '<div class="stat-card" id="stat-total-time"><div class="stat-value">'+totalTripValue+'<span style="font-size:13px">'+totalTripSub+'</span></div><div class="stat-label">總釣魚時間</div>'+(state.activeTrip?'<div class="stat-sub">⏱ 行程進行中</div>':'')+'</div>'

    + speciesGroupHtml
    + allRecordsHtml;
  // Route H+: 進行中行程時，每分鐘更新總釣魚時間（避免每秒重繪整頁）
  if (state._myTimeTick) clearInterval(state._myTimeTick);
  if (state.activeTrip) {
    state._myTimeTick = setInterval(() => {
      const el = document.getElementById('stat-total-time');
      if (!el || state.view !== 'my' || state.mySubTab !== 'log') {
        clearInterval(state._myTimeTick); state._myTimeTick = null; return;
      }
      const sec = (state.trips || []).reduce((s, t) =>
        s + (window.tripsLib ? window.tripsLib.tripDurationSec(t) : 0), 0);

      el.innerHTML = '<div class="stat-value">'+v+'<span style="font-size:13px">'+u+'</span></div><div class="stat-label">總釣魚時間</div><div class="stat-sub">⏱ 行程進行中</div>';

  } else {
    state._myTimeTick = null;
  }
}

function renderCatchCard(c, rankings) {
  let rankBadges = '';
  if (rankings && rankings[c.id]) {
    rankBadges = rankings[c.id].map(r => '<span class="rank-badge">🏆 '+r.lb+' #'+r.rank+'</span>').join('');
  }
  // Route Real-photo: 用戶上傳照片 → 魚種真實照片 → SVG fallback

function importCatch(shareData) {
  try {
    const d = JSON.parse(decodeURIComponent(escape(atob(shareData))));
    const fishInfo = FISH_SPECIES.find(f => f.name === d.s);
    const catchItem = {
      id: SB_ENABLED && state.user ? 'temp-' + Date.now() : Date.now(),
      user: d.u || '朋友', species: d.s, speciesIcon: d.i || fishInfo?.icon || '🐟',
      weight: d.w, length: d.l || 0, spot: d.p, spotArea: getSpotInfo(d.p)?.area || '',
      date: d.d, time: d.t, method: d.m || '', bait: d.b || '',
      verified: false, notes: d.n || '', isMine: false, imported: true, shareKey: shareData
    };
    state.catches.unshift(catchItem);
    state.catches.sort((a,b) => b.date.localeCompare(a.date));
    if (SB_ENABLED && state.user) {
      // 雲端模式：插到自己的 user_id 下
      dbAddCatch({ ...catchItem, isMine: true, imported: false }).then(saved => {
        if (saved) catchItem.id = saved.id;
      }).catch(e => showToast('雲端寫入失敗：' + e.message));
    } else {
      saveCatches(state.catches);
    }
    closeImportModal();
    clearShareParam();
    switchView('leaderboard');
    showToast('已收藏！呢條魚獲已加入排行榜');
  } catch(e) { showToast('收藏失敗，數據有誤'); }
}

/* ===== Leaderboard View ===== */
function renderLeaderboardView() {
  const view = document.getElementById('view-leaderboard');
  const filtered = state.catches.filter(c => periodFilter(c, state.lbPeriod));
  let lbData = [];
  if (state.lbType === 'biggest') {
    const m = {};
    filtered.forEach(c => { if (c.verified || c.isMine || c.imported) { if (!m[c.user] || c.weight > m[c.user].weight) m[c.user] = {...c}; } });
    lbData = Object.values(m).sort((a,b) => b.weight - a.weight);
  } else if (state.lbType === 'quantity') {
    const m = {};
    filtered.forEach(c => { if (c.verified || c.isMine || c.imported) { m[c.user] = m[c.user] || {user:c.user, count:0, spots:new Set(), species:new Set(), isMine:false}; m[c.user].count++; m[c.user].spots.add(c.spot); m[c.user].species.add(c.species); if (c.isMine) m[c.user].isMine = true; } });
    lbData = Object.values(m).map(u => ({user:u.user, count:u.count, spotCount:u.spots.size, speciesCount:u.species.size, isMine:u.isMine})).sort((a,b) => b.count - a.count);
  } else {
    // 品種王者：統計每個用戶釣到多少種不同魚種，按數量排名
    const m = {};
    filtered.forEach(c => { if (c.verified || c.isMine || c.imported) { m[c.user] = m[c.user] || {user:c.user, species:new Set(), spots:new Set(), catches:[]}; m[c.user].species.add(c.species); m[c.user].spots.add(c.spot); m[c.user].catches.push(c); } });
    lbData = Object.values(m).map(u => {
      const biggest = u.catches.reduce((mx,c) => c.weight > mx.weight ? c : mx, u.catches[0]);
      return { user:u.user, speciesCount:u.species.size, spotCount:u.spots.size, biggestWeight:biggest.weight, isMine:u.catches.some(c=>c.isMine) };
    }).sort((a,b) => b.speciesCount - a.speciesCount || b.biggestWeight - a.biggestWeight);
  }
  let listHtml = '';
  if (lbData.length === 0) {
    listHtml = '<div class="empty-state"><div class="empty-icon">🏆</div><div class="empty-text">暫無排行榜數據</div></div>';
  } else {
    lbData.forEach((item, idx) => {
      const rank = idx + 1; let rankClass = 'normal';
      if (rank===1) rankClass='gold'; else if (rank===2) rankClass='silver'; else if (rank===3) rankClass='bronze';
      let value='', detail='';
      if (state.lbType==='biggest') { value=item.weight+'<span class="unit">斤</span>'; detail=item.species+' · '+item.spot+' · '+daysAgo(item.date); }
      else if (state.lbType==='quantity') { value=item.count+'<span class="unit">條</span>'; detail=item.speciesCount+' 種魚 · '+item.spotCount+' 個釣點'; }
      else { value=item.speciesCount+'<span class="unit">種</span>'; detail='最大 '+item.biggestWeight+' 斤 · 釣過 '+item.spotCount+' 個釣點'; }
      // 第一名「全港霸主」：用原本 flex 結構，只加金色背景 + 徽章跨行 + detail 跨行
      let championTitle = '';
      if (state.lbType === 'biggest') championTitle = '全港重量霸主';
      else if (state.lbType === 'quantity') championTitle = '全港魚獲霸主';
      else if (state.lbType === 'species') championTitle = '全港魚種霸主';
      const meTag = item.isMine?' <span style="font-size:11px;color:var(--orange)">（我）</span>':'';
      if (rank === 1) {
        listHtml += '<div class="lb-item lb-item-champion'+(item.isMine?' mine':'')+'">'
          +'<div class="lb-rank '+rankClass+'">'+rank+'</div>'
          +'<div class="lb-user">'
            +'<div class="lb-username">'+item.user+meTag+'</div>'
            +'<div class="lb-champion-badge">👑 '+championTitle+' 👑</div>'
            +'<div class="lb-detail">'+detail+'</div>'
          +'</div>'
          +'<div class="lb-value">'+value+'</div>'
          +'</div>';
      } else {
        listHtml += '<div class="lb-item'+(item.isMine?' mine':'')+'">'
          +'<div class="lb-rank '+rankClass+'">'+rank+'</div>'
          +'<div class="lb-user"><div class="lb-username">'+item.user+meTag+'<div class="lb-detail">'+detail+'</div></div></div>'
          +'<div class="lb-value">'+value+'</div>'
          +'</div>';
      }
    });
  }
  view.innerHTML = '<div class="lb-tabs"><button class="lb-tab '+(state.lbType==='biggest'?'active':'')+'" onclick="setLbType(\'biggest\')">重量王者</button><button class="lb-tab '+(state.lbType==='quantity'?'active':'')+'" onclick="setLbType(\'quantity\')">數量王者</button><button class="lb-tab '+(state.lbType==='species'?'active':'')+'" onclick="setLbType(\'species\')">品種王者</button></div>'
    + '<div class="lb-period-row"><button class="lb-period '+(state.lbPeriod==='all'?'active':'')+'" onclick="setLbPeriod(\'all\')">全部</button><button class="lb-period '+(state.lbPeriod==='year'?'active':'')+'" onclick="setLbPeriod(\'year\')">年度</button><button class="lb-period '+(state.lbPeriod==='quarter'?'active':'')+'" onclick="setLbPeriod(\'quarter\')">季度</button><button class="lb-period '+(state.lbPeriod==='month'?'active':'')+'" onclick="setLbPeriod(\'month\')">月度</button></div>'
    + '<div class="lb-list">'+listHtml+'</div>'
    + '<div style="font-size:12px;color:var(--gray-4);text-align:center;padding:12px;">排行榜只計有效紀錄（附照片/GPS）<br>規則公開透明，可追溯至原始紀錄</div>';
}
