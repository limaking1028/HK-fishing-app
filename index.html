/* ============================================================
 * Route J: GPS 自動偵測最近站
 * ============================================================ */
async function requestUserLocation() {
  if (!window.geoLib || !window.tidesLib) return;
  // 30 分鐘內只請求一次（避免重複彈權限）
  const now = Date.now();
  if (state.geoRequestedAt && (now - state.geoRequestedAt) < 30 * 60 * 1000) return;
  // 如果已經有 location，唔再請求
  if (state.userLocation) return;

  state.geoStatus = 'locating';
  state.geoRequestedAt = now;
  renderLocationCard(); // 立即更新 UI 顯示「定位中」

  try {
    const loc = await window.geoLib.getUserLocation();
    state.userLocation = loc;
    const stations = window.tidesLib.getAllStations();
    state.nearestStations = window.geoLib.getNearestStations(loc.lat, loc.lng, stations, 3);
    state.geoStatus = 'success';
    state.geoError = null;
  } catch (err) {
    state.geoStatus = err.code || 'error';
    state.geoError = err.message || '定位失敗';
    state.userLocation = null;
    state.nearestStations = [];
  }
  // 如果用戶仲停留喺地圖 tab，refresh 卡片
  if (state.view === 'map' && (state.mapTab || 'map') === 'map') {
    renderLocationCard();
  }
}

function renderLocationCard() {
  const card = document.getElementById('location-card');
  if (!card) return;
  // 卡片只喺地圖 sub-tab 顯示
  if (state.view !== 'map' || (state.mapTab || 'map') !== 'map') {
    card.innerHTML = '';
    return;
  }
  const status = state.geoStatus;
  let html = '';

  if (status === 'idle') {
    html = '<div class="loc-row">'
      + '<span class="loc-icon">📍</span>'
      + '<div class="loc-text">'
      + '<div class="loc-title">想知最近邊個站？</div>'
      + '<div class="loc-sub">開啟定位搵到你附近 3 個驗潮站</div>'
      + '</div>'
      + '<button class="loc-btn" onclick="requestUserLocation()">📍 定位</button>'
      + '</div>';
  } else if (status === 'locating') {
    html = '<div class="loc-row">'
      + '<span class="loc-icon spin">📡</span>'
      + '<div class="loc-text">'
      + '<div class="loc-title">定位中…</div>'
      + '<div class="loc-sub">需要你授權位置存取</div>'
      + '</div>'
      + '</div>';
  } else if (status === 'success' && state.userLocation && state.nearestStations.length) {
    const loc = state.userLocation;
    const accuracyStr = window.geoLib.formatAccuracy(loc.accuracy);
    const inHK = window.geoLib.isLikelyHongKong(loc.lat, loc.lng);
    const nearest = state.nearestStations;
    const nearestStationsHtml = nearest.map((s, i) => {
      const medal = ['🥇','🥈','🥉'][i];
      const dist = window.geoLib.formatDistance(s.distanceKm);
      const bear = window.geoLib.formatBearing(s.bearingDeg);
      const estBadge = s.estimated ? ' <span class="loc-est">📐</span>' : '';
      return `<div class="loc-station-row" onclick="showStationOnMap('${s.code}')">
        <span class="loc-station-medal">${medal}</span>
        <span class="loc-station-name">${escapeHtml(s.name_zh)} <span class="loc-station-code">${s.code}</span>${estBadge}</span>
        <span class="loc-station-dist">${dist} ${bear}</span>
      </div>`;
    }).join('');
    html = '<div class="loc-row">'
      + '<span class="loc-icon">📍</span>'
      + '<div class="loc-text">'
      + '<div class="loc-title">你嘅位置 <span class="loc-acc">' + accuracyStr + '</span>' + (inHK ? '' : ' <span class="loc-warn">非香港範圍</span>') + '</div>'
      + '<div class="loc-sub">' + loc.lat.toFixed(4) + ', ' + loc.lng.toFixed(4) + ' · ' + new Date(loc.timestamp).toLocaleTimeString('zh-HK', {hour:'2-digit', minute:'2-digit'}) + '</div>'
      + '</div>'
      + '<button class="loc-btn-mini" onclick="requestUserLocation()" title="重新定位">🔄</button>'
      + '</div>'
      + '<div class="loc-station-list">' + nearestStationsHtml + '</div>';
  } else if (status === 'denied') {
    html = '<div class="loc-row loc-warn-row">'
      + '<span class="loc-icon">🚫</span>'
      + '<div class="loc-text">'
      + '<div class="loc-title">定位被拒絕</div>'
      + '<div class="loc-sub">請喺瀏覽器設定 → 網站權限 → 位置，啟用定位後重試</div>'
      + '</div>'
      + '<button class="loc-btn" onclick="requestUserLocation()">重試</button>'
      + '</div>';
  } else {
    // unavailable / timeout / error
    const errMsg = state.geoError || '無法取得位置';
    html = '<div class="loc-row loc-warn-row">'
      + '<span class="loc-icon">⚠️</span>'
      + '<div class="loc-text">'
      + '<div class="loc-title">定位失敗</div>'
      + '<div class="loc-sub">' + escapeHtml(errMsg) + '</div>'
      + '</div>'
      + '<button class="loc-btn" onclick="requestUserLocation()">重試</button>'
      + '</div>';
  }
  card.innerHTML = html;
}

function renderMapTideList(view) {
  if (!window.tidesLib) return;
  const stations = window.tidesLib.getAllStations();
  const now = Date.now();
  const cards = stations.map(st => {
    const cur = window.tidesLib.getCurrentTide(st.code, now);
    const curve = window.tidesLib.getTideCurve24h(st.code, now);
    const advice = window.tidesLib.getFishingAdvice(st.code, now);
    // 24h 內高低潮 events（用於 SVG markers）
    const eventsRaw = window.tidesLib.getEventsAround(st.code, now);
    const baseMs = curve[0] ? curve[0].ms : now;
    const endMs = baseMs + 24 * 3600000;
    const events24h = eventsRaw
      .filter(e => e.ms >= baseMs - 3600000 && e.ms <= endMs)
      .map((e, i, arr) => {
        const prev = arr[i - 1], next = arr[i + 1];
        const isHigh = (!prev || e.height > prev.height) && (!next || e.height > next.height);
        return { ms: e.ms, height: e.height, type: isHigh ? 'high' : 'low' };
      });
    const curH = cur.height === null ? '—' : cur.height.toFixed(2);
    const trendClass = cur.trend || 'unknown';
    const trendText = cur.trend === 'rising' ? '↗ 漲中' : cur.trend === 'falling' ? '↘ 退中' : '→ 平';
    const nextHigh = cur.nextHigh ? `${window.tidesLib.formatTime(cur.nextHigh.ms)} 高潮 ${cur.nextHigh.height}m` : '—';
    const nextLow  = cur.nextLow  ? `${window.tidesLib.formatTime(cur.nextLow.ms)} 低潮 ${cur.nextLow.height}m` : '—';
    const adviceHtml = advice.map(a => `<div>${a.icon} ${escapeHtml(a.text)}</div>`).join('');
    const estBadge = st.estimated
      ? `<span class="tide-card-est" title="基於 ${st.source} 站數據估算（誤差 ±10cm）">📐 估算</span>`
      : '';
    return `<div class="tide-card">
      <div class="tide-card-head">
        <span class="tide-card-name">📡 ${escapeHtml(st.name_zh)}</span>
        <div style="display:flex;gap:4px;align-items:center;">
          ${estBadge}
          <span class="tide-card-area">${escapeHtml(st.area)}</span>
        </div>
      </div>
      <div class="tide-card-now">
        <span class="tide-card-now-h">${curH}<span style="font-size:14px;color:var(--gray-4);font-weight:600;"> m</span></span>
        <span class="tide-card-now-trend ${trendClass}">${trendText}</span>
      </div>
      <div class="tide-card-next">
        🔼 下一個高潮：<b>${nextHigh}</b><br>
        🔽 下一個低潮：<b>${nextLow}</b>
      </div>
      <div class="tide-card-curve">${window.tidesLib.curveSvg(curve, 280, 130, { nowMs: now, events: events24h })}</div>
      <div class="tide-card-legend" style="font-size:10px;color:var(--gray-5);text-align:center;margin:-4px 0 6px;">
        <span style="color:#f97316;">▲ 高潮</span> · <span style="color:#0d9488;">▼ 低潮</span> · <span style="color:#ef4444;">● 現在</span>
      </div>
      <div class="tide-card-advice">${adviceHtml}</div>
      <button class="tide-card-action" onclick="showStationOnMap('${st.code}')">🗺️ 在地圖上顯示位置</button>
    </div>`;
  }).join('');
  view.innerHTML = '<div class="map-subtabs">'
    + '<button class="map-subtab" data-tab="map" onclick="switchMapTab(this.dataset.tab)">🗺️ 地圖</button>'
    + '<button class="map-subtab active" data-tab="tide" onclick="switchMapTab(this.dataset.tab)">🌊 潮汐</button>'
    + '<button class="map-subtab" data-tab="weather" onclick="switchMapTab(this.dataset.tab)">🌤️ 天氣</button>'
    + '</div>'
    + '<div class="tide-list"><div class="tide-list-grid">' + cards + '</div></div>';
}

function initMap(items) {
  // 銷毀舊實例（切換分頁時）
  if (mapInstance) { try { mapInstance.remove(); } catch(e) {} mapInstance = null; }
  mapMarkers = [];
  // 計算中心點（取所有 GPS 點的平均，或香港中心）
  const center = items.length === 1
    ? [items[0].latitude, items[0].longitude]
    : [items.reduce((s,c)=>s+c.latitude,0)/items.length, items.reduce((s,c)=>s+c.longitude,0)/items.length];

  // ===== Tile Layers =====
  // 1. CartoDB Positron（預設，無需 key，簡潔風格）
  //    Leaflet 直接吃 raster PNG，是最可靠的免費選擇
  const openFreeMap = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap contributors © CARTO',
    subdomains: 'abcd',
    maxZoom: 19,
    name: 'CartoDB'
  });

  // 2. MapTiler 繁體中文（需到 https://maptiler.com 註冊拿免費 key）
  //    免費額度 100K tile/月，個人使用綽綽有餘
  //    預設 key 在模組頂層宣告 DEFAULT_MAPTILER_KEY
  const MAPTILER_KEY = (typeof localStorage !== 'undefined' && localStorage.getItem('maptiler_key')) || DEFAULT_MAPTILER_KEY;
  const baseLayers = {
    '🗺️ CartoDB Positron': openFreeMap,
    '🇭🇰 MapTiler 繁體中文': L.tileLayer(`https://api.maptiler.com/maps/streets-v2/{z}/{x}/{y}.png?key=${MAPTILER_KEY}&language=zh-Hant`, {
      attribution: '© MapTiler © OpenStreetMap contributors',
      maxZoom: 19
    })
  };
  // 預設使用 MapTiler 繁中，fallback CartoDB
  let defaultLayer = baseLayers['🇭🇰 MapTiler 繁體中文'];

  mapInstance = L.map('map-canvas', { zoomControl: true }).setView(center, 11);
  defaultLayer.addTo(mapInstance);
  L.control.layers(baseLayers, null, { position: 'topright', collapsed: false }).addTo(mapInstance);

  items.forEach(c => {
    const color = c.isMine ? '#f97316' : (c.isDemo ? '#9ca3af' : '#0d9488');
    const radius = c.isMine ? 9 : 7;
    const marker = L.circleMarker([c.latitude, c.longitude], {
      radius, fillColor: color, color: '#fff', weight: 2, opacity: 1, fillOpacity: 0.85
    }).addTo(mapInstance);
    const popupHtml = '<div class="map-popup-title">'+(c.speciesIcon||'🐟')+' '+c.species+'</div>'
      + '<div class="map-popup-weight">'+c.weight+' 斤</div>'
      + '<div class="map-popup-meta">📍 '+c.spot+'<br>👤 '+c.user+'<br>📅 '+formatDate(c.date)+(c.time?' '+c.time:'')+(c.locationAccuracy?'<br>🎯 GPS ±'+c.locationAccuracy+'m':'')+'</div>';
    marker.bindPopup(popupHtml);
    mapMarkers.push(marker);
  });
  // 多個點自動調整視野
  if (items.length > 1) {
    const bounds = L.latLngBounds(items.map(c => [c.latitude, c.longitude]));
    mapInstance.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
  }
}

/* ============================================================
 * Route I+: 潮汐站 markers / popup / bar / refresh
 * ============================================================ */
let tideStationMarkers = [];  // 全域，畀 refreshTideMarkers 用

function addTideStationMarkers() {
  if (!mapInstance || !window.tidesLib) return;
  const showTide = localStorage.getItem('map_show_tide') !== '0';
  const stations = window.tidesLib.getAllStations();
  const now = Date.now();
  stations.forEach(st => {
    const t = window.tidesLib.getCurrentTide(st.code, now);
    const iconHtml = window.tidesLib.tideMarkerIcon(st.code, t.height, t.trend);
    const icon = L.divIcon({
      className: 'tide-marker-wrap',
      html: iconHtml,
      iconSize: [70, 56],
      iconAnchor: [35, 28],
    });
    const marker = L.marker([st.lat, st.lng], { icon, zIndexOffset: -500 }).addTo(mapInstance);
    marker.bindPopup(() => buildTideStationPopup(st.code), { maxWidth: 300 });
    marker._stationCode = st.code;
    if (!showTide) mapInstance.removeLayer(marker);
    tideStationMarkers.push(marker);
  });
}

function buildTideStationPopup(code) {
  const meta = window.tidesLib.getStationMeta(code);
  if (!meta) return '<div>無資料</div>';
  const now = Date.now();
  const cur = window.tidesLib.getCurrentTide(code, now);
  const nextTides = window.tidesLib.getNextTides(code, now, 4);
  const curvePoints = window.tidesLib.getTideCurve24h(code, now);
  const advice = window.tidesLib.getFishingAdvice(code, now);
  const curH = cur.height === null ? '—' : cur.height.toFixed(2);
  const trendIcon = cur.trend === 'rising' ? '↗ 漲中' : cur.trend === 'falling' ? '↘ 退中' : '→ 平';
  const trendClass = cur.trend || 'unknown';
  // 高低潮列表
  const tideRows = nextTides.map(e => {
    const isHigh = e.type === 'high';
    return `<div><b>${window.tidesLib.formatTime(e.ms)}</b> ${isHigh?'🔼':'🔽'}${e.height}m${isHigh?' (今日最大)':''}</div>`;
  }).join('');
  // 下一個高低潮
  const nextHighStr = cur.nextHigh ? `${window.tidesLib.formatTime(cur.nextHigh.ms)} 高潮 ${cur.nextHigh.height}m` : '—';
  const nextLowStr  = cur.nextLow  ? `${window.tidesLib.formatTime(cur.nextLow.ms)} 低潮 ${cur.nextLow.height}m` : '—';
  // 釣況建議
  const adviceHtml = advice.map(a => `<div>${a.icon} ${escapeHtml(a.text)}</div>`).join('');
  return `<div class="tide-popup">
    <div class="tide-popup-header">
      <span class="tide-popup-name">📡 ${escapeHtml(meta.name_zh)}</span>
      <span class="tide-popup-area">${escapeHtml(meta.area)}</span>
    </div>
    <div class="tide-popup-now">
      <span class="tide-popup-now-h">${curH}m</span>
      <span class="tide-popup-now-trend tide-bar-chip-val ${trendClass}">${trendIcon}</span>
    </div>
    <div class="tide-popup-next">
      下一個高潮：<b>${nextHighStr}</b><br>
      下一個低潮：<b>${nextLowStr}</b>
    </div>
    <div class="tide-popup-curve">${window.tidesLib.curveSvg(curvePoints, 240, 60)}</div>
    <div class="tide-popup-list">${tideRows || '—'}</div>
    <div class="tide-popup-advice">${adviceHtml}</div>
    <button class="tide-popup-action" onclick="showStationOnMap('${code}')">🗺️ 在地圖上顯示位置</button>
  </div>`;
}

function refreshTideMarkers() {
  if (!window.tidesLib || !mapInstance) return;
  const now = Date.now();
  tideStationMarkers.forEach(marker => {
    const code = marker._stationCode;
    const t = window.tidesLib.getCurrentTide(code, now);
    const newHtml = window.tidesLib.tideMarkerIcon(code, t.height, t.trend);
    // 更新 icon
    marker.setIcon(L.divIcon({
      className: 'tide-marker-wrap',
      html: newHtml,
      iconSize: [70, 56],
      iconAnchor: [35, 28],
    }));
  });
}

function refreshTideBar() {
  const bar = document.getElementById('tide-bar');
  if (!bar || !window.tidesLib) return;
  const stations = window.tidesLib.getAllStations();
  const now = Date.now();
  const chips = stations.map(st => {
    const t = window.tidesLib.getCurrentTide(st.code, now);
    const h = t.height === null ? '—' : t.height.toFixed(2);
    const trend = t.trend || 'unknown';
    return `<div class="tide-bar-chip" onclick="flyToTideStation('${st.code}')" title="${escapeHtml(st.area)}">
      <div class="tide-bar-chip-name">${escapeHtml(st.name_zh)}</div>
      <div class="tide-bar-chip-val ${trend}">${h}m ${trend==='rising'?'↗':trend==='falling'?'↘':'→'}</div>
    </div>`;
  }).join('');
  bar.innerHTML = `<div class="tide-bar-title">🌊 即時潮汐</div>${chips}`;
}

function flyToTideStation(code) {
  if (!mapInstance || !window.tidesLib) return;
  const meta = window.tidesLib.getStationMeta(code);
  if (!meta) return;
  mapInstance.flyTo([meta.lat, meta.lng], 13, { duration: 0.8 });
  // 開對應 marker popup
  const m = tideStationMarkers.find(x => x._stationCode === code);
  if (m) m.openPopup();
}

function toggleTideStations() {
  const current = localStorage.getItem('map_show_tide') !== '0';
  const next = !current;
  localStorage.setItem('map_show_tide', next ? '1' : '0');
  if (mapInstance && tideStationMarkers.length) {
    tideStationMarkers.forEach(m => {
      if (next) m.addTo(mapInstance); else mapInstance.removeLayer(m);
    });
  }
  // 更新 toggle button 樣式
  const btn = document.getElementById('tide-toggle');
  if (btn) {
    btn.classList.toggle('on', next);
    btn.textContent = '🌊 潮汐站' + (next ? ' ✓' : '');
  }
}

function startTripAtStation(code) {
  const meta = window.tidesLib.getStationMeta(code);
  if (!meta) return;
  // 預填釣點（用 spotMap 內嘅首個關鍵字，或者用站名）
  const data = window.tidesLib.loadData();
  let spotName = meta.name_zh;
  // 嘗試搵最匹配 FISHING_SPOTS 嘅釣點名
  for (const { p, s } of (data.spotMap || [])) {
    if (s === code && p.length) { spotName = p[0]; break; }
  }
  // 設置 state，導向行程 tab
  state.tripPickingSpot = spotName;
  state.tripPickingCustom = '';
  if (typeof closeMapOverlay === 'function') closeMapOverlay();
  // 關 popup
  if (mapInstance) mapInstance.closePopup();
  // 去行程 tab
  goToView('trips');
  toast('已預填釣點：' + spotName + '（' + meta.name_zh + '）');
}

/* ============================================================
 * Route J+: 喺地圖上顯示某個站（從潮汐/天氣/最近站跳轉）
 * ============================================================ */
let stationHighlightMarker = null;

function showStationOnMap(code) {
  if (!window.tidesLib) return;
  const meta = window.tidesLib.getStationMeta(code);
  if (!meta) { toast('搵唔到站：' + code); return; }

  // 切換到地圖 sub-tab
  state.mapTab = 'map';
  // 跳去地圖 view（如未喺度）
  if (state.view !== 'map') {
    goToView('map');
  } else {
    // 已喺地圖 view，強制 re-render map sub-tab
    renderMapView();
  }

  // 等 DOM 更新 + map init
  setTimeout(() => {
    // 如果地圖未初始化（用戶未有 GPS 魚獲），用空 list init
    if (!mapInstance) {
      try {
        const dummyCatch = [{
          latitude: meta.lat,
          longitude: meta.lng,
          species: meta.name_zh,
          weight: 0,
          spot: meta.name_zh,
          user: '你',
          date: new Date().toISOString().slice(0,10),
          time: '',
          locationAccuracy: 0,
          speciesIcon: '📡',
          isMine: false,
          isDemo: true,
          _highlightOnly: true
        }];
        initMap(dummyCatch);
      } catch(e) { console.warn('initMap fail', e); }
    }
    if (!mapInstance) return;

    // 移除舊 highlight marker
    if (stationHighlightMarker) {
      try { mapInstance.removeLayer(stationHighlightMarker); } catch(e) {}
      stationHighlightMarker = null;
    }

    // 高亮 marker（大紅色 pulse 動畫）
    const highlightIcon = L.divIcon({
      className: 'station-highlight-marker',
      html: '<div class="station-highlight-pulse"></div><div class="station-highlight-pin">📍</div>',
      iconSize: [40, 40],
      iconAnchor: [20, 20]
    });
    stationHighlightMarker = L.marker([meta.lat, meta.lng], {
      icon: highlightIcon,
      zIndexOffset: 1000
    }).addTo(mapInstance);

    // Popup 顯示站名 + 估算標記
    const estBadge = meta.estimated
      ? '<div style="margin-top:6px;"><span style="font-size:10px;background:rgba(245,166,35,0.15);color:#b45309;padding:2px 8px;border-radius:6px;font-weight:600;">📐 估算站（基於 ' + escapeHtml(meta.source || '最近') + '）</span></div>'
      : '';
    const popupHtml = '<div style="text-align:center;padding:4px 0;">'
      + '<div style="font-size:15px;font-weight:700;color:var(--dark);">📡 ' + escapeHtml(meta.name_zh) + '</div>'
      + '<div style="font-size:11px;color:var(--gray-4);margin-top:2px;">' + escapeHtml(meta.area) + '</div>'
      + '<div style="font-size:10px;color:var(--gray-5);margin-top:4px;font-family:monospace;">' + meta.lat.toFixed(4) + ', ' + meta.lng.toFixed(4) + '</div>'
      + estBadge
      + '</div>';
    stationHighlightMarker.bindPopup(popupHtml, { maxWidth: 240, offset: [0, -8] });
    stationHighlightMarker.openPopup();

    // Fly to 該位置
    mapInstance.flyTo([meta.lat, meta.lng], 13, { duration: 0.8 });

    // Toast 提示
    toast('📍 已跳到 ' + meta.name_zh);
  }, 80);
}

/* ===== Spots View ===== */
function getPokedexHTML() {
  // 我釣過的魚獲（含收藏的）
  const myCatches = state.catches.filter(c => c.isMine || c.imported);
  // 計算每個魚種的統計（含完整魚獲清單供展開用）
  const speciesStats = {};
  myCatches.forEach(c => {
    const s = speciesStats[c.species] = speciesStats[c.species] || { count: 0, biggest: 0, lastDate: '', catches: [] };
    s.count++;
    if (c.weight > s.biggest) s.biggest = c.weight;
    if (c.date > s.lastDate) s.lastDate = c.date;
    s.catches.push(c);
  });
  // 所有魚種（不含「其他」選項）— 自訂魚種永遠不會加入圖鑑
  const allSpecies = FISH_SPECIES.filter(f => !f.custom);
  const caughtCount = allSpecies.filter(f => speciesStats[f.name]).length;
  const total = allSpecies.length;
  const pct = total > 0 ? Math.round(caughtCount / total * 100) : 0;
  const rarityLabels = { common: '常見', uncommon: '少見', rare: '稀有' };
  let html = '<div class="pokedex-progress-box">'
    + '<div class="pokedex-progress-title">📖 魚種圖鑑</div>'
    + '<div class="pokedex-progress-bar"><div class="pokedex-progress-fill" style="width:'+pct+'%"></div></div>'
    + '<div class="pokedex-progress-text">已收集 <b>'+caughtCount+'</b> / '+total+' 種 · '+pct+'%</div>'
    + '</div>'
    + '<div class="pokedex-grid">';
  html += allSpecies.map(f => {
    const stats = speciesStats[f.name];
    const caught = !!stats;
    const rarityClass = 'rarity-' + (f.rarity || 'common');
    // Route G: 已解鎖卡片支援展開魚獲列表
    const expKey = 'pokedex_' + f.name;
    const isExpanded = caught && state.ui.expandedPokedex[expKey];
    if (caught) {
      let catchesHtml = '';
      if (isExpanded) {
        // 按日期新到舊排序
        const sortedCatches = [...stats.catches].sort((a, b) =>
          (b.date + ' ' + (b.time || '')).localeCompare(a.date + ' ' + (a.time || ''))
        );
        catchesHtml = '<div class="pokedex-catches-list">'
          + sortedCatches.map(c => renderPokedexCatchCard(c)).join('')
          + '</div>';
      }
      return '<div class="pokedex-card unlocked' + (isExpanded ? ' expanded' : '') + '">'
        + (f.custom ? '<span class="pokedex-custom-tag">自訂</span>' : '')
        + '<span class="pokedex-rarity ' + rarityClass + '">' + rarityLabels[f.rarity||'common'] + '</span>'
        + '<div class="pokedex-photo">' + speciesPhotoHtml(f.name, { klass: 'pokedex-photo-img', size: 96 }) + '</div>'
        + '<div class="pokedex-name">' + f.name + '</div>'
        + '<div class="pokedex-sci">' + (f.sci||'') + '</div>'
        + '<div class="pokedex-habitat">' + (f.habitat||'') + '</div>'
        + '<div class="pokedex-desc">' + (f.desc||'') + '</div>'
        + '<div class="pokedex-pb"><span class="pb-label">最大</span> ' + stats.biggest + '斤 <span class="pb-label">· ' + stats.count + '條</span></div>'
        + '<div class="pokedex-meta-row">'
        +   '<span class="pokedex-recent">最近：' + formatDate(stats.lastDate) + '</span>'
        +   '<button class="pokedex-expand-btn" onclick="togglePokedexSpecies(\'' + f.name.replace(/'/g, "\\'") + '\')">'
        +     (isExpanded ? '收起 ▲' : '展開 ' + stats.count + ' 筆 ▼')
        +   '</button>'
        + '</div>'
        + catchesHtml
        + '</div>';
    } else {
      return '<div class="pokedex-card locked">'
        + '<span class="pokedex-rarity '+rarityClass+'">'+rarityLabels[f.rarity||'common']+'</span>'
        + '<div class="pokedex-lock-icon">❓</div>'
        + '<div class="pokedex-name">'+f.name+'</div>'
        + '<div class="pokedex-locked-text">未解鎖</div>'
        + '<div class="pokedex-desc" style="margin-top:4px;">'+(f.habitat||'')+'</div>'
        + '</div>';
    }
  }).join('');
  html += '</div>';
  return html;
}

// Route G: 圖鑑展開用的簡化版 catch card
function renderPokedexCatchCard(c) {
  // Route Real-photo: 用戶上傳照片 → 魚種真實照片 → SVG fallback
  const thumb = catchThumbHtml(c, { klass: 'pokedex-catch-thumb-img' });
  return '<div class="pokedex-catch-row">'
    + '<div class="pokedex-catch-thumb">' + thumb + '</div>'
    + '<div class="pokedex-catch-info">'
    +   '<div class="pokedex-catch-weight">' + c.weight + '<span>斤</span>'
    +     (c.length ? '<span class="pokedex-catch-length">' + c.length + 'cm</span>' : '')
    +   '</div>'
    +   '<div class="pokedex-catch-meta">' + c.spot + (c.method ? ' · 🎣 ' + c.method : '') + '</div>'
    +   '<div class="pokedex-catch-date">📅 ' + formatDate(c.date) + ' ' + (c.time || '') + (c.verified ? ' <span class="pokedex-verified">✓ 有效</span>' : '') + '</div>'
    + '</div>'
    + '</div>';
}

      dbLoadTrips().then(trips => { state.trips = trips; renderTripsView(); });

}

function showToast(msg) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), 2000);
}

window.handleAuthSubmit = async function() {
  const username = document.getElementById('auth-username').value.trim();
  const pin = document.getElementById('auth-pin').value;
  const msgEl = document.getElementById('auth-msg');
  const btn = document.getElementById('auth-submit');
  if (!username || !pin) { msgEl.textContent = '請填寫用戶名同 PIN'; return; }

  btn.disabled = true; msgEl.textContent = authMode === 'login' ? '登入中...' : '註冊中...';
  try {
    if (authMode === 'register') await sbRegister(username, pin);
    else await sbLogin(username, pin);
    // 成功：執行 migration + 載入數據
    const migrated = await migrateLocalCatches();
    await seedDemoDataIfNeeded();
    state.catches = await dbLoadCatches();
    // 啟動補傳
    retryUnsyncedCatches();
    document.getElementById('login-screen').innerHTML = '';
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('header').style.display = '';
    document.getElementById('bottom-nav').style.display = '';

    switchView('my');

async function init() {
  if (SB_ENABLED) {
    const savedId = localStorage.getItem('hk_fishing_user_id');
    if (savedId) {
      const { data: user } = await sb.from('users').select('*').eq('id', savedId).maybeSingle();
      if (user) state.user = user;
    }
    if (!state.user) {
      // 雲端模式但未登入：顯示登入畫面
      renderLoginScreen();
      setupGlobalHandlers();
      return;
    }
    // 已登入：執行 migration + 載入雲端數據
    try {
      const migrated = await migrateLocalCatches();
      if (migrated > 0) toast('已從本地匯入 ' + migrated + ' 條舊記錄');
      const seeded = await seedDemoDataIfNeeded();
      state.catches = await dbLoadCatches();
      // 啟動補傳:把之前未同步的魚獲重試上傳
      retryUnsyncedCatches();
    } catch (e) {
      console.error('Init failed', e);
      toast('雲端載入失敗：' + e.message);
      renderLoginScreen();
      return;
    }
  } else {
    state.catches = await loadCatches();  // FIX: await 因為 loadCatches 係 async function
  }
  setupGlobalHandlers();
  document.getElementById('header-username').textContent = getUserName();
  // Route H: 載入歷史行程（必做，否則重整後看不到歷史）
  if (SB_ENABLED && state.user) {
    try { state.trips = await dbLoadTrips(); } catch(e) { console.warn('dbLoadTrips init failed', e); }
    try { await resumeActiveTrip(); } catch(e) { console.warn('resumeActiveTrip failed', e); }
  }
  checkSharedCatch();
  switchView('my');
}

/* ===== Event Delegation（避免 inline onclick 嘅 escape 陷阱）===== */
// 分享掣統一處理（catch-card + modal 入面兩個掣 + 成功畫面）
document.addEventListener('click', function(e) {
  // 0. 成功畫面嘅「即時分享這條魚獲」
  const shareLastBtn = e.target.closest('[data-action="share-last"]');
  if (shareLastBtn) {
    e.preventDefault();
    e.stopPropagation();
    try {
      // 1. 首先試用 state.lastCatchId 對應嘅 catch
      let id = state.lastCatchId;
      let found = id ? state.catches.find(x => x.id === id) : null;

      // 2. Fallback: 因為 race condition (dbAddCatch callback 仲未跑完)，
      //    lastCatchId 仲係 temp-id 而 state.catches[0].id 已經被改做 saved.id
      //    用最新加入嘅 catch (state.catches[0]，因為 submitCatch 用 unshift)
      if (!found && state.catches.length > 0) {
        const latest = state.catches[0];
        if (latest && (latest.isMine || latest.user === getUserName())) {
          found = latest;
          state.lastCatchId = latest.id;  // 同步返 state
        }
      }

      if (!found) {
        showToast('⚠️ 暫時無法分享，請先記錄一條魚獲');
        return;
      }
      shareCatch(found.id);
    } catch (err) {
      console.error('[share-last] error:', err);
      showToast('分享出錯：' + err.message);
    }
    return;
  }

  // 1. 撳 catch card 嘅 📤 分享
  const shareBtn = e.target.closest('[data-share-id]');
  if (shareBtn) {
    e.preventDefault();
    e.stopPropagation();
    try {
      shareCatch(shareBtn.dataset.shareId);
    } catch (err) {
      console.error('[share] error:', err);
      showToast('分享出錯：' + err.message);
    }
    return;
  }

  // 2. 撳 modal 入面嘅「系統分享」
  const nsBtn = e.target.closest('[data-action="native-share"]');
  if (nsBtn) {
    e.preventDefault();
    e.stopPropagation();
    try {
      nativeShare(nsBtn.dataset.data);
    } catch (err) {
      console.error('[nativeShare] error:', err);
      showToast('分享出錯：' + err.message);
    }
    return;
  }

  // 3. 撳 modal 入面嘅「複製連結」
  const cpBtn = e.target.closest('[data-action="copy-share"]');
  if (cpBtn) {
    e.preventDefault();
    e.stopPropagation();
    try {
      copyShareLink(cpBtn.dataset.data);
    } catch (err) {
      console.error('[copyShareLink] error:', err);
      showToast('複製出錯：' + err.message);
    }
    return;
  }
});

// 強制 unregister 舊 service worker（解決緩存問題）
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    regs.forEach(reg => reg.unregister());
  });
}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
